<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal lost — Roxan</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04050b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='o' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238ff5d8'/%3E%3Cstop offset='.35' stop-color='%2386a9ff'/%3E%3Cstop offset='.65' stop-color='%23b58cff'/%3E%3Cstop offset='1' stop-color='%23ff8fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='%2304050b'/%3E%3Ccircle cx='16' cy='16' r='10' fill='url(%23o)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400..600&family=Geist:wght@400..600&family=Geist+Mono:wght@400..500&display=swap" rel="stylesheet">
<!-- Absolute, because this page answers every missing path at any depth. -->
<link rel="stylesheet" href="/roxan.css">
<style>
  .lost { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; text-align: center; overflow: hidden; isolation: isolate; padding: 40px 20px; }
  .lost .aurora { z-index: -1; }
  .lost .floor { z-index: -1; }
  .lost .code404 { font-family: var(--fm); font-size: 12px; letter-spacing: .3em; color: var(--cyan); }
  .lost h1 { margin-top: 18px; font-family: var(--fd); font-weight: 500; font-size: clamp(34px, 5vw, 60px); letter-spacing: -.045em; line-height: 1.05; }
  .lost p { margin: 16px auto 0; max-width: 44ch; color: var(--muted); }
  .lost .hero-cta { margin-top: 30px; }
  .lost .ring { width: 120px; height: 120px; margin: 0 auto 30px; border-radius: 50%; background: var(--holo-conic); filter: blur(18px); opacity: .8; animation: spin 8s linear infinite; }
</style>
</head>
<body>
<main class="lost">
  <div class="aurora" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"></div>
  <div>
    <div class="ring" aria-hidden="true"></div>
    <p class="code404">ERROR 404</p>
    <h1>Signal lost.</h1>
    <p>Roxan looked everywhere, but there's nothing at this address. It may have moved, or it may never have been here at all.</p>
    <div class="hero-cta">
      <a class="btn btn-holo" href="/">Back to Roxan</a>
      <a class="btn btn-glass" href="https://oplocloud.com/">Go to oplocloud.com</a>
    </div>
  </div>
</main>
</body>
</html>
