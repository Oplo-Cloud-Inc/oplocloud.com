<text x="36" y="72" font-size="13" fill="#2a78d6" font-weight="700">ATMOSPHERE · air</text>
<text x="500" y="216" font-size="13" fill="#14507f" font-weight="700">HYDROSPHERE · water</text>
<text x="36" y="334" font-size="13" fill="#6b5b3e" font-weight="700">GEOSPHERE · rock and soil</text>
