<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 482" width="700" height="482" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Earth's four spheres drawn as one scene: air above, a hill of rock and soil on the left, the sea filling the basin on the right. The biosphere is not drawn as a fourth layer. Living things appear inside all three at once — birds in the air, a tree rooted in the rock, kelp and fish in the sea, and a burrowing animal underground. Below the scene, three cards name interactions between the spheres: leaves take carbon dioxide from the air and give back oxygen; rain falls from the air into the sea and water evaporates back; rivers carry minerals out of the rock into the sea.</title>
<rect width="700" height="482" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Four spheres, one scene — and life runs through all of them</text>
