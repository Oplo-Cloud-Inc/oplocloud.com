<text x="268" y="326" font-size="12.5" fill="#4a3f2a">life in the soil</text>
<rect x="22" y="372" width="212" height="62" fill="#ffffff" rx="10" stroke="#12915a" stroke-width="1.4"/>
<text x="35" y="393" font-size="13.5" fill="#12915a" font-weight="600">Biosphere ↔ atmosphere</text>
<text x="35" y="411" font-size="13" fill="#6e6e73">leaves take in CO₂,</text>
<text x="35" y="427" font-size="13" fill="#6e6e73">give back O₂</text>
<line x1="128" y1="370" x2="170.72301243580046" y2="173.8625338174615" stroke="#12915a" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M 172.0 168.0 L 173.8 176.8 L 166.7 175.2 Z" fill="#12915a"/>
<rect x="244" y="372" width="212" height="62" fill="#ffffff" rx="10" stroke="#6b5b3e" stroke-width="1.4"/>
<text x="257" y="393" font-size="13.5" fill="#6b5b3e" font-weight="600">Geosphere ↔ hydrosphere</text>
<text x="257" y="411" font-size="13" fill="#6e6e73">rivers carry minerals</text>
<text x="257" y="427" font-size="13" fill="#6e6e73">to the sea</text>
<line x1="350" y1="370" x2="355.78063456489565" y2="211.9959885595189" stroke="#6b5b3e" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M 356.0 206.0 L 359.4 214.3 L 352.0 214.1 Z" fill="#6b5b3e"/>
<rect x="466" y="372" width="212" height="62" fill="#ffffff" rx="10" stroke="#2a78d6" stroke-width="1.4"/>
<text x="479" y="393" font-size="13.5" fill="#2a78d6" font-weight="600">Atmosphere ↔ hydrosphere</text>
<text x="479" y="411" font-size="13" fill="#6e6e73">rain falls,</text>
<text x="479" y="427" font-size="13" fill="#6e6e73">water evaporates</text>
<line x1="572" y1="370" x2="593.1725398203256" y2="217.9426685631165" stroke="#2a78d6" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="5 5"/>
<path d="M 594.0 212.0 L 596.5 220.6 L 589.2 219.6 Z" fill="#2a78d6"/>
<text x="22" y="460" font-size="14.5" fill="#1d1d1f">The biosphere is not a fourth layer stacked on the others. It is the life inside them — which is why a change</text>
<text x="22" y="478" font-size="14.5" fill="#1d1d1f">in any one sphere is felt in all four.</text>
</svg>
