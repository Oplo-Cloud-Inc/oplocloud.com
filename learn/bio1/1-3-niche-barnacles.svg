<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Connell's barnacle experiment, drawn twice on the same rocky shore. On the left, when the larger barnacle Semibalanus is removed, Chthamalus grows all the way from the high shore down to the low shore: that whole stretch is its fundamental niche, the range the physical conditions allow. On the right, with Semibalanus present, Chthamalus is found only on the high shore, because Semibalanus grows faster and crowds it off the rock lower down. That narrower band is its realised niche.</title>
<rect width="700" height="470" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">The same rock, the same tides — and one species in the way</text>
<rect x="40" y="92" width="250" height="252" fill="#efe9e1" rx="10"/>
<line x1="48" y1="106" x2="282" y2="106" stroke="#8fb8d8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="52" y="100" font-size="11.5" fill="#4f7fa3" font-weight="700">HIGH TIDE</text>
<line x1="48" y1="330" x2="282" y2="330" stroke="#8fb8d8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="52" y="324" font-size="11.5" fill="#4f7fa3" font-weight="700">LOW TIDE</text>
<text x="165" y="56" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">Semibalanus removed</text>
<text x="165" y="76" font-size="13" fill="#6e6e73" text-anchor="middle">what Chthamalus CAN do</text>
<rect x="410" y="92" width="250" height="252" fill="#efe9e1" rx="10"/>
<line x1="418" y1="106" x2="652" y2="106" stroke="#8fb8d8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="422" y="100" font-size="11.5" fill="#4f7fa3" font-weight="700">HIGH TIDE</text>
<line x1="418" y1="330" x2="652" y2="330" stroke="#8fb8d8" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="6 4"/>
<text x="422" y="324" font-size="11.5" fill="#4f7fa3" font-weight="700">LOW TIDE</text>
<text x="535" y="56" font-size="15" fill="#1d1d1f" font-weight="600" text-anchor="middle">Semibalanus present</text>
<text x="535" y="76" font-size="13" fill="#6e6e73" text-anchor="middle">what Chthamalus actually does</text>
<rect x="58" y="116" width="96" height="204" fill="#e0b24a" rx="7"/>
<text x="106" y="215.0" font-size="13" fill="#3d2f10" font-weight="700" text-anchor="middle">Chthamalus</text>
<text x="106" y="232.0" font-size="12" fill="#3d2f10" text-anchor="middle">top to bottom</text>
<text x="170" y="152" font-size="12.5" fill="#8a6a1f" font-weight="700">FUNDAMENTAL</text>
<text x="170" y="170" font-size="12.5" fill="#8a6a1f" font-weight="700">NICHE</text>
<text x="170" y="192" font-size="12.5" fill="#6e6e73">everywhere the</text>
<text x="170" y="209" font-size="12.5" fill="#6e6e73">tide and the heat</text>
<text x="170" y="226" font-size="12.5" fill="#6e6e73">allow it to live</text>
<rect x="428" y="116" width="96" height="72" fill="#e0b24a" rx="7"/>
<text x="476" y="149.0" font-size="13" fill="#3d2f10" font-weight="700" text-anchor="middle">Chthamalus</text>
<text x="476" y="166.0" font-size="12" fill="#3d2f10" text-anchor="middle">high shore only</text>
<rect x="428" y="192" width="96" height="128" fill="#5d8fbe" rx="7"/>
<text x="476" y="253.0" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Semibalanus</text>
<text x="476" y="270.0" font-size="12" fill="#ffffff" text-anchor="middle">all the rest</text>
<text x="540" y="136" font-size="12.5" fill="#8a6a1f" font-weight="700">REALISED</text>
<text x="540" y="154" font-size="12.5" fill="#8a6a1f" font-weight="700">NICHE</text>
<text x="540" y="242" font-size="12.5" fill="#6e6e73">Semibalanus grows</text>
<text x="540" y="259" font-size="12.5" fill="#6e6e73">faster and prises</text>
<text x="540" y="276" font-size="12.5" fill="#6e6e73">the smaller barnacle</text>
<text x="540" y="293" font-size="12.5" fill="#6e6e73">off the rock</text>
<line x1="300" y1="218" x2="393.0" y2="218.0" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 400.0 218.0 L 390.4 222.3 L 390.4 213.7 Z" fill="#c0392b"/>
<text x="350" y="206" font-size="12.5" fill="#c0392b" font-weight="600" text-anchor="middle">add a competitor</text>
<text x="22" y="392" font-size="14.5" fill="#1d1d1f">The fundamental niche is set by the physical world. The realised niche is what is left after every other species</text>
<text x="22" y="412" font-size="14.5" fill="#1d1d1f">has had its say — so a niche can shrink without a single thing about the weather changing.</text>
<text x="22" y="436" font-size="13" fill="#6e6e73">Drawn from J. H. Connell's 1961 experiment on the Scottish coast: he scraped one species off the rock and watched</text>
<text x="22" y="454" font-size="13" fill="#6e6e73">what the other did.</text>
</svg>
