<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A column of ocean from the surface to 4,000 metres, shading from pale blue to black. The sunlight zone runs from the surface to 200 metres and holds almost all ocean life, because photosynthesis needs light; about 1 per cent of surface light is left at its base. The twilight zone runs from 200 to 1,000 metres, where there is light to see by but not enough to grow. Below 1,000 metres is the midnight zone: no sunlight at all, and food falls from above.</title>
<rect width="700" height="470" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">In the ocean, the abiotic factor that decides everything is light</text>
<rect x="96" y="60.0" width="268" height="96.6" fill="#8fc4e8"/>
<rect x="96" y="156.6" width="268" height="93.3" fill="#2f6f9e"/>
<rect x="96" y="249.9" width="268" height="150.1" fill="#0f2740"/>
<rect x="96" y="60" width="268" height="340" fill="none" stroke="#d2d2d7" stroke-width="1"/>
<text x="110" y="86.0" font-size="15" fill="#123b57" font-weight="700">Sunlight zone</text>
<text x="110" y="105.0" font-size="13" fill="#123b57">0 – 200 m</text>
<line x1="368" y1="60.0" x2="396" y2="60.0" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="404" y="84.0" font-size="13.5" fill="#6e6e73">Enough light to grow. Almost every plant,</text>
<text x="404" y="103.0" font-size="13.5" fill="#6e6e73">alga and coral in the sea is here.</text>
<text x="110" y="182.61539168288948" font-size="15" fill="#ffffff" font-weight="700">Twilight zone</text>
<text x="110" y="201.61539168288948" font-size="13" fill="#ffffff">200 – 1,000 m</text>
<line x1="368" y1="156.61539168288948" x2="396" y2="156.61539168288948" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="404" y="180.61539168288948" font-size="13.5" fill="#6e6e73">Light to see by, not to grow by. No</text>
<text x="404" y="199.61539168288948" font-size="13.5" fill="#6e6e73">photosynthesis below this.</text>
<text x="110" y="275.9388134722774" font-size="15" fill="#ffffff" font-weight="700">Midnight zone</text>
<text x="110" y="294.9388134722774" font-size="13" fill="#ffffff">below 1,000 m</text>
<line x1="368" y1="249.93881347227742" x2="396" y2="249.93881347227742" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="404" y="273.9388134722774" font-size="13.5" fill="#6e6e73">No sunlight at all. Food falls from above,</text>
<text x="404" y="292.9388134722774" font-size="13.5" fill="#6e6e73">or is made by chemistry at vents.</text>
<circle cx="87" cy="70.4" r="3.5" fill="#1d1d1f"/>
<text x="80" y="74.9" font-size="12.5" fill="#6e6e73" text-anchor="end">1 m</text>
<circle cx="87" cy="87.5" r="3.5" fill="#1d1d1f"/>
<text x="80" y="92.0" font-size="12.5" fill="#6e6e73" text-anchor="end">10 m</text>
<circle cx="87" cy="156.6" r="3.5" fill="#1d1d1f"/>
<text x="80" y="161.1" font-size="12.5" fill="#6e6e73" text-anchor="end">200 m</text>
<circle cx="87" cy="249.9" r="3.5" fill="#1d1d1f"/>
<text x="80" y="254.4" font-size="12.5" fill="#6e6e73" text-anchor="end">1000 m</text>
<text x="404" y="372" font-size="13.5" fill="#1d1d1f" font-weight="600">About 1% of the surface light is left at 200 m.</text>
<text x="404" y="391" font-size="13.5" fill="#6e6e73">That is the line photosynthesis cannot cross.</text>
<text x="22" y="436" font-size="14.5" fill="#1d1d1f">Depth in the ocean does what latitude and elevation do on land: it takes away the energy, and life thins out with it.</text>
<text x="22" y="456" font-size="14.5" fill="#1d1d1f">Everything below 200 m is eating something that grew above it.</text>
</svg>
