<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 424" width="700" height="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three squares of ground, each holding the same number of individuals arranged differently. In clumped dispersion they sit in a few tight groups, which is what most species do, because resources come in patches and groups are safer. In uniform dispersion they are evenly spaced, which happens when individuals push each other apart, as nesting penguins do. In random dispersion there is no pattern at all, which is rare and happens when individuals neither attract nor repel each other.</title>
<rect width="700" height="424" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Same number of individuals, three ways of being arranged</text>
