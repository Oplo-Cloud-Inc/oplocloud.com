<text x="460" y="282" font-size="16" fill="#1d1d1f" font-weight="600">Random</text>
<text x="460" y="302" font-size="12.8" fill="#6e6e73">No attraction, no repulsion.</text>
<text x="460" y="318" font-size="12.8" fill="#6e6e73">Genuinely rare in nature.</text>
<text x="460" y="334" font-size="12.8" fill="#eb6834" font-style="italic">Dandelions landing where the</text>
<text x="460" y="350" font-size="12.8" fill="#eb6834" font-style="italic">wind drops them.</text>
<text x="22" y="316" font-size="14.5" fill="#1d1d1f">Density says how many are in a place. Dispersion says how they are spread through it — and the pattern is a clue</text>
<text x="22" y="415" font-size="14.5" fill="#1d1d1f">to how they live.</text>
</svg>
