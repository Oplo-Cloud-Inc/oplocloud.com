<text x="22" y="282" font-size="16" fill="#1d1d1f" font-weight="600">Clumped</text>
<text x="22" y="302" font-size="12.8" fill="#6e6e73">Most species. Food, shelter</text>
<text x="22" y="318" font-size="12.8" fill="#6e6e73">and safety all come in</text>
<text x="22" y="334" font-size="12.8" fill="#6e6e73">patches.</text>
<text x="22" y="334" font-size="12.8" fill="#2a78d6" font-style="italic">Herring in a shoal; elephants</text>
<text x="22" y="350" font-size="12.8" fill="#2a78d6" font-style="italic">in a herd.</text>
