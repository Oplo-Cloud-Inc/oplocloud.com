<text x="241" y="282" font-size="16" fill="#1d1d1f" font-weight="600">Uniform</text>
<text x="241" y="302" font-size="12.8" fill="#6e6e73">Individuals push each other</text>
<text x="241" y="318" font-size="12.8" fill="#6e6e73">apart — territory, or roots</text>
<text x="241" y="334" font-size="12.8" fill="#6e6e73">competing for water.</text>
<text x="241" y="334" font-size="12.8" fill="#12915a" font-style="italic">Nesting penguins, one pecking</text>
<text x="241" y="350" font-size="12.8" fill="#12915a" font-style="italic">distance apart.</text>
