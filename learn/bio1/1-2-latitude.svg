<rect x="251.8" y="372" width="65.5" height="22" fill="#7fae4e"/>
<text x="284.55294117647054" y="388" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Subtropics</text>
<rect x="317.3" y="372" width="142.4" height="22" fill="#5d9bb8"/>
<text x="388.47058823529414" y="388" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Temperate</text>
<rect x="459.6" y="372" width="142.4" height="22" fill="#b9c8d2"/>
<text x="530.8235294117648" y="388" font-size="13" fill="#ffffff" font-weight="600" text-anchor="middle">Polar</text>
<text x="22" y="414" font-size="14.5" fill="#1d1d1f">Counted for birds, ants, frogs or fish the curve looks the same. Warmth, water and sunlight all peak at the equator,</text>
<text x="22" y="433" font-size="14.5" fill="#1d1d1f">and they have been steady there for far longer than anywhere the ice sheets reached.</text>
</svg>
