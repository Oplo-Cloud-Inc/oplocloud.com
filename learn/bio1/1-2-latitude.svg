<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Tree species counted in one hectare of forest, plotted against latitude. The curve falls steeply away from the equator: about 650 species in a hectare at Yasuni in Ecuador near the equator, roughly 25 in a temperate forest at 40 degrees, and about 3 in boreal forest at 60 degrees. Above 70 degrees there are no trees at all.</title>
