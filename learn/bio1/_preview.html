<!doctype html><meta charset="utf-8"><title>bio1 diagrams</title>
<style>body{font:14px -apple-system,sans-serif;background:#fff;margin:0;padding:24px}
img{display:block;width:700px;max-width:100%;margin:0 0 6px;border:1px solid #eee}
h2{font-size:13px;color:#888;font-weight:600;margin:26px 0 6px}</style>
<div id=o></div>
<script>
fetch('list.json?t='+Date.now()).then(r=>r.json()).then(fs=>{
  document.getElementById('o').innerHTML = fs.map(f=>'<h2>'+f+'</h2><img src="'+f+'?t='+Date.now()+Math.random()+'">').join('');
});
</script>
