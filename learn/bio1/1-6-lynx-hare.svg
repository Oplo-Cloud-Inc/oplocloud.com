<text x="40" y="372" font-size="14" fill="#1d1d1f" font-weight="700">The obvious reading is not the whole one</text>
<text x="40" y="392" font-size="12.8" fill="#6e6e73">Lynx do not simply eat the hares down. When Krebs and his colleagues fed hares and fenced predators out,</text>
<text x="40" y="410" font-size="12.8" fill="#6e6e73">it took BOTH to flatten the cycle — food and predators together, not either one alone.</text>
