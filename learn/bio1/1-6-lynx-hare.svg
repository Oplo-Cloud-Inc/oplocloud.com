<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The snowshoe hare and Canada lynx cycle, drawn to the shape of the Hudson's Bay Company fur records. Both lines rise and fall on a repeating cycle of about ten years. The hare's peaks come first and are much larger; the lynx's peaks follow one to two years behind and are smaller. The two lines chase each other without either ever settling.</title>
<rect width="700" height="440" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Predator and prey, chasing each other for a century</text>
