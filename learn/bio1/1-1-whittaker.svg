<path d="M 508.9 361.3 L 602.0 357.7 L 602.0 246.8 L 477.9 272.7 L 477.9 313.3 Z" fill="#d8d79a" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 477.9 272.7 L 602.0 246.8 L 602.0 69.4 L 488.3 106.3 L 446.9 158.1 L 446.9 217.2 Z" fill="#9ecfa0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="183.2127659574468" y="388.445652173913" font-size="13.5" fill="#4a5a63" font-weight="600" text-anchor="middle">Tundra</text>
<text x="196.65531914893617" y="350.5652173913044" font-size="13.5" fill="#2c5e3d" font-weight="600" text-anchor="middle">Boreal forest</text>
<text x="312.468085106383" y="358.3478260869565" font-size="13.5" fill="#7a6a2a" font-weight="600" text-anchor="middle">Temperate</text>
<text x="312.468085106383" y="373.3478260869565" font-size="13.5" fill="#7a6a2a" font-weight="600" text-anchor="middle">grassland / desert</text>
<text x="459.30212765957447" y="358.3478260869565" font-size="13.5" fill="#7a5f28" font-weight="600" text-anchor="middle">Woodland</text>
<text x="459.30212765957447" y="373.3478260869565" font-size="13.5" fill="#7a5f28" font-weight="600" text-anchor="middle">and shrub</text>
<text x="368.3063829787235" y="289.2173913043478" font-size="13.5" fill="#2e6b34" font-weight="600" text-anchor="middle">Temperate forest</text>
<text x="366.7553191489362" y="199.43478260869566" font-size="13.5" fill="#1d6b57" font-weight="600" text-anchor="middle">Temperate</text>
<text x="366.7553191489362" y="214.43478260869566" font-size="13.5" fill="#1d6b57" font-weight="600" text-anchor="middle">rainforest</text>
<text x="552.8829787234042" y="377.75" font-size="13.5" fill="#8a6a1f" font-weight="600" text-anchor="middle">Subtropical</text>
<text x="552.8829787234042" y="392.75" font-size="13.5" fill="#8a6a1f" font-weight="600" text-anchor="middle">desert</text>
<text x="533.7531914893617" y="307.34782608695656" font-size="13.5" fill="#6f7a22" font-weight="600" text-anchor="middle">Tropical seasonal</text>
<text x="533.7531914893617" y="322.34782608695656" font-size="13.5" fill="#6f7a22" font-weight="600" text-anchor="middle">forest / savanna</text>
<text x="510.65957446808505" y="175.41304347826087" font-size="13.5" fill="#1c6b34" font-weight="600" text-anchor="middle">Tropical</text>
<text x="510.65957446808505" y="190.41304347826087" font-size="13.5" fill="#1c6b34" font-weight="600" text-anchor="middle">rainforest</text>
<text x="136.68085106382978" y="106.3478260869565" font-size="14" fill="#86868b" font-weight="600">Nowhere on Earth</text>
<text x="136.68085106382978" y="128.52173913043475" font-size="14" fill="#86868b">is this cold and this wet.</text>
<text x="116" y="434" font-size="13.5" fill="#6e6e73">colder</text>
<text x="602" y="434" font-size="13.5" fill="#6e6e73" text-anchor="end">hotter</text>
<text x="22" y="466" font-size="14.5" fill="#1d1d1f">A biome is not decided by which continent you are on. Deserts on four continents match each other more closely</text>
<text x="22" y="486" font-size="14.5" fill="#1d1d1f">than a desert matches the forest 200 km away, because the two numbers on these axes are what life has to survive.</text>
</svg>
