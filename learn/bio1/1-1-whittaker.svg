<path d="M 116.0 372.4 L 116.0 324.4 L 250.4 313.3 L 260.8 361.3 L 240.1 361.3 Z" fill="#bcd2c0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M 260.8 402.0 L 240.1 361.3 L 250.4 313.3 L 395.2 328.1 L 415.9 402.0 Z" fill="#e8dfc0" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
