<text x="107" y="110.8478260869565" font-size="13.5" fill="#6e6e73" text-anchor="end">400</text>
<text x="359.0" y="440" font-size="14.5" fill="#6e6e73" text-anchor="middle">Average temperature over a year (°C)</text>
<text transform="rotate(-90 64 232.0)" x="64" y="232.0" font-size="14.5" fill="#6e6e73" text-anchor="middle">Rainfall over a year (cm)</text>
