<text x="281.44680851063833" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">0</text>
<line x1="333.1489361702128" y1="402" x2="333.1489361702128" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="333.1489361702128" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">5</text>
<line x1="384.8510638297872" y1="402" x2="384.8510638297872" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="384.8510638297872" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">10</text>
<line x1="436.55319148936167" y1="402" x2="436.55319148936167" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="436.55319148936167" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">15</text>
<line x1="488.25531914893617" y1="402" x2="488.25531914893617" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="488.25531914893617" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">20</text>
<line x1="539.9574468085107" y1="402" x2="539.9574468085107" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="539.9574468085107" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">25</text>
<line x1="591.6595744680851" y1="402" x2="591.6595744680851" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="591.6595744680851" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">30</text>
<line x1="111" y1="402.0" x2="116" y2="402.0" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="107" y="406.5" font-size="13.5" fill="#6e6e73" text-anchor="end">0</text>
<line x1="111" y1="328.0869565217391" x2="116" y2="328.0869565217391" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="107" y="332.5869565217391" font-size="13.5" fill="#6e6e73" text-anchor="end">100</text>
<line x1="111" y1="254.17391304347825" x2="116" y2="254.17391304347825" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="107" y="258.67391304347825" font-size="13.5" fill="#6e6e73" text-anchor="end">200</text>
