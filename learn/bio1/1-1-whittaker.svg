<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Whittaker's biome diagram. The horizontal axis is average yearly temperature from minus 15 to 30 degrees Celsius; the vertical axis is average yearly rainfall from 0 to 450 centimetres. Nine biomes fill a triangular area: tundra and boreal forest in the cold and dry corner, temperate grassland, desert, woodland and temperate forest in the middle, and tropical seasonal forest and tropical rainforest in the hot, wet corner. The top left is empty: nowhere on Earth is both freezing and soaking wet.</title>
<rect width="700" height="500" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Two numbers decide which biome you are standing in</text>
<line x1="116" y1="402" x2="602" y2="402" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="116" y1="62" x2="116" y2="402" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="126.34042553191489" y1="402" x2="126.34042553191489" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="126.34042553191489" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">-15</text>
<line x1="178.04255319148936" y1="402" x2="178.04255319148936" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="178.04255319148936" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">-10</text>
<line x1="229.74468085106383" y1="402" x2="229.74468085106383" y2="407" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="229.74468085106383" y="422" font-size="13.5" fill="#6e6e73" text-anchor="middle">-5</text>
