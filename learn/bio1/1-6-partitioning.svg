<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 462" width="700" height="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One spruce tree divided between five species of warbler, drawn from Robert MacArthur's 1958 study. Each species feeds in a different part of the tree: the Cape May warbler in the very top and outer needles, the blackburnian just below it, the black-throated green in the middle outer branches, the bay-breasted in the middle inner branches near the trunk, and the myrtle warbler in the lower branches and the ground beneath. They eat the same kind of food in the same tree without excluding each other, because each takes a different zone.</title>
<rect width="700" height="462" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">One tree, five warblers, five addresses</text>
<path d="M 214.0 32.0 L 194.0 76.0 L 234.0 76.0 Z" fill="#358a53"/>
<path d="M 214.0 70.2 L 179.2 114.2 L 248.8 114.2 Z" fill="#2f7d4a"/>
<path d="M 214.0 108.5 L 164.5 152.5 L 263.5 152.5 Z" fill="#358a53"/>
<path d="M 214.0 146.8 L 149.8 190.8 L 278.2 190.8 Z" fill="#2f7d4a"/>
<path d="M 214.0 185.0 L 135.0 229.0 L 293.0 229.0 Z" fill="#358a53"/>
<path d="M 214.0 223.2 L 120.2 267.2 L 307.8 267.2 Z" fill="#2f7d4a"/>
<path d="M 214.0 261.5 L 105.5 305.5 L 322.5 305.5 Z" fill="#358a53"/>
<path d="M 214.0 299.8 L 90.8 343.8 L 337.2 343.8 Z" fill="#2f7d4a"/>
<path d="M 214.0 338.0 L 76.0 382.0 L 352.0 382.0 Z" fill="#358a53"/>
<rect x="205" y="372" width="18" height="32" fill="#7a5a3a"/>
<circle cx="227.5" cy="78" r="6.5" fill="#0f5f9e"/>
<circle cx="201.7" cy="90" r="6.5" fill="#0f5f9e" opacity="0.75"/>
<line x1="246.6" y1="78" x2="404" y2="78" stroke="#0f5f9e" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="412" y="75" font-size="14" fill="#0f5f9e" font-weight="600">Cape May</text>
<text x="412" y="93" font-size="12.8" fill="#6e6e73">the very top, outer needles</text>
<circle cx="238.1" cy="128" r="6.5" fill="#2a78d6"/>
<circle cx="192.0" cy="140" r="6.5" fill="#2a78d6" opacity="0.75"/>
<line x1="265.9" y1="128" x2="404" y2="128" stroke="#2a78d6" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="412" y="125" font-size="14" fill="#2a78d6" font-weight="600">Blackburnian</text>
<text x="412" y="143" font-size="12.8" fill="#6e6e73">top, just below</text>
<circle cx="250.5" cy="186" r="6.5" fill="#12915a"/>
<circle cx="180.9" cy="198" r="6.5" fill="#12915a" opacity="0.75"/>
<line x1="288.3" y1="186" x2="404" y2="186" stroke="#12915a" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="412" y="183" font-size="14" fill="#12915a" font-weight="600">Black-throated green</text>
<text x="412" y="201" font-size="12.8" fill="#6e6e73">middle, outer branches</text>
<circle cx="264.0" cy="250" r="6.5" fill="#eb6834"/>
<circle cx="168.5" cy="262" r="6.5" fill="#eb6834" opacity="0.75"/>
<line x1="313.0" y1="250" x2="404" y2="250" stroke="#eb6834" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="412" y="247" font-size="14" fill="#eb6834" font-weight="600">Bay-breasted</text>
<text x="412" y="265" font-size="12.8" fill="#6e6e73">middle, in near the trunk</text>
<circle cx="278.9" cy="320" r="6.5" fill="#8f5cff"/>
<circle cx="155.0" cy="332" r="6.5" fill="#8f5cff" opacity="0.75"/>
<line x1="339.9" y1="320" x2="404" y2="320" stroke="#8f5cff" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 4"/>
<text x="412" y="317" font-size="14" fill="#8f5cff" font-weight="600">Myrtle</text>
<text x="412" y="335" font-size="12.8" fill="#6e6e73">low branches and the ground</text>
<text x="214" y="424" font-size="13.5" fill="#1d1d1f" font-weight="600" text-anchor="middle">One spruce</text>
<text x="214" y="443" font-size="12.5" fill="#6e6e73" text-anchor="middle">Drawn from MacArthur, 1958</text>
<rect x="404" y="344" width="274" height="76" fill="#f5f5f7" rx="11"/>
<text x="418" y="366" font-size="14" fill="#12915a" font-weight="700">Resource partitioning</text>
<text x="418" y="386" font-size="12.8" fill="#6e6e73">Species that would exclude each other</text>
<text x="418" y="402" font-size="12.8" fill="#6e6e73">coexist by splitting the resource instead</text>
<text x="418" y="418" font-size="12.8" fill="#6e6e73">of fighting over all of it.</text>
</svg>
