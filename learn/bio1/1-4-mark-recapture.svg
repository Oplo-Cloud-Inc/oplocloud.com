<circle cx="434" cy="194" r="7" fill="#c9c9cf"/>
<rect x="466" y="60" width="208" height="156" fill="#f5f5f7" rx="12"/>
<circle cx="494" cy="88" r="15" fill="#eb6834"/>
<text x="494" y="94" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<text x="518" y="94" font-size="15" fill="#1d1d1f" font-weight="600">Catch again</text>
<text x="486" y="126" font-size="13" fill="#6e6e73">Catch 50. Count the marks:</text>
<text x="486" y="144" font-size="13" fill="#6e6e73">10 of them are marked.</text>
<circle cx="488" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="509" cy="172" r="7" fill="#eb6834"/>
<line x1="505.5" y1="168.5" x2="512.5" y2="175.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<line x1="512.5" y1="168.5" x2="505.5" y2="175.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<circle cx="530" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="551" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="572" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="593" cy="172" r="7" fill="#eb6834"/>
<line x1="589.5" y1="168.5" x2="596.5" y2="175.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<line x1="596.5" y1="168.5" x2="589.5" y2="175.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<circle cx="614" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="635" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="656" cy="172" r="7" fill="#c9c9cf"/>
<circle cx="488" cy="194" r="7" fill="#c9c9cf"/>
<circle cx="509" cy="194" r="7" fill="#c9c9cf"/>
<circle cx="530" cy="194" r="7" fill="#eb6834"/>
<line x1="526.5" y1="190.5" x2="533.5" y2="197.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<line x1="533.5" y1="190.5" x2="526.5" y2="197.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<circle cx="551" cy="194" r="7" fill="#c9c9cf"/>
<circle cx="572" cy="194" r="7" fill="#c9c9cf"/>
