<rect x="22" y="236" width="656" height="96" fill="#ffffff" rx="12" stroke="#d2d2d7" stroke-width="1.4"/>
<text x="44" y="268" font-size="13.5" fill="#6e6e73">marked in the second catch</text>
<text x="44" y="292" font-size="13.5" fill="#6e6e73">size of the second catch</text>
<line x1="40" y1="276" x2="236" y2="276" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="252" y="282" font-size="19" fill="#1d1d1f" font-weight="600">=</text>
<text x="286" y="268" font-size="13.5" fill="#6e6e73">all the marked animals</text>
<text x="286" y="292" font-size="13.5" fill="#6e6e73">the whole population</text>
<line x1="282" y1="276" x2="452" y2="276" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="470" y="282" font-size="19" fill="#6e6e73">→</text>
<text x="506" y="268" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="middle">10</text>
<text x="506" y="292" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="middle">50</text>
<line x1="492" y1="276" x2="520" y2="276" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="536" y="282" font-size="17" fill="#1d1d1f" font-weight="600">=</text>
<text x="576" y="268" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="middle">40</text>
<text x="576" y="292" font-size="15" fill="#1d1d1f" font-weight="700" text-anchor="middle">N</text>
<line x1="562" y1="276" x2="590" y2="276" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
<text x="608" y="282" font-size="17" fill="#12915a" font-weight="700">N ≈ 200</text>
<text x="22" y="358" font-size="14.5" fill="#1d1d1f">It only works if the marks stay on, the marked animals mix back in, and being caught once does not make an</text>
<text x="22" y="377" font-size="14.5" fill="#1d1d1f">animal easier or harder to catch again. Every one of those is an assumption a biologist has to defend.</text>
</svg>
