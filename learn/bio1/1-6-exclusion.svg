<text x="214.25" y="106.9090909090909" font-size="13" fill="#2a78d6" font-weight="600">P. aurelia</text>
<path d="M 58.0 288.7 C 62.2 287.5 74.7 285.7 83.0 281.5 C 91.3 277.2 99.7 272.4 108.0 263.3 C 116.3 254.2 124.7 239.0 133.0 226.9 C 141.3 214.8 149.7 199.6 158.0 190.5 C 166.3 181.5 174.7 176.6 183.0 172.4 C 191.3 168.1 195.5 166.9 208.0 165.1 C 220.5 163.3 241.3 162.1 258.0 161.5 C 274.7 160.8 299.7 161.5 308.0 161.5" fill="none" stroke="#eb6834" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="214.25" y="183.27272727272728" font-size="13" fill="#eb6834" font-weight="600">P. caudatum</text>
<line x1="400" y1="296" x2="650" y2="296" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="400" y1="96" x2="400" y2="296" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="400.0" y1="296" x2="400.0" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="400.0" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">0</text>
<line x1="462.5" y1="296" x2="462.5" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="462.5" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">5</text>
<line x1="525.0" y1="296" x2="525.0" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
