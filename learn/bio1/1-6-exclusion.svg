<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 462" width="700" height="462" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Gause's experiment, drawn as two charts. On the left, each of two species of Paramecium grown on its own: both rise and level off at their own carrying capacity. On the right, the two grown together in the same tube on the same food: P. aurelia levels off a little lower, while P. caudatum rises, falls and is gone by about day 16. Two species with the same requirements in the same place cannot coexist; one wins.</title>
<rect width="700" height="462" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Two species, one tube, one food supply</text>
<line x1="58" y1="296" x2="308" y2="296" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="58" y1="96" x2="58" y2="296" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="58.0" y1="296" x2="58.0" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="58.0" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">0</text>
<line x1="120.5" y1="296" x2="120.5" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="120.5" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">5</text>
<line x1="183.0" y1="296" x2="183.0" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="183.0" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">10</text>
<line x1="245.5" y1="296" x2="245.5" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="245.5" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">15</text>
<line x1="308.0" y1="296" x2="308.0" y2="301" stroke="#1d1d1f" stroke-width="1.2" stroke-linecap="round"/>
<text x="308.0" y="316" font-size="12.5" fill="#6e6e73" text-anchor="middle">20</text>
<text x="183.0" y="328" font-size="13" fill="#6e6e73" text-anchor="middle">Days</text>
<text x="183" y="82" font-size="14.5" fill="#1d1d1f" font-weight="600" text-anchor="middle">Grown on their own</text>
