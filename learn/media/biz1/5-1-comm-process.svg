<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" font-family="sans-serif" font-size="12">
  <rect width="640" height="280" fill="#fafaf8"/>
  <text x="320" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#264653">The Communication Process</text>
  <rect x="40" y="90" width="100" height="60" rx="6" fill="#457b9d"/>
  <text x="90" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Sender</text>
  <text x="90" y="134" text-anchor="middle" font-size="10" fill="#fff">encodes</text>
  <rect x="200" y="90" width="120" height="60" rx="6" fill="#e8a317"/>
  <text x="260" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Message</text>
  <text x="260" y="134" text-anchor="middle" font-size="10" fill="#fff">channel</text>
  <rect x="390" y="90" width="110" height="60" rx="6" fill="#2a9d8f"/>
  <text x="445" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Receiver</text>
  <text x="445" y="134" text-anchor="middle" font-size="10" fill="#fff">decodes</text>
  <path d="M140 120 L200 120" stroke="#888" stroke-width="2" marker-end="url(#a1)"/>
  <path d="M320 120 L390 120" stroke="#888" stroke-width="2" marker-end="url(#a1)"/>
  <defs><marker id="a1" markerWidth="6" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 Z" fill="#888"/></marker></defs>
  <rect x="250" y="200" width="140" height="50" rx="6" fill="#f5f0e8" stroke="#ccc"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#555">Feedback</text>
  <text x="320" y="240" text-anchor="middle" font-size="10" fill="#888">receiver &#8594; sender</text>
  <text x="525" y="120" font-size="10" fill="#888">&#8593; noise</text>
  <line x1="510" y1="90" x2="510" y2="150" stroke="#e76f51" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="105" y="68" text-anchor="middle" font-size="10" fill="#888">encode</text>
  <text x="445" y="68" text-anchor="middle" font-size="10" fill="#888">decode</text>
</svg>