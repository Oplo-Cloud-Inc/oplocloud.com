  <text x="210" y="42" text-anchor="middle" font-size="11" fill="#888">Choose, act, then reflect</text>
  <rect x="140" y="285" width="140" height="35" rx="4" fill="#e76f51"/>
  <text x="210" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ACT</text>
  <rect x="105" y="238" width="210" height="35" rx="4" fill="#2a9d8f"/>
  <text x="210" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">CHOOSE</text>
  <rect x="70" y="190" width="280" height="35" rx="4" fill="#e8a317"/>
  <text x="210" y="211" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">REFLECT</text>
