  <text x="50" y="233" font-size="10" fill="#ddd">Suggests action, with costs and expected outcomes</text>
  <rect x="30" y="250" width="360" height="42" rx="4" fill="#e76f51" opacity="0.85"/>
  <text x="50" y="268" font-size="12" font-weight="bold" fill="#fff">Progress</text>
