<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="sans-serif" font-size="12">
  <rect width="420" height="300" fill="#fafaf8"/>
  <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#264653">Business Report Types</text>
  <rect x="30" y="50" width="360" height="42" rx="4" fill="#264653" opacity="0.85"/>
  <text x="50" y="68" font-size="12" font-weight="bold" fill="#fff">Informational</text>
  <text x="50" y="83" font-size="10" fill="#ddd">Facts only, no analysis or recommendation</text>
  <rect x="30" y="100" width="360" height="42" rx="4" fill="#457b9d" opacity="0.85"/>
  <text x="50" y="118" font-size="12" font-weight="bold" fill="#fff">Analytical</text>
  <text x="50" y="133" font-size="10" fill="#ddd">Facts with interpretation and possible conclusions</text>
  <rect x="30" y="150" width="360" height="42" rx="4" fill="#e8a317" opacity="0.85"/>
  <text x="50" y="168" font-size="12" font-weight="bold" fill="#fff">Research</text>
  <text x="50" y="183" font-size="10" fill="#ddd">In-depth investigation with sources cited</text>
