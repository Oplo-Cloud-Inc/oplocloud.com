<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 360" font-family="sans-serif" font-size="12">
  <rect width="420" height="360" fill="#fafaf8"/>
  <text x="210" y="25" text-anchor="middle" font-size="14" font-weight="bold" fill="#264653">Carroll's CSR Pyramid</text>
  <text x="210" y="42" text-anchor="middle" font-size="11" fill="#888">Four layers of responsibility</text>
  <polygon points="210,55 350,130 70,130" fill="#e76f51" opacity="0.85"/>
  <text x="210" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ECONOMIC</text>
  <text x="210" y="126" text-anchor="middle" font-size="9" fill="#fff">be profitable</text>
  <polygon points="210,130 335,200 85,200" fill="#e8a317" opacity="0.85"/>
  <text x="210" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">LEGAL</text>
  <text x="210" y="202" text-anchor="middle" font-size="9" fill="#fff">obey the law</text>
  <polygon points="210,200 310,265 110,265" fill="#2a9d8f" opacity="0.85"/>
  <text x="210" y="260" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">ETHICAL</text>
  <text x="210" y="274" text-anchor="middle" font-size="9" fill="#fff">do what is right</text>
  <polygon points="210,265 290,325 130,325" fill="#6a4c93" opacity="0.85"/>
  <text x="210" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">PHILANTHROPIC</text>
  <text x="210" y="332" text-anchor="middle" font-size="9" fill="#fff">contribute to community</text>
  <text x="210" y="352" text-anchor="middle" font-size="10" fill="#888">from Carroll 1991 &#8212; base supports all above</text>
</svg>