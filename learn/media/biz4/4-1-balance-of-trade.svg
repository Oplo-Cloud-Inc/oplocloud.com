<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two countries in one year. Country one exports 120 billion and imports 90 billion, a trade surplus of 30 billion. Country two exports 80 billion and imports 110 billion, a trade deficit of 30 billion</title>
<text x="40" y="40" font-size="20" font-weight="600" fill="#1d1d1f">Trade surplus</text>
<text x="40" y="66" font-size="15" fill="#6e6e73">Sells more abroad than it buys</text>
<text x="40" y="118" font-size="15" fill="#6e6e73">Exports</text>
<rect x="120" y="98" width="360" height="28" rx="4" fill="#12915a"/>
<text x="490" y="118" font-size="16" fill="#1d1d1f">$120bn</text>
<text x="40" y="160" font-size="15" fill="#6e6e73">Imports</text>
<rect x="120" y="140" width="270" height="28" rx="4" fill="#86868b"/>
<text x="400" y="160" font-size="16" fill="#1d1d1f">$90bn</text>
<text x="40" y="232" font-size="17" fill="#1d1d1f">120 − 90 =</text>
<text x="136" y="234" font-size="30" font-weight="600" fill="#12915a">+$30bn</text>
<line x1="570" y1="24" x2="570" y2="250" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="610" y="40" font-size="20" font-weight="600" fill="#1d1d1f">Trade deficit</text>
<text x="610" y="66" font-size="15" fill="#6e6e73">Buys more abroad than it sells</text>
<text x="610" y="118" font-size="15" fill="#6e6e73">Exports</text>
<rect x="690" y="98" width="240" height="28" rx="4" fill="#12915a"/>
<text x="940" y="118" font-size="16" fill="#1d1d1f">$80bn</text>
<text x="610" y="160" font-size="15" fill="#6e6e73">Imports</text>
<rect x="690" y="140" width="330" height="28" rx="4" fill="#86868b"/>
<text x="1030" y="160" font-size="16" fill="#1d1d1f">$110bn</text>
<text x="610" y="232" font-size="17" fill="#1d1d1f">80 − 110 =</text>
<text x="700" y="234" font-size="30" font-weight="600" fill="#c9342f">−$30bn</text>
<text x="40" y="300" font-size="17" fill="#1d1d1f">Balance of trade = exports − imports, over a set period such as a year.</text>
</svg>
