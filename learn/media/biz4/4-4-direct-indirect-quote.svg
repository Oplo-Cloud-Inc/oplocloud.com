<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>One exchange rate written two ways for someone in the United States. Direct quote: 1 euro costs 1.25 US dollars. Indirect quote: 1 US dollar buys 0.80 euros</title>
<text x="40" y="36" font-size="16" fill="#6e6e73">You live in the United States, so the dollar is your home currency.</text>
<rect x="40" y="60" width="490" height="170" rx="12" fill="#e8f1fb" stroke="#0071e3" stroke-width="2"/>
<text x="66" y="98" font-size="19" font-weight="600" fill="#0071e3">Direct quote</text>
<text x="66" y="120" font-size="15" fill="#6e6e73">How many of your dollars one foreign unit costs</text>
<text x="66" y="182" font-size="36" font-weight="600" fill="#1d1d1f">€1 = $1.25</text>
<text x="66" y="212" font-size="15" fill="#6e6e73">A €20 T-shirt costs you $25.</text>
<text x="550" y="158" font-size="22" text-anchor="middle" fill="#86868b">⇄</text>
<rect x="570" y="60" width="490" height="170" rx="12" fill="#fdf1e0" stroke="#b26a00" stroke-width="2"/>
<text x="596" y="98" font-size="19" font-weight="600" fill="#b26a00">Indirect quote</text>
<text x="596" y="120" font-size="15" fill="#6e6e73">How much foreign money one of your dollars buys</text>
<text x="596" y="182" font-size="36" font-weight="600" fill="#1d1d1f">$1 = €0.80</text>
<text x="596" y="212" font-size="15" fill="#6e6e73">Your $25 becomes €20.</text>
<text x="40" y="274" font-size="17" fill="#1d1d1f">The same rate, turned upside down: 1 ÷ 1.25 = 0.80. Traders write it as EUR/USD 1.25.</text>
</svg>
