<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" width="1100" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Outsourcing and offshoring are two separate questions. Outsourcing is about who does the work: another company. Offshoring is about where: another country. A US firm can do both, either, or neither</title>
<text x="655" y="36" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">Who does the work?</text>
<text x="435" y="66" font-size="15" text-anchor="middle" fill="#6e6e73">Your own company</text>
<text x="850" y="66" font-size="15" text-anchor="middle" fill="#b26a00" font-weight="600">Another company = outsourcing</text>
<text x="40" y="66" font-size="17" font-weight="600" fill="#1d1d1f">Where?</text>
<text x="40" y="150" font-size="15" fill="#6e6e73">Your home</text>
<text x="40" y="170" font-size="15" fill="#6e6e73">country</text>
<text x="40" y="320" font-size="15" font-weight="600" fill="#0071e3">Another</text>
<text x="40" y="340" font-size="15" font-weight="600" fill="#0071e3">country =</text>
<text x="40" y="360" font-size="15" font-weight="600" fill="#0071e3">offshoring</text>
<rect x="250" y="84" width="370" height="150" rx="10" fill="#f5f5f7" stroke="#86868b" stroke-width="1.5"/>
<text x="272" y="120" font-size="18" font-weight="600" fill="#1d1d1f">In-house, at home</text>
<text x="272" y="148" font-size="15" fill="#6e6e73">A US bank answers its own</text>
<text x="272" y="168" font-size="15" fill="#6e6e73">customer calls in Ohio.</text>
<text x="272" y="210" font-size="14" fill="#86868b">Neither</text>
<rect x="640" y="84" width="420" height="150" rx="10" fill="#fdf1e0" stroke="#b26a00" stroke-width="2"/>
<text x="662" y="120" font-size="18" font-weight="600" fill="#1d1d1f">Outsourcing at home</text>
<text x="662" y="148" font-size="15" fill="#6e6e73">The bank pays a call-centre company</text>
<text x="662" y="168" font-size="15" fill="#6e6e73">in Texas to answer them.</text>
<text x="662" y="210" font-size="14" fill="#b26a00">Outsourcing only</text>
<rect x="250" y="250" width="370" height="150" rx="10" fill="#e8f1fb" stroke="#0071e3" stroke-width="2"/>
<text x="272" y="286" font-size="18" font-weight="600" fill="#1d1d1f">Offshoring, still in-house</text>
<text x="272" y="314" font-size="15" fill="#6e6e73">The bank opens its own call</text>
<text x="272" y="334" font-size="15" fill="#6e6e73">centre in the Philippines.</text>
<text x="272" y="376" font-size="14" fill="#0071e3">Offshoring only</text>
<rect x="640" y="250" width="420" height="150" rx="10" fill="#efe9f7" stroke="#6e4bb5" stroke-width="2"/>
<text x="662" y="286" font-size="18" font-weight="600" fill="#1d1d1f">Both at once</text>
<text x="662" y="314" font-size="15" fill="#6e6e73">The bank pays a company in India</text>
<text x="662" y="334" font-size="15" fill="#6e6e73">to answer its calls from there.</text>
<text x="662" y="376" font-size="14" fill="#6e4bb5">Outsourcing + offshoring</text>
<text x="40" y="446" font-size="17" fill="#1d1d1f">Outsourcing asks <tspan font-weight="600">who</tspan>. Offshoring asks <tspan font-weight="600">where</tspan>. People often mix them up, but they are separate choices.</text>
</svg>
