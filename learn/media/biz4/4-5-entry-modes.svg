<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Ways to enter a foreign market drawn as a staircase, from exporting, through licensing, franchising, contract manufacturing and joint venture, to direct investment. Each step up gives the company more control, and costs more and risks more</title>
<g>
<rect x="40" y="300" width="160" height="80" rx="6" fill="#e8f1fb" stroke="#0071e3" stroke-width="1.5"/>
<text x="120" y="336" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">Exporting</text>
<text x="120" y="360" font-size="13" text-anchor="middle" fill="#6e6e73">Ship it from home</text>
<rect x="210" y="250" width="160" height="130" rx="6" fill="#d4e6f8" stroke="#0071e3" stroke-width="1.5"/>
<text x="290" y="286" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">Licensing</text>
<text x="290" y="310" font-size="13" text-anchor="middle" fill="#6e6e73">Rent out your</text>
<text x="290" y="328" font-size="13" text-anchor="middle" fill="#6e6e73">brand or know-how</text>
<rect x="380" y="200" width="160" height="180" rx="6" fill="#bfd9f4" stroke="#0071e3" stroke-width="1.5"/>
<text x="460" y="236" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">Franchising</text>
<text x="460" y="260" font-size="13" text-anchor="middle" fill="#3a3a3c">A local owner runs</text>
<text x="460" y="278" font-size="13" text-anchor="middle" fill="#3a3a3c">your whole system</text>
<rect x="550" y="150" width="160" height="230" rx="6" fill="#9cc5ef" stroke="#0071e3" stroke-width="1.5"/>
<text x="630" y="186" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">Contract</text>
<text x="630" y="206" font-size="17" font-weight="600" text-anchor="middle" fill="#1d1d1f">manufacturing</text>
<text x="630" y="230" font-size="13" text-anchor="middle" fill="#1d1d1f">A factory there</text>
<text x="630" y="248" font-size="13" text-anchor="middle" fill="#1d1d1f">makes it for you</text>
<rect x="720" y="100" width="160" height="280" rx="6" fill="#5c9fe6" stroke="#0071e3" stroke-width="1.5"/>
<text x="800" y="136" font-size="17" font-weight="600" text-anchor="middle" fill="#ffffff">Joint venture</text>
<text x="800" y="160" font-size="13" text-anchor="middle" fill="#ffffff">A new company,</text>
<text x="800" y="178" font-size="13" text-anchor="middle" fill="#ffffff">owned together</text>
<rect x="890" y="50" width="170" height="330" rx="6" fill="#0071e3"/>
<text x="975" y="86" font-size="17" font-weight="600" text-anchor="middle" fill="#ffffff">Direct</text>
<text x="975" y="106" font-size="17" font-weight="600" text-anchor="middle" fill="#ffffff">investment</text>
<text x="975" y="130" font-size="13" text-anchor="middle" fill="#ffffff">Build or buy</text>
<text x="975" y="148" font-size="13" text-anchor="middle" fill="#ffffff">your own operation</text>
</g>
<line x1="40" y1="408" x2="1046" y2="408" stroke="#1d1d1f" stroke-width="2"/>
<path d="M1060 408 L1044 400 L1044 416 Z" fill="#1d1d1f"/>
<text x="40" y="432" font-size="15" fill="#6e6e73">Cheaper, faster, less risk — and less control</text>
<text x="1060" y="432" font-size="15" text-anchor="end" fill="#1d1d1f">More control — and more cost and risk</text>
<text x="40" y="40" font-size="17" font-weight="600" fill="#1d1d1f">Ways into a foreign market</text>
<text x="40" y="64" font-size="14" fill="#86868b">A rough guide, not a rule: real deals vary.</text>
</svg>
