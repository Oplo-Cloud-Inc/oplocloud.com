<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>England and Portugal making cloth and wine. Portugal needs fewer hours for both, but one cloth costs England 0.83 wine and Portugal 1.13 wine, so England has the comparative advantage in cloth</title>
<text x="40" y="36" font-size="17" font-weight="600" fill="#1d1d1f">Hours of work to make one unit</text>
<text x="40" y="84" font-size="19" font-weight="600" fill="#1d1d1f">England</text>
<text x="40" y="120" font-size="15" fill="#6e6e73">Cloth</text>
<rect x="110" y="102" width="320" height="26" rx="4" fill="#0071e3"/>
<text x="440" y="121" font-size="16" fill="#1d1d1f">100 h</text>
<text x="40" y="158" font-size="15" fill="#6e6e73">Wine</text>
<rect x="110" y="140" width="384" height="26" rx="4" fill="#b26a00"/>
<text x="504" y="159" font-size="16" fill="#1d1d1f">120 h</text>
<text x="40" y="218" font-size="19" font-weight="600" fill="#1d1d1f">Portugal</text>
<text x="40" y="254" font-size="15" fill="#6e6e73">Cloth</text>
<rect x="110" y="236" width="288" height="26" rx="4" fill="#0071e3"/>
<text x="408" y="255" font-size="16" fill="#1d1d1f">90 h</text>
<text x="40" y="292" font-size="15" fill="#6e6e73">Wine</text>
<rect x="110" y="274" width="256" height="26" rx="4" fill="#b26a00"/>
<text x="376" y="293" font-size="16" fill="#1d1d1f">80 h</text>
<line x1="590" y1="24" x2="590" y2="310" stroke="#d2d2d7" stroke-width="1.5"/>
<text x="630" y="36" font-size="17" font-weight="600" fill="#1d1d1f">What one cloth costs, in wine not made</text>
<rect x="630" y="62" width="430" height="100" rx="10" fill="#e8f1fb" stroke="#0071e3" stroke-width="2"/>
<text x="652" y="96" font-size="19" font-weight="600" fill="#1d1d1f">England</text>
<text x="652" y="136" font-size="17" fill="#6e6e73">100 ÷ 120 =</text>
<text x="770" y="137" font-size="26" font-weight="600" fill="#0071e3">0.83 wine</text>
<text x="1040" y="96" font-size="15" font-weight="600" text-anchor="end" fill="#0071e3">cheaper</text>
<rect x="630" y="196" width="430" height="100" rx="10" fill="#f5f5f7" stroke="#86868b" stroke-width="1.5"/>
<text x="652" y="230" font-size="19" font-weight="600" fill="#1d1d1f">Portugal</text>
<text x="652" y="270" font-size="17" fill="#6e6e73">90 ÷ 80 =</text>
<text x="752" y="271" font-size="26" font-weight="600" fill="#1d1d1f">1.13 wine</text>
<text x="40" y="360" font-size="17" fill="#1d1d1f">Portugal is faster at both, so it has the <tspan font-weight="600">absolute advantage</tspan> in both.</text>
<text x="40" y="390" font-size="17" fill="#1d1d1f">England gives up less to make cloth, so England has the <tspan font-weight="600" fill="#0071e3">comparative advantage</tspan> in cloth.</text>
</svg>
