<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A tariff at work. An imported shirt costs 10 dollars and a home-made shirt costs 12 dollars. A 30 percent tariff adds 3 dollars to the import, so it now costs 13 dollars and the home-made shirt is the cheaper one</title>
<defs>
<pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="10" height="10" fill="#fbe3c0"/>
<line x1="0" y1="0" x2="0" y2="10" stroke="#b26a00" stroke-width="4"/>
</pattern>
</defs>
<text x="40" y="40" font-size="17" font-weight="600" fill="#1d1d1f">Price of one shirt in the shop</text>
<text x="40" y="100" font-size="16" fill="#1d1d1f">Imported, no tariff</text>
<rect x="300" y="80" width="400" height="30" rx="4" fill="#0071e3"/>
<text x="712" y="101" font-size="18" font-weight="600" fill="#1d1d1f">$10</text>
<text x="40" y="160" font-size="16" fill="#1d1d1f">Imported, 30% tariff</text>
<rect x="300" y="140" width="400" height="30" rx="4" fill="#0071e3"/>
<rect x="700" y="140" width="120" height="30" rx="4" fill="url(#hatch)" stroke="#b26a00" stroke-width="1.5"/>
<text x="832" y="161" font-size="18" font-weight="600" fill="#1d1d1f">$13</text>
<text x="880" y="161" font-size="15" fill="#b26a00">+ $3 tariff</text>
<text x="40" y="220" font-size="16" fill="#1d1d1f">Made at home</text>
<rect x="300" y="200" width="480" height="30" rx="4" fill="#12915a"/>
<text x="792" y="221" font-size="18" font-weight="600" fill="#1d1d1f">$12</text>
<text x="40" y="286" font-size="17" fill="#1d1d1f">Before the tariff, buyers choose the import. After it, the home-made shirt is cheaper —</text>
<text x="40" y="310" font-size="17" fill="#1d1d1f">which protects the home producer, and means shoppers pay more than they did.</text>
</svg>
