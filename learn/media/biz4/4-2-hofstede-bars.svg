<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The textbook's example scores for two countries on Hofstede's six dimensions, from 0 to 100. Power distance: A 20, B 60. Individualism: A 70, B 25. Uncertainty avoidance: A 30, B 50. Masculinity: A 40, B 75. Long-term orientation: A 35, B 65. Indulgence: A 25, B 55</title>
<rect x="40" y="18" width="18" height="18" rx="3" fill="#0071e3"/>
<text x="66" y="33" font-size="16" fill="#1d1d1f">Country A</text>
<rect x="180" y="18" width="18" height="18" rx="3" fill="#b26a00"/>
<text x="206" y="33" font-size="16" fill="#1d1d1f">Country B</text>
<text x="1060" y="33" font-size="14" text-anchor="end" fill="#86868b">Example scores, 0 to 100</text>
<line x1="360" y1="56" x2="360" y2="470" stroke="#d2d2d7" stroke-width="1"/>
<line x1="560" y1="56" x2="560" y2="470" stroke="#e8e8ed" stroke-width="1"/>
<line x1="760" y1="56" x2="760" y2="470" stroke="#e8e8ed" stroke-width="1"/>
<line x1="960" y1="56" x2="960" y2="470" stroke="#d2d2d7" stroke-width="1"/>
<text x="40" y="86" font-size="17" font-weight="600" fill="#1d1d1f">Power distance</text>
<text x="40" y="106" font-size="14" fill="#6e6e73">Accepting authority</text>
<rect x="360" y="70" width="120" height="16" rx="3" fill="#0071e3"/><text x="488" y="84" font-size="14" fill="#1d1d1f">20</text>
<rect x="360" y="92" width="360" height="16" rx="3" fill="#b26a00"/><text x="728" y="106" font-size="14" fill="#1d1d1f">60</text>
<text x="40" y="154" font-size="17" font-weight="600" fill="#1d1d1f">Individualism</text>
<text x="40" y="174" font-size="14" fill="#6e6e73">Me before the group</text>
<rect x="360" y="138" width="420" height="16" rx="3" fill="#0071e3"/><text x="788" y="152" font-size="14" fill="#1d1d1f">70</text>
<rect x="360" y="160" width="150" height="16" rx="3" fill="#b26a00"/><text x="518" y="174" font-size="14" fill="#1d1d1f">25</text>
<text x="40" y="222" font-size="17" font-weight="600" fill="#1d1d1f">Uncertainty avoidance</text>
<text x="40" y="242" font-size="14" fill="#6e6e73">Discomfort with risk</text>
<rect x="360" y="206" width="180" height="16" rx="3" fill="#0071e3"/><text x="548" y="220" font-size="14" fill="#1d1d1f">30</text>
<rect x="360" y="228" width="300" height="16" rx="3" fill="#b26a00"/><text x="668" y="242" font-size="14" fill="#1d1d1f">50</text>
<text x="40" y="290" font-size="17" font-weight="600" fill="#1d1d1f">Masculinity</text>
<text x="40" y="310" font-size="14" fill="#6e6e73">Competing to win</text>
<rect x="360" y="274" width="240" height="16" rx="3" fill="#0071e3"/><text x="608" y="288" font-size="14" fill="#1d1d1f">40</text>
<rect x="360" y="296" width="450" height="16" rx="3" fill="#b26a00"/><text x="818" y="310" font-size="14" fill="#1d1d1f">75</text>
<text x="40" y="358" font-size="17" font-weight="600" fill="#1d1d1f">Long-term orientation</text>
<text x="40" y="378" font-size="14" fill="#6e6e73">Planning far ahead</text>
<rect x="360" y="342" width="210" height="16" rx="3" fill="#0071e3"/><text x="578" y="356" font-size="14" fill="#1d1d1f">35</text>
<rect x="360" y="364" width="390" height="16" rx="3" fill="#b26a00"/><text x="758" y="378" font-size="14" fill="#1d1d1f">65</text>
<text x="40" y="426" font-size="17" font-weight="600" fill="#1d1d1f">Indulgence</text>
<text x="40" y="446" font-size="14" fill="#6e6e73">Enjoying life freely</text>
<rect x="360" y="410" width="150" height="16" rx="3" fill="#0071e3"/><text x="518" y="424" font-size="14" fill="#1d1d1f">25</text>
<rect x="360" y="432" width="330" height="16" rx="3" fill="#b26a00"/><text x="698" y="446" font-size="14" fill="#1d1d1f">55</text>
<text x="360" y="494" font-size="13" text-anchor="middle" fill="#86868b">0</text>
<text x="660" y="494" font-size="13" text-anchor="middle" fill="#86868b">50</text>
<text x="960" y="494" font-size="13" text-anchor="middle" fill="#86868b">100</text>
</svg>
