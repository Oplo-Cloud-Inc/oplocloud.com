<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Five video aspect ratios drawn at the same height, so their widths can be compared. 4 by 3, older television. 16 by 9, HD television and most screens. 9 by 16, vertical video on a phone. 1.85 to 1, widescreen cinema. 2.39 to 1, the widest common cinema format.</title>
<rect width="700" height="480" fill="#ffffff"/>
<g stroke="#1d1d1f" stroke-width="2.5">
  <rect x="24" y="24" width="200" height="150" rx="6" fill="#f5f5f7"/>
  <rect x="250" y="24" width="267" height="150" rx="6" fill="#e8f1fb"/>
  <rect x="545" y="24" width="84" height="150" rx="6" fill="#fdf1e0"/>
  <rect x="24" y="262" width="278" height="150" rx="6" fill="#f5f5f7"/>
  <rect x="330" y="262" width="358" height="150" rx="6" fill="#e8f1fb"/>
</g>
<g font-size="24" font-weight="700" fill="#1d1d1f" text-anchor="middle">
  <text x="124" y="108">4:3</text>
  <text x="383" y="108">16:9</text>
  <text x="587" y="108">9:16</text>
  <text x="163" y="346">1.85:1</text>
  <text x="509" y="346">2.39:1</text>
</g>
<g font-size="15" fill="#3a3a3c">
  <text x="24" y="200">Older television</text>
  <text x="250" y="200">HD television, most screens</text>
  <text x="545" y="200">Vertical,</text>
  <text x="545" y="218">on a phone</text>
  <text x="24" y="438">Widescreen cinema</text>
  <text x="330" y="438">The widest common cinema format</text>
</g>
<text x="24" y="468" font-size="14" fill="#6e6e73">All five drawn at the same height. Width divided by height is the ratio.</text>
</svg>
