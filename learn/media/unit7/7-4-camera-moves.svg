<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Camera moves in two groups. Turning the camera while it stays in one place: pan turns it left or right, tilt points it up or down, and roll tips it sideways. Moving the whole camera through space: dolly moves it toward or away from the subject, truck moves it sideways, pedestal raises or lowers it straight up and down, and a crane or jib swings it up in an arc. A zoom moves nothing: it changes the focal length of the lens.</title>
<rect width="700" height="560" fill="#ffffff"/>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker>
  <marker id="b" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker>
  <g id="cam">
    <rect x="-44" y="-26" width="70" height="52" rx="8" fill="#3a3a3c"/>
    <path d="M26 -16 L60 -26 L60 26 L26 16 Z" fill="#1d1d1f"/>
    <circle cx="-22" cy="-34" r="11" fill="#6e6e73"/>
    <circle cx="6" cy="-34" r="11" fill="#6e6e73"/>
  </g>
</defs>
<text x="24" y="36" font-size="19" font-weight="700" fill="#1d1d1f">Turn the camera</text>
<text x="24" y="58" font-size="15" fill="#6e6e73">It stays in one place and pivots</text>
<use href="#cam" x="170" y="250"/>
<line x1="160" y1="150" x2="160" y2="370" stroke="#86868b" stroke-width="1.5" stroke-dasharray="5 5"/>
<line x1="40" y1="250" x2="260" y2="250" stroke="#86868b" stroke-width="1.5" stroke-dasharray="5 5"/>
<g fill="none" stroke="#2a78d6" stroke-width="3">
  <path d="M104 150 A60 18 0 0 0 216 150" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M270 200 A22 60 0 0 1 270 300" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M100 330 A60 60 0 0 0 214 350" marker-start="url(#a)" marker-end="url(#a)"/>
</g>
<g font-size="17" font-weight="700" fill="#1d1d1f">
  <text x="160" y="104" text-anchor="middle">Pan</text>
  <text x="298" y="238">Tilt</text>
  <text x="160" y="410" text-anchor="middle">Roll</text>
</g>
<g font-size="14" fill="#6e6e73">
  <text x="160" y="124" text-anchor="middle">turns left or right</text>
  <text x="298" y="256">up or</text>
  <text x="298" y="272">down</text>
  <text x="160" y="430" text-anchor="middle">tips sideways</text>
  <text x="160" y="448" text-anchor="middle">(a Dutch angle)</text>
</g>
<line x1="350" y1="24" x2="350" y2="470" stroke="#e6e6e8" stroke-width="1.5"/>
<text x="372" y="36" font-size="19" font-weight="700" fill="#1d1d1f">Move the camera</text>
<text x="372" y="58" font-size="15" fill="#6e6e73">The whole camera travels</text>
<use href="#cam" x="500" y="290"/>
<g fill="none" stroke="#eb6834" stroke-width="3">
  <line x1="580" y1="290" x2="672" y2="290" marker-end="url(#b)"/>
  <line x1="436" y1="290" x2="392" y2="290" marker-end="url(#b)"/>
  <line x1="530" y1="336" x2="578" y2="392" marker-end="url(#b)"/>
  <line x1="466" y1="246" x2="430" y2="206" marker-end="url(#b)"/>
  <line x1="492" y1="230" x2="492" y2="150" marker-end="url(#b)"/>
  <line x1="492" y1="350" x2="492" y2="420" marker-end="url(#b)"/>
  <path d="M612 250 A124 124 0 0 0 520 142" marker-end="url(#b)"/>
</g>
<g font-size="17" font-weight="700" fill="#1d1d1f">
  <text x="604" y="318">Dolly</text>
  <text x="590" y="414">Truck</text>
  <text x="376" y="136">Pedestal</text>
  <text x="560" y="106">Crane</text>
</g>
<g font-size="14" fill="#6e6e73">
  <text x="604" y="336">toward</text>
  <text x="604" y="352">or away</text>
  <text x="590" y="432">sideways</text>
  <text x="376" y="154">up or down</text>
  <text x="560" y="124">swings up</text>
</g>
<rect x="24" y="486" width="652" height="54" rx="10" fill="#f5f5f7"/>
<text x="44" y="510" font-size="16" font-weight="700" fill="#1d1d1f">Zoom is not a move.</text>
<text x="44" y="530" font-size="15" fill="#3a3a3c">Nothing travels — the lens changes focal length, so the picture is magnified or widened.</text>
</svg>
