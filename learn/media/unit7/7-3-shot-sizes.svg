<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Shot sizes drawn as frames of the same 16 by 9 shape around one standing person. The extreme close-up holds only the eyes and mouth, the close-up the head, the medium shot the body from the waist up, the full shot the whole body from head to toe, and the wide shot the person in their surroundings.</title>
<rect width="700" height="470" fill="#f5f5f7"/>
<line x1="0" y1="408" x2="700" y2="408" stroke="#c7c7cc" stroke-width="2"/>
<path d="M600 408 V300" stroke="#8f8e86" stroke-width="10"/>
<circle cx="600" cy="280" r="44" fill="#b7d3a8"/>
<path d="M40 408 l40 -70 l40 70 z" fill="#d2d2d7"/>
<g fill="#6e6e73">
  <circle cx="350" cy="108" r="24"/>
  <rect x="342" y="130" width="16" height="12"/>
  <path d="M300 146 Q350 136 400 146 L392 262 L308 262 Z"/>
  <rect x="312" y="262" width="34" height="146" rx="10"/>
  <rect x="354" y="262" width="34" height="146" rx="10"/>
  <rect x="284" y="150" width="20" height="104" rx="10"/>
  <rect x="396" y="150" width="20" height="104" rx="10"/>
</g>
<g fill="#ffffff"><circle cx="341" cy="104" r="3.5"/><circle cx="359" cy="104" r="3.5"/><rect x="342" y="117" width="16" height="3" rx="1.5"/></g>
<g fill="none" stroke-width="3">
  <rect x="4" y="4" width="692" height="462" rx="8" stroke="#1d1d1f"/>
  <rect x="48" y="66" width="604" height="340" rx="4" stroke="#6e4bb5"/>
  <rect x="190" y="74" width="320" height="180" rx="4" stroke="#2a78d6"/>
  <rect x="274" y="72" width="152" height="86" rx="4" stroke="#12915a"/>
  <rect x="314" y="92" width="72" height="40" rx="3" stroke="#eb6834"/>
</g>
<g font-size="15" font-weight="700">
  <rect x="14" y="14" width="102" height="26" rx="6" fill="#1d1d1f"/>
  <text x="65" y="32" fill="#ffffff" text-anchor="middle">Wide shot</text>
  <rect x="56" y="374" width="94" height="26" rx="6" fill="#6e4bb5"/>
  <text x="103" y="392" fill="#ffffff" text-anchor="middle">Full shot</text>
  <rect x="190" y="260" width="120" height="26" rx="6" fill="#2a78d6"/>
  <text x="250" y="278" fill="#ffffff" text-anchor="middle">Medium shot</text>
  <rect x="432" y="72" width="94" height="26" rx="6" fill="#12915a"/>
  <text x="479" y="90" fill="#ffffff" text-anchor="middle">Close-up</text>
  <line x1="386" y1="118" x2="432" y2="118" stroke="#eb6834" stroke-width="2.5"/>
  <rect x="432" y="106" width="168" height="26" rx="6" fill="#eb6834"/>
  <text x="516" y="124" fill="#1d1d1f" text-anchor="middle">Extreme close-up</text>
</g>
<g font-size="14" fill="#1d1d1f">
  <text x="122" y="32">the person in their surroundings</text>
  <text x="158" y="392">head to toe</text>
  <text x="190" y="304">waist up</text>
</g>
</svg>
