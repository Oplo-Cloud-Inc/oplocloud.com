<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Camera angles seen from the side. A camera directly overhead gives a bird's-eye view. A camera above eye level pointing down gives a high angle, which makes a subject look smaller and more vulnerable. At eye level the shot is neutral. Below eye level pointing up is a low angle, which makes a subject look bigger and more powerful, and a camera on the ground is a ground shot, the most exaggerated low angle. A Dutch angle rolls the camera sideways so the horizon tilts.</title>
<rect width="700" height="500" fill="#ffffff"/>
<text x="24" y="34" font-size="18" font-weight="600" fill="#1d1d1f">Seen from the side</text>
<line x1="24" y1="440" x2="676" y2="440" stroke="#c7c7cc" stroke-width="2.5"/>
<g fill="#6e6e73">
  <circle cx="470" cy="226" r="22"/>
  <path d="M438 256 Q470 246 502 256 L496 350 L444 350 Z"/>
  <rect x="446" y="350" width="22" height="90" rx="8"/>
  <rect x="472" y="350" width="22" height="90" rx="8"/>
</g>
<line x1="200" y1="226" x2="676" y2="226" stroke="#86868b" stroke-width="1.5" stroke-dasharray="6 6"/>
<text x="676" y="216" font-size="14" fill="#6e6e73" text-anchor="end">eye level</text>
<defs><marker id="sight" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>
<g stroke="#2a78d6" stroke-width="2" stroke-dasharray="3 5" marker-end="url(#sight)" fill="none">
  <line x1="470" y1="92" x2="470" y2="194"/>
  <line x1="300" y1="130" x2="440" y2="212"/>
  <line x1="286" y1="226" x2="436" y2="226"/>
  <line x1="300" y1="330" x2="440" y2="248"/>
  <line x1="318" y1="418" x2="442" y2="262"/>
</g>
<g fill="#1d1d1f">
  <rect x="456" y="62" width="28" height="22" rx="4"/>
  <rect x="266" y="112" width="30" height="22" rx="4" transform="rotate(30 281 123)"/>
  <rect x="250" y="215" width="30" height="22" rx="4"/>
  <rect x="266" y="322" width="30" height="22" rx="4" transform="rotate(-30 281 333)"/>
  <rect x="290" y="420" width="30" height="20" rx="4" transform="rotate(-50 305 430)"/>
</g>
<g font-size="17" font-weight="700" fill="#1d1d1f">
  <text x="496" y="72">Bird's-eye view</text>
  <text x="24" y="104">High angle</text>
  <text x="24" y="220">Eye level</text>
  <text x="24" y="318">Low angle</text>
  <text x="24" y="386">Ground shot</text>
</g>
<g font-size="14" fill="#6e6e73">
  <text x="496" y="92">straight down</text>
  <text x="24" y="124">looks down: the subject</text>
  <text x="24" y="142">seems smaller, vulnerable</text>
  <text x="24" y="240">neutral</text>
  <text x="24" y="338">looks up: the subject</text>
  <text x="24" y="356">seems bigger, powerful</text>
  <text x="24" y="406">the most extreme</text>
  <text x="24" y="424">low angle</text>
</g>
<g transform="translate(548 296)">
  <text x="0" y="-18" font-size="16" font-weight="700" fill="#1d1d1f">Dutch angle</text>
  <rect x="0" y="-6" width="124" height="72" rx="5" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
  <g transform="rotate(-14 62 30)">
    <line x1="-4" y1="44" x2="128" y2="44" stroke="#6e6e73" stroke-width="2.5"/>
    <rect x="54" y="8" width="16" height="36" rx="3" fill="#6e6e73"/>
  </g>
  <text x="0" y="88" font-size="14" fill="#6e6e73">camera rolled:</text>
  <text x="0" y="106" font-size="14" fill="#6e6e73">tilted horizon</text>
</g>
</svg>
