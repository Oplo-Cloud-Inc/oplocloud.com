<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540" width="700" height="540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A timeline of recording media from 1880 to today, in five lanes. Film: nitrate film from 1889, and Kodak stops making it in 1951, by which time acetate safety film has replaced it. Tape: Ampex videotape recorder 1956, VHS 1976, the first consumer camcorder 1983. Optical disc: LaserDisc 1978, which was analog, CD 1982, DVD 1996. Hard drive: IBM's first in 1956. Flash: SD card 1999, USB flash drive 2000. Cloud storage: Amazon S3, 2006.</title>
<rect width="700" height="540" fill="#ffffff"/>
<g font-size="14" fill="#6e6e73" text-anchor="middle">
  <text x="160" y="508">1880</text><text x="255" y="508">1910</text><text x="350" y="508">1940</text>
  <text x="445" y="508">1970</text><text x="540" y="508">2000</text><text x="636" y="508">2026</text>
</g>
<g stroke="#e6e6e8" stroke-width="1.5">
  <line x1="160" y1="40" x2="160" y2="488"/><line x1="255" y1="40" x2="255" y2="488"/>
  <line x1="350" y1="40" x2="350" y2="488"/><line x1="445" y1="40" x2="445" y2="488"/>
  <line x1="540" y1="40" x2="540" y2="488"/><line x1="636" y1="40" x2="636" y2="488"/>
</g>
<g font-size="17" font-weight="700" fill="#1d1d1f">
  <text x="20" y="84">Film</text>
  <text x="20" y="164">Tape</text>
  <text x="20" y="244">Optical disc</text>
  <text x="20" y="324">Hard drive</text>
  <text x="20" y="404">Flash</text>
  <text x="20" y="470">Cloud</text>
</g>
<g font-size="13" fill="#6e6e73">
  <text x="20" y="102">celluloid</text>
  <text x="20" y="182">magnetic</text>
  <text x="20" y="262">read by laser</text>
  <text x="20" y="342">spinning platters</text>
  <text x="20" y="422">no moving parts</text>
  <text x="20" y="488">someone else's servers</text>
</g>
<rect x="187" y="70" width="195" height="18" rx="4" fill="#d03b3b" opacity=".75"/>
<rect x="253" y="94" width="383" height="18" rx="4" fill="#2a78d6" opacity=".85"/>
<g font-size="14" font-weight="600" fill="#1d1d1f">
  <text x="190" y="62">Nitrate 1889 → 1951</text>
  <text x="394" y="108">Acetate "safety" film 1909 →</text>
</g>
<rect x="400" y="146" width="236" height="18" rx="4" fill="#8f8e86"/>
<g fill="#1d1d1f"><circle cx="400" cy="155" r="6"/><circle cx="464" cy="155" r="6"/><circle cx="486" cy="155" r="6"/></g>
<g font-size="14" font-weight="600" fill="#1d1d1f">
  <text x="370" y="140" text-anchor="end">Videotape 1956</text>
  <text x="464" y="188" text-anchor="middle">VHS 1976</text>
  <text x="498" y="140">Camcorder 1983</text>
</g>
<rect x="470" y="226" width="166" height="18" rx="4" fill="#12915a" opacity=".85"/>
<g fill="#1d1d1f"><circle cx="470" cy="235" r="6"/><circle cx="483" cy="235" r="6"/><circle cx="530" cy="235" r="6"/></g>
<g font-size="14" font-weight="600" fill="#1d1d1f">
  <text x="462" y="220" text-anchor="end">LaserDisc 1978</text>
  <text x="462" y="268" text-anchor="end">(analog)</text>
  <text x="490" y="268">CD 1982</text>
  <text x="530" y="220" text-anchor="middle">DVD 1996</text>
</g>
<rect x="400" y="306" width="236" height="18" rx="4" fill="#6e4bb5" opacity=".8"/>
<circle cx="400" cy="315" r="6" fill="#1d1d1f"/>
<text x="392" y="300" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="end">IBM 350, 1956</text>
<rect x="537" y="386" width="99" height="18" rx="4" fill="#eb6834"/>
<g fill="#1d1d1f"><circle cx="537" cy="395" r="6"/><circle cx="540" cy="395" r="6"/></g>
<g font-size="14" font-weight="600" fill="#1d1d1f">
  <text x="528" y="380" text-anchor="end">SD card 1999</text>
  <text x="528" y="424" text-anchor="end">USB flash drive 2000</text>
</g>
<rect x="559" y="454" width="77" height="18" rx="4" fill="#b7d3f6"/>
<circle cx="559" cy="463" r="6" fill="#1d1d1f"/>
<text x="550" y="468" font-size="14" font-weight="600" fill="#1d1d1f" text-anchor="end">Amazon S3, 2006</text>
</svg>
