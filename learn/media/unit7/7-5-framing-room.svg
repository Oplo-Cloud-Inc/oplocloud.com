  <rect x="0" y="146" width="320" height="34" fill="#c9a877"/>
  <g stroke="#1d1d1f" stroke-width="9" stroke-linecap="round" fill="none">
    <path d="M290 66 L282 108"/><path d="M282 108 L266 146"/><path d="M282 108 L304 144"/>
