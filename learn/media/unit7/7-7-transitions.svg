<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Six transitions, each as three frames in time order. Cut: a beach scene switches instantly to a city at night. Dissolve: the beach fades through a blend of both into the city. Wipe: the city pushes the beach off the screen from left to right. Match cut: a ball thrown into the sky becomes the moon in the same spot. Jump cut: the same framing of a room, with the person in a different place each time because time has skipped. Cutaway: a person talking, then the mountain they are talking about, then the person again.</title>
<rect width="700" height="700" fill="#ffffff"/>
<defs>
  <g id="A"><rect width="150" height="84" fill="#9ec5f4"/><rect y="56" width="150" height="28" fill="#2a78d6"/><circle cx="112" cy="24" r="12" fill="#fab219"/></g>
  <g id="B"><rect width="150" height="84" fill="#3a3a3c"/><rect x="10" y="40" width="26" height="44" fill="#eb6834"/><rect x="42" y="26" width="30" height="58" fill="#d95926"/><rect x="80" y="46" width="24" height="38" fill="#eb6834"/><rect x="110" y="32" width="30" height="52" fill="#d95926"/><circle cx="130" cy="16" r="9" fill="#f5f5f7"/></g>
  <g id="field"><rect width="150" height="84" fill="#86b6ef"/><rect y="60" width="150" height="24" fill="#12915a"/></g>
  <g id="night"><rect width="150" height="84" fill="#1d1d1f"/><rect y="66" width="150" height="18" fill="#3a3a3c"/></g>
  <g id="room"><rect width="150" height="84" fill="#e8dcc8"/><rect x="96" y="14" width="34" height="26" fill="#b7d3f6" stroke="#8f8e86" stroke-width="2"/><rect y="68" width="150" height="16" fill="#c9a877"/></g>
  <g id="talk"><rect width="150" height="84" fill="#d2d2d7"/><ellipse cx="75" cy="92" rx="44" ry="30" fill="#3a3a3c"/><circle cx="75" cy="40" r="20" fill="#f2c9a1"/></g>
  <g id="mtn"><rect width="150" height="84" fill="#cde2fb"/><path d="M0 84 L46 30 L72 56 L104 18 L150 84 Z" fill="#6e6e73"/><path d="M92 32 L104 18 L116 34 Z" fill="#ffffff"/></g>
</defs>
<g font-size="17" font-weight="700" fill="#1d1d1f">
  <text x="24" y="50">Cut</text><text x="24" y="162">Dissolve</text><text x="24" y="274">Wipe</text>
  <text x="24" y="386">Match cut</text><text x="24" y="498">Jump cut</text><text x="24" y="610">Cutaway</text>
</g>
<g font-size="14" fill="#6e6e73">
  <text x="24" y="72">Instant switch.</text><text x="24" y="90">The default.</text>
  <text x="24" y="184">One scene fades</text><text x="24" y="202">through the other.</text>
  <text x="24" y="296">The new shot pushes</text><text x="24" y="314">the old one off.</text>
  <text x="24" y="408">A shape or motion</text><text x="24" y="426">carries across.</text>
  <text x="24" y="520">Same framing; time</text><text x="24" y="538">skips forward.</text>
  <text x="24" y="632">Leave to show</text><text x="24" y="650">something, return.</text>
</g>
<g>
  <svg x="200" y="24" width="150" height="84"><use href="#A"/></svg>
  <svg x="366" y="24" width="150" height="84"><use href="#A"/></svg>
  <svg x="532" y="24" width="150" height="84"><use href="#B"/></svg>
  <line x1="524" y1="16" x2="524" y2="116" stroke="#d03b3b" stroke-width="3"/>
  <text x="524" y="12" font-size="13" font-weight="700" fill="#a3262a" text-anchor="middle">cut</text>
</g>
<g>
  <svg x="200" y="136" width="150" height="84"><use href="#A"/></svg>
  <svg x="366" y="136" width="150" height="84"><use href="#A"/><g opacity=".5"><use href="#B"/></g></svg>
  <svg x="532" y="136" width="150" height="84"><use href="#B"/></svg>
</g>
<g>
  <svg x="200" y="248" width="150" height="84"><use href="#A"/></svg>
  <svg x="366" y="248" width="150" height="84"><use href="#A"/><svg width="75" height="84"><use href="#B"/></svg><line x1="75" y1="0" x2="75" y2="84" stroke="#ffffff" stroke-width="3"/></svg>
  <path d="M446 290 h22 l-8 -6 m8 6 l-8 6" stroke="#ffffff" stroke-width="3" fill="none"/>
  <svg x="532" y="248" width="150" height="84"><use href="#B"/></svg>
</g>
<g>
  <svg x="200" y="360" width="150" height="84"><use href="#field"/><circle cx="60" cy="54" r="11" fill="#fab219"/><path d="M68 46 Q90 20 112 16" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" fill="none"/></svg>
  <svg x="366" y="360" width="150" height="84"><use href="#field"/><circle cx="112" cy="18" r="11" fill="#fab219"/></svg>
  <svg x="532" y="360" width="150" height="84"><use href="#night"/><circle cx="112" cy="18" r="11" fill="#f5f5f7"/></svg>
  <line x1="524" y1="352" x2="524" y2="452" stroke="#d03b3b" stroke-width="3"/>
</g>
<g font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">
  <svg x="200" y="472" width="150" height="84"><use href="#room"/><circle cx="36" cy="40" r="10" fill="#1d1d1f"/><rect x="26" y="50" width="20" height="30" rx="5" fill="#1d1d1f"/></svg>
  <svg x="366" y="472" width="150" height="84"><use href="#room"/><circle cx="72" cy="40" r="10" fill="#1d1d1f"/><rect x="62" y="50" width="20" height="30" rx="5" fill="#1d1d1f"/></svg>
  <svg x="532" y="472" width="150" height="84"><use href="#room"/><circle cx="118" cy="52" r="10" fill="#1d1d1f"/><rect x="108" y="62" width="20" height="22" rx="5" fill="#1d1d1f"/></svg>
  <text x="275" y="572">0:00</text><text x="441" y="572">0:40</text><text x="607" y="572">1:25</text>
</g>
<g>
  <svg x="200" y="584" width="150" height="84"><use href="#talk"/></svg>
  <svg x="366" y="584" width="150" height="84"><use href="#mtn"/></svg>
  <svg x="532" y="584" width="150" height="84"><use href="#talk"/></svg>
  <text x="441" y="684" font-size="13" font-weight="700" fill="#1d1d1f" text-anchor="middle">the cutaway</text>
</g>
<g stroke="#e6e6e8" stroke-width="1.5">
  <line x1="24" y1="126" x2="676" y2="126"/><line x1="24" y1="238" x2="676" y2="238"/><line x1="24" y1="350" x2="676" y2="350"/>
  <line x1="24" y1="462" x2="676" y2="462"/><line x1="24" y1="580" x2="676" y2="580"/>
</g>
</svg>
