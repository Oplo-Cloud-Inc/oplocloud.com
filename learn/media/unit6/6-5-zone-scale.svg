<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The Zone System: eleven tones from pure black to pure white</title>
<text x="22" y="22" font-size="15" fill="#6e6e73">Each zone is one stop of exposure brighter than the one before</text>
<rect x="22" y="38" width="90" height="110" rx="6" fill="rgb(0,0,0)" stroke="#d2d2d7" stroke-width="1"/>
<text x="67.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">0</text>
<line x1="67.0" y1="182" x2="67.0" y2="194" stroke="#86868b"/>
<text x="67.0" y="212" font-size="14" text-anchor="middle" fill="#3a3a3c">Pure black</text>
<rect x="118" y="38" width="90" height="110" rx="6" fill="rgb(27,27,27)" stroke="#d2d2d7" stroke-width="1"/>
<text x="163.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">I</text>
<rect x="214" y="38" width="90" height="110" rx="6" fill="rgb(48,48,48)" stroke="#d2d2d7" stroke-width="1"/>
<text x="259.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">II</text>
<rect x="310" y="38" width="90" height="110" rx="6" fill="rgb(71,71,71)" stroke="#d2d2d7" stroke-width="1"/>
<text x="355.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">III</text>
<line x1="355.0" y1="182" x2="355.0" y2="194" stroke="#86868b"/>
<text x="355.0" y="212" font-size="14" text-anchor="middle" fill="#3a3a3c">Dark tones,</text>
<text x="355.0" y="229" font-size="14" text-anchor="middle" fill="#3a3a3c">full texture</text>
<rect x="406" y="38" width="90" height="110" rx="6" fill="rgb(94,94,94)" stroke="#d2d2d7" stroke-width="1"/>
<text x="451.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">IV</text>
<rect x="502" y="38" width="90" height="110" rx="6" fill="rgb(119,119,119)" stroke="#d2d2d7" stroke-width="1"/>
<text x="547.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">V</text>
<line x1="547.0" y1="182" x2="547.0" y2="194" stroke="#86868b"/>
<text x="547.0" y="212" font-size="14" text-anchor="middle" fill="#3a3a3c">Middle grey</text>
<rect x="598" y="38" width="90" height="110" rx="6" fill="rgb(145,145,145)" stroke="#d2d2d7" stroke-width="1"/>
<text x="643.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">VI</text>
<rect x="694" y="38" width="90" height="110" rx="6" fill="rgb(171,171,171)" stroke="#d2d2d7" stroke-width="1"/>
<text x="739.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">VII</text>
<line x1="739.0" y1="182" x2="739.0" y2="194" stroke="#86868b"/>
<text x="739.0" y="212" font-size="14" text-anchor="middle" fill="#3a3a3c">Light tones,</text>
<text x="739.0" y="229" font-size="14" text-anchor="middle" fill="#3a3a3c">full texture</text>
<rect x="790" y="38" width="90" height="110" rx="6" fill="rgb(198,198,198)" stroke="#d2d2d7" stroke-width="1"/>
<text x="835.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">VIII</text>
<rect x="886" y="38" width="90" height="110" rx="6" fill="rgb(226,226,226)" stroke="#d2d2d7" stroke-width="1"/>
<text x="931.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">IX</text>
<rect x="982" y="38" width="90" height="110" rx="6" fill="rgb(255,255,255)" stroke="#d2d2d7" stroke-width="1"/>
<text x="1027.0" y="172" font-size="18" font-weight="600" text-anchor="middle" fill="#1d1d1f">X</text>
<line x1="1027.0" y1="182" x2="1027.0" y2="194" stroke="#86868b"/>
<text x="1027.0" y="212" font-size="14" text-anchor="middle" fill="#3a3a3c">Pure white</text>
</svg>