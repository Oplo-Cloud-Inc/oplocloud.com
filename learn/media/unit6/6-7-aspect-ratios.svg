<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Common aspect ratios drawn at the same height: 1:1, 4:5, 4:3, 3:2 and 16:9</title>
<rect x="25.2" y="20" width="150.0" height="150" rx="6" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="100.2" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1d1d1f">1:1</text>
<text x="100.2" y="200" font-size="15" text-anchor="middle" fill="#6e6e73">Square posts,</text>
<text x="100.2" y="220" font-size="15" text-anchor="middle" fill="#6e6e73">6×6 film</text>
<rect x="197.2" y="20" width="120.0" height="150" rx="6" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="257.2" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1d1d1f">4:5</text>
<text x="257.2" y="200" font-size="15" text-anchor="middle" fill="#6e6e73">8×10 prints,</text>
<text x="257.2" y="220" font-size="15" text-anchor="middle" fill="#6e6e73">portrait posts</text>
<rect x="339.2" y="20" width="200.0" height="150" rx="6" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="439.2" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1d1d1f">4:3</text>
<text x="439.2" y="200" font-size="15" text-anchor="middle" fill="#6e6e73">Most phone</text>
<text x="439.2" y="220" font-size="15" text-anchor="middle" fill="#6e6e73">cameras</text>
<rect x="561.2" y="20" width="225.0" height="150" rx="6" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="673.7" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1d1d1f">3:2</text>
<text x="673.7" y="200" font-size="15" text-anchor="middle" fill="#6e6e73">35mm film,</text>
<text x="673.7" y="220" font-size="15" text-anchor="middle" fill="#6e6e73">most DSLRs</text>
<rect x="808.2" y="20" width="266.7" height="150" rx="6" fill="#f5f5f7" stroke="#1d1d1f" stroke-width="2"/>
<text x="941.5" y="103.0" font-size="22" font-weight="600" text-anchor="middle" fill="#1d1d1f">16:9</text>
<text x="941.5" y="200" font-size="15" text-anchor="middle" fill="#6e6e73">Screens</text>
<text x="941.5" y="220" font-size="15" text-anchor="middle" fill="#6e6e73">and video</text>
</svg>