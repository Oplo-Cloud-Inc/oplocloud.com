<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Same stands, same moment, two stories</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">What a photo leaves out can change what it seems to say.</text><use href="#scene" x="24" y="78"/><rect x="44" y="98" width="190" height="100" fill="none" stroke="#2a78d6" stroke-width="3" stroke-dasharray="7 5"/><rect x="424" y="98" width="190" height="100" fill="none" stroke="#eb6834" stroke-width="3" stroke-dasharray="7 5"/><rect x="42.5" y="96.5" width="24" height="24" rx="4" fill="#2a78d6"/><text x="54.5" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A</text><rect x="422.5" y="96.5" width="24" height="24" rx="4" fill="#eb6834"/><text x="434.5" y="114" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">B</text><text x="24" y="298" font-size="16" font-weight="600" fill="#1d1d1f">The whole picture: about half full.</text><svg x="24" y="318" width="312" height="164" viewBox="20 20 190 100"><use href="#scene"/></svg><rect x="24" y="318" width="312" height="164" fill="none" stroke="#2a78d6" stroke-width="3"/><text x="24" y="510" font-size="19" font-weight="700" fill="#2a78d6">A  “Packed house!”</text><svg x="364" y="318" width="312" height="164" viewBox="400 20 190 100"><use href="#scene"/></svg><rect x="364" y="318" width="312" height="164" fill="none" stroke="#eb6834" stroke-width="3"/><text x="364" y="510" font-size="19" font-weight="700" fill="#eb6834">B  “Nobody came!”</text>
