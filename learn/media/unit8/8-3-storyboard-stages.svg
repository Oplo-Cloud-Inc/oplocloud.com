<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="700" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four stages of a storyboard, left to right. 1, Concept: a few rough sketches that ask whether the idea is clear. 2, Production: every shot with camera, dialogue and sound notes, asking how to make it. 3, Presentation: clean, finished panels for people outside the team, asking whether a client will understand. 4, Animatic: the panels timed to sound and played as a video, asking whether it flows and how long it is.</title>
