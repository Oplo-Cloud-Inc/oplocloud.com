<rect width="700" height="400" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">From rough idea to moving plan</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">The same story, boarded in more and more detail.</text><rect x="24" y="80" width="150" height="300" rx="14" fill="#f5f5f7"/><rect x="39" y="100" width="36" height="26" fill="#ffffff" stroke="#55555a" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M45 116 q6 -8 12 0 t12 0" fill="none" stroke="#55555a" stroke-width="1.2"/><rect x="83" y="94" width="36" height="26" fill="#ffffff" stroke="#55555a" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M89 110 q6 -8 12 0 t12 0" fill="none" stroke="#55555a" stroke-width="1.2"/><rect x="123" y="104" width="36" height="26" fill="#ffffff" stroke="#55555a" stroke-width="1.2" stroke-dasharray="3 2"/><path d="M129 120 q6 -8 12 0 t12 0" fill="none" stroke="#55555a" stroke-width="1.2"/><path d="M47 144 q30 30 70 20" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#b)"/><text x="99" y="184" font-size="26" font-weight="700" fill="#2a78d6" text-anchor="middle">?</text><circle cx="50" cy="238" r="13" fill="#2a78d6"/><text x="50" y="243" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="70" y="244" font-size="17" font-weight="700" fill="#1d1d1f">Concept</text><text x="38" y="272" font-size="15" font-weight="600" fill="#2a78d6">Is the idea clear?</text><text x="38" y="298" font-size="14.5" fill="#6e6e73">A few rough</text><text x="38" y="316.9" font-size="14.5" fill="#6e6e73">sketches of the</text><text x="38" y="335.8" font-size="14.5" fill="#6e6e73">whole story.</text><path d="M176 150 l10 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><rect x="194" y="80" width="150" height="300" rx="14" fill="#f5f5f7"/><rect x="209" y="94" width="36" height="24" fill="#ffffff" stroke="#6e6e73" stroke-width="1.2"/><circle cx="223" cy="107" r="5" fill="none" stroke="#55555a" stroke-width="1"/><line x1="209" y1="126" x2=