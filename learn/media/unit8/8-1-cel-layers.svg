<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 510" width="700" height="510" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four layers of an animation stacked like cards: 1, a painted background of a room; 2, a clear cel with a woman's body in an armchair; 3, a clear cel with her head; 4, a clear cel with only her mouth. Photographed together they make one frame. The background is painted once and the body drawn once; the head is redrawn when she turns; only the mouth layer is redrawn for every sound as she talks, shown as four mouth shapes.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>
<rect width="700" height="510" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Layers of cels: redraw only what moves</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Clear plastic sheets are stacked on a painted background and photographed together.</text><rect x="24" y="176" width="250" height="170" rx="4" fill="none" stroke="#d2d2d7" stroke-width="1.5"/><g transform="translate(24 176)"><rect x="0" y="0" width="250" height="170" fill="#f3e6cf"/><rect x="0" y="124" width="250" height="46" fill="#d9c3a0"/><rect x="170" y="20" width="56" height="52" fill="#cfe3f7" stroke="#a78a5f" stroke-width="3"/><line x1="198" y1="20" x2="198" y2="72" stroke="#a78a5f" stroke-width="2"/><line x1="170" y1="46" x2="226" y2="46" stroke="#a78a5f" stroke-width="2"/><rect x="20" y="26" width="34" height="26" fill="#e7c9a0" stroke="#a78a5f" stroke-width="2"/></g><rect x="24" y="176" width="250" height="170" rx="4" fill="none" stroke="#6e6e73" stroke-width="1.5"/><circle cx="276" cy="178" r="12" fill="#1d1d1f"/><text x="276" y="183" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><rect x="54" y="146" width="250" height="170" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.5" fill-opacity="0.55"/><g transform="translate(54 146)"><rect x="56" y="52" width="76" height="86" rx="12" fill="#b0413e"/><rect x="44" y="104" width="100" height="30" rx="8" fill="#c24f4a"/><rect x="44" y="96" width="18" height="42" rx="6" fill="#9c3835"/><rect x="126" y="96" width="18" height="42" rx="6" fill="#9c3835"/><line x1="64" y1="138" x2="64" y2="152" stroke="#6d4a2a" stroke-width="4"/><line x1="124" y1="138" x2="124" y2="152" stroke="#6d4a2a" stroke-width="4"/><path d="M80 64 h36 l4 46 h-44 z" fill="#2a78d6"/><path d="M78 108 h34 l22 4 v12 h-56 z" fill="#27466e"/><line x1="130" y1="118" x2="136" y2="146" stroke="#27466e" stroke-width="9"/><rect x="128" y="144" width="18" height="7" rx="3" fill="#1d1d1f"/></g><circle cx="306" cy="148" r="12" fill="#1d1d1f"/><text x="306" y="153" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><rect x="84" y="116" width="250" height="170" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.5" fill-opacity="0.55"/><g transform="translate(84 116)"><circle cx="98" cy="44" r="17" fill="#f1c7a5"/><path d="M80 44 q0 -24 20 -22 q18 0 16 22 q-6 -12 -18 -12 q-12 0 -18 12 z" fill="#3b2a20"/><circle cx="92" cy="44" r="1.8" fill="#1d1d1f"/><circle cx="105" cy="44" r="1.8" fill="#1d1d1f"/></g><circle cx="336" cy="118" r="12" fill="#1d1d1f"/><text x="336" y="123" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><rect x="114" y="86" width="250" height="170" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.5" fill-opacity="0.55"/><g transform="translate(114 86)"><ellipse cx="98.5" cy="53" rx="4.5" ry="2.6" fill="#8a1c1c"/></g><circle cx="366" cy="88" r="12" fill="#eb6834"/><text x="366" y="93" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M396 262 L446 262" fill="none" stroke="#2a78d6" stroke-width="2.5" marker-end="url(#a)"/><text x="420" y="250" font-size="13.5" font-weight="600" fill="#2a78d6" text-anchor="middle">photograph</text><g transform="translate(462 190) scale(0.86)"><rect x="0" y="0" width="250" height="170" fill="#f3e6cf"/><rect x="0" y="124" width="250" height="46" fill="#d9c3a0"/><rect x="170" y="20" width="56" height="52" fill="#cfe3f7" stroke="#a78a5f" stroke-width="3"/><line x1="198" y1="20" x2="198" y2="72" stroke="#a78a5f" stroke-width="2"/><line x1="170" y1="46" x2="226" y2="46" stroke="#a78a5f" stroke-width="2"/><rect x="20" y="26" width="34" height="26" fill="#e7c9a0" stroke="#a78a5f" stroke-width="2"/><rect x="56" y="52" width="76" height="86" rx="12" fill="#b0413e"/><rect x="44" y="104" width="100" height="30" rx="8" fill="#c24f4a"/><rect x="44" y="96" width="18" height="42" rx="6" fill="#9c3835"/><rect x="126" y="96" width="18" height="42" rx="6" fill="#9c3835"/><line x1="64" y1="138" x2="64" y2="152" stroke="#6d4a2a" stroke-width="4"/><line x1="124" y1="138" x2="124" y2="152" stroke="#6d4a2a" stroke-width="4"/><path d="M80 64 h36 l4 46 h-44 z" fill="#2a78d6"/><path d="M78 108 h34 l22 4 v12 h-56 z" fill="#27466e"/><line x1="130" y1="118" x2="136" y2="146" stroke="#27466e" stroke-width="9"/><rect x="128" y="144" width="18" height="7" rx="3" fill="#1d1d1f"/><circle cx="98" cy="44" r="17" fill="#f1c7a5"/><path d="M80 44 q0 -24 20 -22 q18 0 16 22 q-6 -12 -18 -12 q-12 0 -18 12 z" fill="#3b2a20"/><circle cx="92" cy="44" r="1.8" fill="#1d1d1f"/><circle cx="105" cy="44" r="1.8" fill="#1d1d1f"/><ellipse cx="98.5" cy="53" rx="4.5" ry="2.6" fill="#8a1c1c"/></g><rect x="462" y="190" width="215" height="146.2" rx="4" fill="none" stroke="#6e6e73" stroke-width="1.5"/><text x="569" y="178" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">One frame on film</text><circle cx="36" cy="399" r="11" fill="#1d1d1f"/><text x="36" y="404" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="54" y="404" font-size="15" fill="#6e6e73"><tspan font-weight="650" fill="#1d1d1f">Background</tspan> — painted once</text><circle cx="36" cy="427" r="11" fill="#1d1d1f"/><text x="36" y="432" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="54" y="432" font-size="15" fill="#6e6e73"><tspan font-weight="650" fill="#1d1d1f">Chair and body</tspan> — drawn once, reused</text><circle cx="36" cy="455" r="11" fill="#1d1d1f"/><text x="36" y="460" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="54" y="460" font-size="15" fill="#6e6e73"><tspan font-weight="650" fill="#1d1d1f">Head</tspan> — redrawn when she turns</text><circle cx="36" cy="483" r="11" fill="#eb6834"/><text x="36" y="488" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="54" y="488" font-size="15" fill="#6e6e73"><tspan font-weight="650" fill="#1d1d1f">Mouth</tspan> — redrawn for every sound</text><text x="488" y="398" font-size="15" font-weight="600" fill="#eb6834">Only layer 4 changes</text><text x="488" y="417" font-size="15" font-weight="600" fill="#eb6834">as she talks:</text><rect x="488" y="430" width="40" height="32" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.2"/><g transform="translate(508 446)"><path d="M-9 0 h18" fill="none" stroke="#8a1c1c" stroke-width="3"/></g><rect x="536" y="430" width="40" height="32" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.2"/><g transform="translate(556 446)"><ellipse cx="0" cy="0" rx="6" ry="3.5" fill="#8a1c1c"/></g><rect x="584" y="430" width="40" height="32" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.2"/><g transform="translate(604 446)"><ellipse cx="0" cy="1" rx="7" ry="7" fill="#8a1c1c"/></g><rect x="632" y="430" width="40" height="32" rx="4" fill="#f7fbff" stroke="#9cc0ea" stroke-width="1.2"/><g transform="translate(652 446)"><circle cx="0" cy="0" r="4.5" fill="#8a1c1c"/></g>
</svg>
