<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" width="700" height="520" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A made-up social media post by Jordan Rivera, Lincoln High, saying: home alone all weekend while the family is at the lake till Sunday, tagged Oak Street, Springfield, with a photo of a house showing the number 14 and a person in a Lincoln sweatshirt. Six clues are marked: 1, a full name, which lets a stranger search for everything else; 2, the school, which says where you are every weekday; 3, when the house is empty; 4, a location tag; 5, a house number in the photo; 6, hidden in the photo file, the exact place it was taken, which many phones save.</title>
<rect width="700" height="520" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">One post, six clues</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Everything a stranger could learn from a single, ordinary-looking post.</text><rect x="24" y="82" width="330" height="420" rx="16" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="58" cy="116" r="18" fill="#cfe3f7"/><circle cx="58" cy="111" r="7" fill="#2a78d6"/><path d="M46 129 a12 10 0 0 1 24 0" fill="#2a78d6"/><text x="86" y="113" font-size="16" font-weight="700" fill="#1d1d1f">Jordan Rivera</text><text x="86" y="132" font-size="14" fill="#6e6e73" text-anchor="start">Lincoln High · 2 h</text><text x="42" y="166" font-size="16" fill="#1d1d1f">Home alone ALL weekend while the</text><text x="42" y="186.8" font-size="16" fill="#1d1d1f">family is at the lake till</text><text x="42" y="207.6" font-size="16" fill="#1d1d1f">Sunday!!</text><path d="M42 223 a6 6 0 1 1 12 0 c0 5 -6 10 -6 10 c0 0 -6 -5 -6 -10 z" fill="#d70015"/><circle cx="48" cy="223.6" r="2.2" fill="#ffffff"/><text x="60" y="233.6" font-size="14.5" font-weight="600" fill="#6e6e73">Oak Street, Springfield</text><rect x="42" y="247.6" width="294" height="176" rx="10" fill="#dcecf9"/><rect x="42" y="377.6" width="294" height="46" fill="#bfe0c6"/><path d="M68 317 l70 -44 l70 44 z" fill="#b0413e"/><rect x="78" y="317.6" width="120" height="72" fill="#f3e6cf"/><rect x="124" y="345.6" width="28" height="44" fill="#8a5a2b"/><rect x="158" y="327.6" width="30" height="20" fill="#ffffff" stroke="#6e6e73" stroke-width="1"/><text x="173" y="342.6" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">14</text><circle cx="260" cy="317.6" r="13" fill="#f1c7a5"/><path d="M236 335 q24 -10 48 0 l4 60 h-56 z" fill="#27466e"/><text x="260" y="365.6" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">LINCOLN</text><line x1="42" y1="443.6" x2="336" y2="443.6" stroke="#e6e6e8" stroke-width="1"/><text x="42" y="469.6" font-size="14" fill="#6e6e73" text-anchor="start">24 likes · 5 comments</text><circle cx="216" cy="108" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="216" y="112.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="230" cy="127" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="230" y="131.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="330" cy="161" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="330" y="165.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="246" cy="228.6" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="246" y="233.1" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><circle cx="202" cy="337.6" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="202" y="342.1" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><circle cx="320" cy="263.6" r="11" fill="#d70015" stroke="#ffffff" stroke-width="2"/><text x="320" y="268.1" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><circle cx="390" cy="103" r="11" fill="#d70015"/><text x="390" y="107.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="410" y="108" font-size="15.5" font-weight="700" fill="#1d1d1f">Full name</text><text x="410" y="128" font-size="14.5" fill="#6e6e73">lets a stranger search for</text><text x="410" y="146.9" font-size="14.5" fill="#6e6e73">everything else</text><circle cx="390" cy="169" r="11" fill="#d70015"/><text x="390" y="173.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="410" y="174" font-size="15.5" font-weight="700" fill="#1d1d1f">School</text><text x="410" y="194" font-size="14.5" fill="#6e6e73">says where you are every weekday</text><circle cx="390" cy="235" r="11" fill="#d70015"/><text x="390" y="239.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="410" y="240" font-size="15.5" font-weight="700" fill="#1d1d1f">When the house is empty</text><text x="410" y="260" font-size="14.5" fill="#6e6e73">an open invitation to a burglar</text><circle cx="390" cy="301" r="11" fill="#d70015"/><text x="390" y="305.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="410" y="306" font-size="15.5" font-weight="700" fill="#1d1d1f">A location tag</text><text x="410" y="326" font-size="14.5" fill="#6e6e73">puts the post on a map</text><circle cx="390" cy="367" r="11" fill="#d70015"/><text x="390" y="371.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="410" y="372" font-size="15.5" font-weight="700" fill="#1d1d1f">A house number in the photo</text><text x="410" y="392" font-size="14.5" fill="#6e6e73">turns a street into an address</text><circle cx="390" cy="433" r="11" fill="#d70015"/><text x="390" y="437.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="410" y="438" font-size="15.5" font-weight="700" fill="#1d1d1f">Hidden in the photo file</text><text x="410" y="458" font-size="14.5" fill="#6e6e73">many phones save the exact place</text><text x="410" y="476.9" font-size="14.5" fill="#6e6e73">a photo was taken</text>
</svg>
