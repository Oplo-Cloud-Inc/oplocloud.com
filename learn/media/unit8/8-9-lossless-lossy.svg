<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 480" width="700" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A strip of sixteen pixels of sky: shades of blue with three white cloud pixels in the middle. Lossless packs it as counts of identical pixels — 2 dark blue, 2 blue, 2 mid blue, 3 white, 2 mid blue, 3 light blue, 2 pale blue — and unpacks to exactly the same strip. Lossy treats similar blues as one: 6 blue, 3 white, 7 light blue — much smaller, but the fine shading is gone for good. Photos and most online video use lossy compression; text, spreadsheets and bank records must be lossless.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86868b"/></marker></defs>
<rect width="700" height="480" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Two ways to make a picture smaller</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">A strip of sky, sixteen pixels long, packed two ways.</text><text x="24" y="98" font-size="16" font-weight="700" fill="#1d1d1f">The picture</text><rect x="140" y="78" width="32" height="30" fill="#2f6fc4" stroke="#c9d1db" stroke-width="1"/><rect x="172" y="78" width="32" height="30" fill="#2f6fc4" stroke="#c9d1db" stroke-width="1"/><rect x="204" y="78" width="32" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="236" y="78" width="32" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="268" y="78" width="32" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="300" y="78" width="32" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="332" y="78" width="32" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="364" y="78" width="32" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="396" y="78" width="32" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="428" y="78" width="32" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="460" y="78" width="32" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="492" y="78" width="32" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="524" y="78" width="32" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="556" y="78" width="32" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="588" y="78" width="32" height="30" fill="#8ab6ea" stroke="#c9d1db" stroke-width="1"/><rect x="620" y="78" width="32" height="30" fill="#8ab6ea" stroke="#c9d1db" stroke-width="1"/><text x="24" y="150" font-size="18" font-weight="700" fill="#12915a">Lossless</text><text x="24" y="172" font-size="15" fill="#6e6e73">Writes each run of identical pixels as a count. Nothing is changed.</text><rect x="24" y="190" width="38" height="30" rx="6" fill="#2f6fc4" stroke="#c9d1db" stroke-width="1"/><text x="43" y="210" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2×</text><rect x="66" y="190" width="38" height="30" rx="6" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><text x="85" y="210" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2×</text><rect x="108" y="190" width="38" height="30" rx="6" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><text x="127" y="210" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2×</text><rect x="150" y="190" width="38" height="30" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><text x="169" y="210" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">3×</text><rect x="192" y="190" width="38" height="30" rx="6" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><text x="211" y="210" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2×</text><rect x="234" y="190" width="38" height="30" rx="6" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><text x="253" y="210" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">3×</text><rect x="276" y="190" width="38" height="30" rx="6" fill="#8ab6ea" stroke="#c9d1db" stroke-width="1"/><text x="295" y="210" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">2×</text><path d="M326 205 l30 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><rect x="370" y="190" width="19" height="30" fill="#2f6fc4" stroke="#c9d1db" stroke-width="1"/><rect x="389" y="190" width="19" height="30" fill="#2f6fc4" stroke="#c9d1db" stroke-width="1"/><rect x="408" y="190" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="427" y="190" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="446" y="190" width="19" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="465" y="190" width="19" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="484" y="190" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="503" y="190" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="522" y="190" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="541" y="190" width="19" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="560" y="190" width="19" height="30" fill="#5591da" stroke="#c9d1db" stroke-width="1"/><rect x="579" y="190" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="598" y="190" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="617" y="190" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="636" y="190" width="19" height="30" fill="#8ab6ea" stroke="#c9d1db" stroke-width="1"/><rect x="655" y="190" width="19" height="30" fill="#8ab6ea" stroke="#c9d1db" stroke-width="1"/><path d="M25 246 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="251" font-size="15" font-weight="600" fill="#1d1d1f">Smaller</text><path d="M275 246 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="251" font-size="15" font-weight="600" fill="#1d1d1f">Unpacks exactly the same</text><text x="24" y="290" font-size="18" font-weight="700" fill="#eb6834">Lossy</text><text x="24" y="312" font-size="15" fill="#6e6e73">Treats colours that are nearly the same as the same. Detail is thrown away.</text><rect x="24" y="330" width="38" height="30" rx="6" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><text x="43" y="350" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">6×</text><rect x="66" y="330" width="38" height="30" rx="6" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><text x="85" y="350" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">3×</text><rect x="108" y="330" width="38" height="30" rx="6" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><text x="127" y="350" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">7×</text><path d="M158 345 l30 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><rect x="202" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="221" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="240" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="259" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="278" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="297" y="330" width="19" height="30" fill="#3f7fd0" stroke="#c9d1db" stroke-width="1"/><rect x="316" y="330" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="335" y="330" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="354" y="330" width="19" height="30" fill="#ffffff" stroke="#c9d1db" stroke-width="1"/><rect x="373" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="392" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="411" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="430" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="449" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="468" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><rect x="487" y="330" width="19" height="30" fill="#6fa3e2" stroke="#c9d1db" stroke-width="1"/><path d="M25 386 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="50" y="391" font-size="15" font-weight="600" fill="#1d1d1f">Much smaller</text><path d="M275 380 L287 392 M287 380 L275 392" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><text x="300" y="391" font-size="15" font-weight="600" fill="#1d1d1f">The fine shading is gone for good</text><text x="24" y="440" font-size="15" fill="#1d1d1f">Photos (JPEG) and most online video use lossy compression. Text, spreadsheets and bank</text><text x="24" y="459.5" font-size="15" fill="#1d1d1f">records must be lossless: one wrong digit is a different number.</text>
</svg>
