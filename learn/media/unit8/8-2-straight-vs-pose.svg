<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 490" width="700" height="490" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two rows of seven frames. Straight ahead: a flame drawn in frames numbered 1 to 7 in order, each flickering a little differently — loose and lively, and good for fire, water and wild action. Pose to pose: a ball's hop where frames 1 and 7, the keys, are drawn first and second, frame 4, the breakdown, third, and the in-betweens last — planned and clear, and good for acting and emotion.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86868b"/></marker></defs>
<rect width="700" height="490" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Two ways to draw a scene</text><text x="24" y="70" font-size="18" font-weight="700" fill="#1d1d1f">Straight ahead</text><text x="24" y="92" font-size="15" fill="#6e6e73">Draw frame 1, then 2, then 3 … in order.</text><rect x="30" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M68.4 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(70 154) scale(1 1) translate(-70 -154)"/><path d="M69.4 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="70" cy="196" r="12" fill="#1d1d1f"/><text x="70" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><path d="M112 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="124" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M166 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(164 154) scale(1 1.1) translate(-164 -154)"/><path d="M167 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="164" cy="196" r="12" fill="#1d1d1f"/><text x="164" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><path d="M206 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="218" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M257.2 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(258 154) scale(1 0.9) translate(-258 -154)"/><path d="M258.2 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="258" cy="196" r="12" fill="#1d1d1f"/><text x="258" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><path d="M300 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="312" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M354.4 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(352 154) scale(1 1.2) translate(-352 -154)"/><path d="M355.4 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="352" cy="196" r="12" fill="#1d1d1f"/><text x="352" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><path d="M394 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="406" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M443.6 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(446 154) scale(1 1.1) translate(-446 -154)"/><path d="M444.6 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="446" cy="196" r="12" fill="#1d1d1f"/><text x="446" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><path d="M488 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="500" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M541.2 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(540 154) scale(1 1.2) translate(-540 -154)"/><path d="M542.2 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="540" cy="196" r="12" fill="#1d1d1f"/><text x="540" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><path d="M582 142 l8 0" fill="none" stroke="#86868b" stroke-width="1.8" marker-end="url(#a)"/><rect x="594" y="110" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><path d="M632.8 154 c-14 -8 -12 -24 -2 -34 c-1 10 6 12 8 4 c6 10 12 18 4 30 z" fill="#eb6834" transform="translate(634 154) scale(1 1) translate(-634 -154)"/><path d="M633.8 154 c-6 -4 -5 -12 0 -16 c1 6 5 8 5 16 z" fill="#f5b300"/><circle cx="634" cy="196" r="12" fill="#1d1d1f"/><text x="634" y="201" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="24" y="238" font-size="15" fill="#1d1d1f">Loose and lively, and easy to drift. Good for fire, water and wild action.</text><text x="24" y="292" font-size="18" font-weight="700" fill="#1d1d1f">Pose to pose</text><text x="24" y="314" font-size="15" fill="#6e6e73">Draw the key poses first, then fill in between.</text><rect x="30" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="38" y1="392" x2="102" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="70" cy="384" r="8" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><rect x="50" y="408" width="40" height="22" rx="11" fill="#1d1d1f"/><text x="70" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">1st</text><rect x="124" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="132" y1="392" x2="196" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="164" cy="364" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><rect x="144" y="408" width="40" height="22" rx="11" fill="#86868b"/><text x="164" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4th</text><rect x="218" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="226" y1="392" x2="290" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="258" cy="352" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><rect x="238" y="408" width="40" height="22" rx="11" fill="#86868b"/><text x="258" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4th</text><rect x="312" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="320" y1="392" x2="384" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="352" cy="348" r="8" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><rect x="332" y="408" width="40" height="22" rx="11" fill="#2a78d6"/><text x="352" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">3rd</text><rect x="406" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="414" y1="392" x2="478" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="446" cy="352" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><rect x="426" y="408" width="40" height="22" rx="11" fill="#86868b"/><text x="446" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4th</text><rect x="500" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="508" y1="392" x2="572" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="540" cy="364" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><rect x="520" y="408" width="40" height="22" rx="11" fill="#86868b"/><text x="540" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">4th</text><rect x="594" y="332" width="80" height="64" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><line x1="602" y1="392" x2="666" y2="392" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="634" cy="384" r="8" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><rect x="614" y="408" width="40" height="22" rx="11" fill="#1d1d1f"/><text x="634" y="424" font-size="13.5" font-weight="700" fill="#ffffff" text-anchor="middle">2nd</text><text x="24" y="460" font-size="15" fill="#1d1d1f">Planned and clear, with the timing under control. Good for acting and emotion.</text>
</svg>
