<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A production storyboard panel. Above the sketch: the scene and shot number, SC 12 SHOT 3, and the shot size, MEDIUM SHOT. The sketch shows a girl reaching for a door, with orange arrows in the corners marked PUSH IN for the camera move. Below it: ACTION, Mia reaches for the door; DIALOGUE, Mia says Hello? Anyone home?; SOUND, a floorboard creaks; TIME, 3 seconds; and the transition, CUT TO.</title>
<defs><marker id="o" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#eb6834"/></marker></defs>
<rect width="700" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">What a production storyboard panel holds</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">A sketch of the shot — and everything the crew needs to make it.</text><rect x="180" y="76" width="352" height="340" rx="10" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><text x="196" y="98" font-size="14" font-weight="700" fill="#1d1d1f">SC 12 · SHOT 3</text><text x="516" y="98" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="end">MEDIUM SHOT</text><rect x="196" y="108" width="320" height="180" fill="#fbfbfd" stroke="#1d1d1f" stroke-width="2"/><line x1="196" y1="258" x2="516" y2="258" stroke="#55555a" stroke-width="1.5"/><rect x="410" y="134" width="72" height="124" fill="#efe4d2" stroke="#55555a" stroke-width="2"/><circle cx="422" cy="202" r="4.5" fill="#55555a"/><circle cx="324" cy="170" r="17" fill="#ffffff" stroke="#55555a" stroke-width="2"/><path d="M306 168 q4 -24 22 -18 q12 6 8 22" fill="none" stroke="#55555a" stroke-width="2.5"/><path d="M312 184 q10 50 0 76 M336 184 q-8 40 6 76" fill="none" stroke="#55555a" stroke-width="2"/><path d="M334 200 q30 8 78 14" fill="none" stroke="#55555a" stroke-width="2"/><circle cx="319" cy="168" r="1.6" fill="#55555a"/><path d="M314 200 q-14 14 -10 36" fill="none" stroke="#55555a" stroke-width="2"/><path d="M308 158 q18 -6 30 8" fill="none" stroke="#55555a" stroke-width="2"/><path d="M210 122 l20 20" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/><path d="M502 122 l-20 20" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/><path d="M210 274 l20 -20" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/><path d="M502 274 l-20 -20" fill="none" stroke="#eb6834" stroke-width="3" marker-end="url(#o)"/><text x="356" y="128" font-size="13.5" font-weight="700" fill="#eb6834" text-anchor="middle">PUSH IN</text><text x="196" y="318" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">ACTION</tspan><tspan dx="8">Mia reaches for the door.</tspan></text><text x="196" y="342" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">DIALOGUE</tspan><tspan dx="8">MIA: “Hello? Anyone home?”</tspan></text><text x="196" y="366" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">SOUND</tspan><tspan dx="8">A floorboard creaks.</tspan></text><text x="196" y="390" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">TIME</tspan><tspan dx="8">3 seconds</tspan></text><text x="516" y="390" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="end">CUT TO →</text><text x="24" y="103" font-size="15" font-weight="700" fill="#2a78d6">Scene and shot</text><line x1="147.6" y1="98" x2="190" y2="93" stroke="#9cc0ea" stroke-width="1.5"/><text x="24" y="185" font-size="15" font-weight="700" fill="#2a78d6">Camera move</text><line x1="122.4" y1="180" x2="208" y2="128" stroke="#9cc0ea" stroke-width="1.5"/><text x="24" y="318" font-size="15" font-weight="700" fill="#2a78d6">Action</text><line x1="80.4" y1="313" x2="190" y2="313" stroke="#9cc0ea" stroke-width="1.5"/><text x="24" y="342" font-size="15" font-weight="700" fill="#2a78d6">Dialogue</text><line x1="97.2" y1="337" x2="190" y2="337" stroke="#9cc0ea" stroke-width="1.5"/><text x="676" y="103" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="end">Shot size</text><line x1="594.4" y1="98" x2="522" y2="93" stroke="#9cc0ea" stroke-width="1.5"/><text x="676" y="185" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="end">What we see</text><line x1="577.6" y1="180" x2="488" y2="178" stroke="#9cc0ea" stroke-width="1.5"/><text x="676" y="366" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="end">Sound</text><line x1="628" y1="361" x2="436" y2="361" stroke="#9cc0ea" stroke-width="1.5"/><text x="676" y="390" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="end">Transition</text><line x1="586" y1="385" x2="522" y2="385" stroke="#9cc0ea" stroke-width="1.5"/>
</svg>
