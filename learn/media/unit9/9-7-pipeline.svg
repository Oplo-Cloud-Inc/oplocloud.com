<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three steps in a row with arrows between them. 1, Import and place the footage on the timeline. 2, Edit and time it to the planned length. 3, Sync it to the music bed.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#86868b"/></marker></defs>
<rect width="720" height="240" fill="#ffffff"/>
<g>
  <rect x="24" y="44" width="196" height="150" rx="16" fill="#f5f5f7"/>
  <circle cx="56" cy="78" r="16" fill="#8f5cff"/><text x="56" y="84" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text>
  <text x="44" y="126" font-size="17" font-weight="600" fill="#1d1d1f">Import &amp; place</text>
  <text x="44" y="150" font-size="13" fill="#6e6e73">Bring the footage in</text>
  <text x="44" y="168" font-size="13" fill="#6e6e73">and lay it on the timeline</text>
</g>
<line x1="226" y1="119" x2="258" y2="119" stroke="#86868b" stroke-width="2.5" marker-end="url(#a)"/>
<g>
  <rect x="262" y="44" width="196" height="150" rx="16" fill="#f5f5f7"/>
  <circle cx="294" cy="78" r="16" fill="#8f5cff"/><text x="294" y="84" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text>
  <text x="282" y="126" font-size="17" font-weight="600" fill="#1d1d1f">Edit &amp; time</text>
  <text x="282" y="150" font-size="13" fill="#6e6e73">Cut, transition, trim</text>
  <text x="282" y="168" font-size="13" fill="#6e6e73">to the planned length</text>
</g>
<line x1="464" y1="119" x2="496" y2="119" stroke="#86868b" stroke-width="2.5" marker-end="url(#a)"/>
<g>
  <rect x="500" y="44" width="196" height="150" rx="16" fill="#f5f5f7"/>
  <circle cx="532" cy="78" r="16" fill="#8f5cff"/><text x="532" y="84" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  <text x="520" y="126" font-size="17" font-weight="600" fill="#1d1d1f">Sync to music</text>
  <text x="520" y="150" font-size="13" fill="#6e6e73">Match fast and slow</text>
  <text x="520" y="168" font-size="13" fill="#6e6e73">music to the scenes</text>
</g>
</svg>
