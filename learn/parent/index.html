<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OEdu Family</title>
<meta name="description" content="OEdu Family — a child's school record, read from the school's own record: grades, exams, the road to graduation, and everything the school keeps.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f2efe9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090d" media="(prefers-color-scheme: dark)">
<!-- Added to a home screen it opens as a place of its own, under a status bar
     it draws behind. Numbers are linked on purpose, so iOS is told not to turn
     a credit total into a phone number. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="OEdu Family">
<meta name="format-detection" content="telephone=no, email=no, address=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='12 12 76 76'%3E%3Cpath fill='%231d1d1f' fill-rule='evenodd' d='M12,40 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0 M32,60 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0'/%3E%3C/svg%3E">
<!-- The theme is applied before the stylesheet paints, so a family who chose
     dark does not get a white flash every time they open the page. -->
<script>
  (function () {
    try {
      var t = localStorage.getItem("oedu-family-theme");
      if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage blocked: follow the system */ }
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="parent.css?v=7d23d169">
</head>
<body>

<div class="fx-sky" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- Waiting on the server, before anything is known about who this is. -->
<div class="fm-boot" id="boot" aria-live="polite">
  <div class="fm-boot-orb"><i></i><i></i></div>
  <span>Opening the record…</span>
</div>

<!-- There is no sign-in here. Everybody signs in at the root of OEdu, which
     sends a family back to this page by their roles. -->

<!-- ------------------------------------------------------------ The view -->
<div class="fm" id="app" hidden>
  <header class="fm-top">
    <a class="fm-brand" href="./" aria-label="OEdu Family">
      <svg viewBox="12 12 76 76" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M12,40 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0 M32,60 a28,28 0 1,0 56,0 a28,28 0 1,0 -56,0"/></svg>
      <span>OEdu</span><em>Family</em>
    </a>
    <button class="fm-who" id="who" type="button" aria-haspopup="menu" aria-expanded="false"></button>
    <span class="fm-sp"></span>
    <button class="fm-find" id="findBtn" type="button" aria-label="Find a section">
      <span class="ic-slot" data-icon="search"></span>
      <span class="lbl">Find a section</span>
      <kbd>⌘K</kbd>
    </button>
    <button class="fm-me" id="me" type="button" aria-haspopup="menu" aria-expanded="false"></button>
  </header>

  <div class="fm-banner" id="banner" hidden></div>

  <nav class="fm-dock" id="dock" aria-label="Parts of the record"></nav>

  <main class="fm-stage" id="stage" tabindex="-1"></main>
</div>

<div class="fs-wrap" id="sheetWrap" hidden>
  <div class="fs-scrim" id="sheetScrim"></div>
  <article class="fs" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"></article>
</div>

<div class="fm-menu" id="menu" role="menu" hidden></div>
<div class="ff-wrap" id="finder" hidden></div>
<div class="fm-tip" id="tip" role="tooltip" hidden></div>
<div class="fm-toast" id="toast" role="status" aria-live="polite"></div>

<script src="../home.js?v=6cb47e0b"></script>
<script src="../api.js?v=eba06ee8"></script>
<script src="viz.js?v=ea4d8611"></script>
<script src="parent.js?v=511bd0b6"></script>
</body>
</html>
