inejoin="round"/>
<path d="M 92.0 324.4 C 95.2 324.3 105.0 324.0 111.4 323.7 C 117.9 323.4 124.4 323.1 130.9 322.8 C 137.4 322.4 143.8 322.1 150.3 321.7 C 156.8 321.3 163.3 320.8 169.8 320.3 C 176.2 319.8 182.7 319.3 189.2 318.7 C 195.7 318.1 202.2 317.5 208.6 316.8 C 215.1 316.0 221.6 315.3 228.1 314.4 C 234.6 313.5 241.0 312.6 247.5 311.5 C 254.0 310.4 260.5 309.3 267.0 308.0 C 273.4 306.7 279.9 305.3 286.4 303.8 C 292.9 302.2 299.4 300.5 305.8 298.6 C 312.3 296.7 318.8 294.7 325.3 292.4 C 331.8 290.1 338.2 287.7 344.7 284.9 C 351.2 282.1 357.7 279.1 364.2 275.8 C 370.6 272.4 377.1 268.8 383.6 264.7 C 390.1 260.6 396.6 256.3 403.0 251.3 C 409.5 246.4 416.0 241.1 422.5 235.1 C 429.0 229.1 435.4 222.7 441.9 215.4 C 448.4 208.2 454.9 200.4 461.4 191.6 C 467.8 182.8 474.3 173.4 480.8 162.7 C 487.3 152.1 493.8 140.6 500.2 127.7 C 506.7 114.8 516.4 92.4 519.7 85.3" fill="none" stroke="#eb6834" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
<line x1="92" y1="328" x2="578" y2="328" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<line x1="92" y1="66" x2="92" y2="328" stroke="#1d1d1f" stroke-width="1.5" stroke-linecap="round"/>
<text x="335.0" y="384" font-size="14.5" fill="#6e6e73" text-anchor="middle">Time</text>
<text transform="rotate(-90 70 197.0)" x="70" y="197.0" font-size="14.5" fill="#6e6e73" text-anchor="middle">Population size</text>
<text x="373.88" y="79.32203389830508" font-size="14.5" fill="#eb6834" font-weight="700">Exponential  —  J</text>
<text x="373.88" y="97.08474576271186" font-size="12.5" fill="#6e6e73">nothing is limiting it, yet</text>
<text x="393.32" y="132.61016949152543" font-size="14.5" fill="#12915a" font-weight="700">Logistic  —  S</text>
<text x="393.32" y="150.3728813559322" font-size="12.5" fill="#6e6e73">limits arrive, growth slows</text>
<line x1="160.0" y1="328.0" x2="160.0" y2="336.0" stroke="#86868b" stroke-width="1.2" stroke-linecap="round"/>
<text x="160.0" y="352.0" font-size="12.5" fill="#6e6e73" text-anchor="middle">slow start</text>
<line x1="296.1" y1="328.0" x2="296.1" y2="336.0" stroke="#86868b" stroke-width="1.2" stroke-linecap="round"/>
<text x="296.1" y="352.0" font-size="12.5" fill="#6e6e73" text-anchor="middle">fastest growth</text>
<line x1="490.5" y1="328.0" x2="490.5" y2="336.0" stroke="#86868b" stroke-width="1.2" stroke-linecap="round"/>
<text x="490.5" y="352.0" font-size="12.5" fill="#6e6e73" text-anchor="middle">levelling off</text>
<text x="22" y="396" font-size="14.5" fill="#1d1d1f">Exponential does not mean fast. It means the increase is a fixed share of what is already there — which is slow</text>
<text x="22" y="432" font-size="14.5" fill="#1d1d1f">at first and then terrifying. Every population grows this way when it is small and nothing is stopping it;</text>
<text x="22" y="450" font-size="14.5" fill="#1d1d1f">nothing goes on doing so, because nowhere is infinite.</text>
</svg>
