<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two population growth models on the same axes, with time along the bottom and population size up the side. Exponential growth is a J-shaped curve: each generation adds a fixed percentage, so the line gets steeper and steeper without limit. Logistic growth is an S-shaped curve: it starts the same way, then bends over as resources run short and levels off at the carrying capacity, drawn as a dashed line labelled K.</title>
<rect width="700" height="470" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Two shapes: one that cannot last, and one that can</text>
<line x1="92.0" y1="105.96610169491527" x2="578.0" y2="105.96610169491527" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="7 5"/>
<text x="586.0" y="110.96610169491527" font-size="16" fill="#1d1d1f" font-weight="700">K</text>
<text x="586.0" y="129.96610169491527" font-size="12.5" fill="#6e6e73">carrying</text>
<text x="586.0" y="144.96610169491527" font-size="12.5" fill="#6e6e73">capacity</text>
