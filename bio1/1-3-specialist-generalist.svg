<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 444" width="700" height="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two tolerance curves on the same axes. The specialist's curve is narrow and tall: it does extremely well across a small range of conditions and fails outside it. The generalist's curve is wide and low: it survives across a much broader range, but is never as abundant anywhere. A koala, which eats only eucalyptus leaves, is the specialist; a raccoon, which eats almost anything and lives from forests to city streets, is the generalist.</title>
<rect width="700" height="444" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Narrow and excellent, or broad and adequate</text>
<path d="M 92.0 292.0 C 97.1 290.6 110.8 288.6 122.7 283.8 C 134.7 279.0 148.3 270.4 163.7 263.2 C 179.0 256.0 196.1 246.8 214.9 240.6 C 233.7 234.5 254.1 229.3 276.3 226.3 C 298.5 223.2 324.1 222.1 348.0 222.1 C 371.9 222.1 397.5 223.2 419.7 226.3 C 441.9 229.3 462.3 234.5 481.1 240.6 C 499.9 246.8 517.0 256.0 532.3 263.2 C 547.7 270.4 561.3 279.0 573.3 283.8 C 585.2 288.6 598.9 290.6 604.0 292.0 L 604.0 292.0 L 92.0 292.0 Z" fill="#dbe8f6"/>
