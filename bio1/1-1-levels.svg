<text x="92" y="462" font-size="12.5" fill="#6e6e73" text-anchor="middle">× everywhere</text>
<text x="168" y="422" font-size="17" fill="#1d1d1f" font-weight="600">Biome</text>
<text x="168" y="444" font-size="14" fill="#6e6e73">Every place on Earth with the same climate and the same kind of life.</text>
<text x="168" y="462" font-size="13.5" fill="#2a78d6" font-style="italic">Every cold-water kelp forest, worldwide.</text>
<line x1="350" y1="465" x2="350.0" y2="470.0" stroke="#86868b" stroke-width="2" stroke-linecap="round"/>
<path d="M 350.0 475.0 L 346.9 468.2 L 353.1 468.2 Z" fill="#86868b"/>
