<text x="168" y="254" font-size="17" fill="#1d1d1f" font-weight="600">Community</text>
<text x="168" y="276" font-size="14" fill="#6e6e73">Every population living together — all the species at once.</text>
<text x="168" y="294" font-size="13.5" fill="#2a78d6" font-style="italic">Bass, crabs, urchins, kelp.</text>
