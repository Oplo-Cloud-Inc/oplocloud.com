<circle cx="92" cy="513.0" r="30" fill="#dceaf8" stroke="#2a78d6" stroke-width="1.6"/>
<path d="M 66 521.0 C 80 507.0 102 527.0 118 511.0" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="92" cy="513.0" r="30" fill="none" stroke="#2a78d6" stroke-width="1.6"/>
<text x="168" y="506" font-size="17" fill="#1d1d1f" font-weight="600">Biosphere</text>
<text x="168" y="528" font-size="14" fill="#6e6e73">Every living thing on Earth, everywhere, as one system.</text>
<text x="168" y="546" font-size="13.5" fill="#2a78d6" font-style="italic">All of it, all at once.</text>
<text x="22" y="582" font-size="14.5" fill="#1d1d1f">Zoom out one step and you have the next level. Nothing new is invented; more is included.</text>
</svg>
