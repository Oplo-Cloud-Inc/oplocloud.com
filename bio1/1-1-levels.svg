<text x="168" y="170" font-size="17" fill="#1d1d1f" font-weight="600">Population</text>
<text x="168" y="192" font-size="14" fill="#6e6e73">Every one of the SAME species, in one place.</text>
<text x="168" y="210" font-size="13.5" fill="#2a78d6" font-style="italic">All the kelp bass in this forest.</text>
