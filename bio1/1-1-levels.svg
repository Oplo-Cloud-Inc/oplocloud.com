<text x="168" y="338" font-size="17" fill="#1d1d1f" font-weight="600">Ecosystem</text>
<text x="168" y="360" font-size="14" fill="#6e6e73">The community PLUS the non-living things it depends on.</text>
<text x="168" y="378" font-size="13.5" fill="#2a78d6" font-style="italic">Add the water, light, rock and temperature.</text>
