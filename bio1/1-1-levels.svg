<text x="168" y="86" font-size="17" fill="#1d1d1f" font-weight="600">Organism</text>
<text x="168" y="108" font-size="14" fill="#6e6e73">One living thing.</text>
<text x="168" y="126" font-size="13.5" fill="#2a78d6" font-style="italic">A single kelp bass.</text>
