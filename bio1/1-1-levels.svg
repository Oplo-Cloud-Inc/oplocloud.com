<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 594" width="700" height="594" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Six levels of biological organisation, from a single organism up to the biosphere. Each level is the one below it, repeated or added to: a population is many organisms of one species; a community is many populations; an ecosystem is a community plus the non-living things around it; a biome is every ecosystem on Earth of the same kind; the biosphere is all life everywhere.</title>
<rect width="700" height="594" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Each level is the one before it, with something added</text>
