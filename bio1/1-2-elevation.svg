<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 476" width="700" height="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Climbing a mountain passes through the same sequence of life zones as walking towards the pole. On the left, Kilimanjaro in cross-section: farmland and rainforest at the base, montane forest, heath and moorland, alpine desert, and ice at the summit at 5,895 metres. On the right, the same sequence laid out by latitude at sea level: temperate forest, boreal forest, tundra, polar desert and ice. Air cools by about 6.5 degrees Celsius for every 1,000 metres climbed, which is why one mountain can hold rainforest at its foot and ice at its top.</title>
<rect width="700" height="476" fill="#ffffff"/>
<text x="22" y="30" font-size="17" fill="#1d1d1f" font-weight="600">Up a mountain, or north to the pole — the same journey</text>
<path d="M 98.0 378.0 L 294.0 378.0 L 277.1 318.3 L 114.9 318.3 Z" fill="#2f8f52"/>
<line x1="291.6" y1="348.2" x2="300" y2="348.2" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="306" y="352.7" font-size="13" fill="#6e6e73">Farmland and rainforest</text>
<path d="M 114.9 318.3 L 277.1 318.3 L 260.2 258.7 L 131.8 258.7 Z" fill="#4f9e5e"/>
<line x1="274.7" y1="288.5" x2="300" y2="288.5" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="306" y="293.0" font-size="13" fill="#6e6e73">Montane forest</text>
<path d="M 131.8 258.7 L 260.2 258.7 L 240.0 187.1 L 152.0 187.1 Z" fill="#8aa86a"/>
<line x1="256.1" y1="222.9" x2="300" y2="222.9" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="306" y="227.4" font-size="13" fill="#6e6e73">Heath and moorland</text>
<path d="M 152.0 187.1 L 240.0 187.1 L 223.1 127.4 L 168.9 127.4 Z" fill="#c2b489"/>
<line x1="237.5" y1="157.2" x2="300" y2="157.2" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="306" y="161.7" font-size="13" fill="#6e6e73">Alpine desert</text>
<path d="M 168.9 127.4 L 223.1 127.4 L 208.0 74.0 L 184.0 74.0 Z" fill="#e4ecf2"/>
<line x1="221.6" y1="100.7" x2="300" y2="100.7" stroke="#d2d2d7" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 4"/>
<text x="306" y="105.2" font-size="13" fill="#6e6e73">Ice and bare rock</text>
<line x1="68.0" y1="378" x2="324.0" y2="378" stroke="#1d1d1f" stroke-width="1.6" stroke-linecap="round"/>
<line x1="80" y1="366.1" x2="90" y2="366.1" stroke="#d2d2d7" stroke-width="1.2" stroke-linecap="round"/>
<text x="76" y="370.6" font-size="12.5" fill="#6e6e73" text-anchor="end">1,000 m</text>
<line x1="80" y1="306.4" x2="90" y2="306.4" stroke="#d2d2d7" stroke-width="1.2" stroke-linecap="round"/>
<text x="76" y="310.9" font-size="12.5" fill="#6e6e73" text-anchor="end">2,000 m</text>
<line x1="80" y1="246.7" x2="90" y2="246.7" stroke="#d2d2d7" stroke-width="1.2" stroke-linecap="round"/>
<text x="76" y="251.2" font-size="12.5" fill="#6e6e73" text-anchor="end">3,000 m</text>
<line x1="80" y1="187.1" x2="90" y2="187.1" stroke="#d2d2d7" stroke-width="1.2" stroke-linecap="round"/>
<text x="76" y="191.6" font-size="12.5" fill="#6e6e73" text-anchor="end">4,000 m</text>
<line x1="80" y1="127.4" x2="90" y2="127.4" stroke="#d2d2d7" stroke-width="1.2" stroke-linecap="round"/>
<text x="76" y="131.9" font-size="12.5" fill="#6e6e73" text-anchor="end">5,000 m</text>
<text x="196" y="402" font-size="14" fill="#1d1d1f" font-weight="600" text-anchor="middle">Kilimanjaro · 3°S</text>
<text x="196" y="421" font-size="13" fill="#6e6e73" text-anchor="middle">farmland to ice in 5 km of climbing</text>
<rect x="476" y="317.2" width="196" height="55.8" fill="#2f8f52" rx="7"/>
<text x="490" y="343.6" font-size="13.5" fill="#ffffff" font-weight="600">Temperate forest</text>
<text x="490" y="361.6" font-size="12.5" fill="#ffffff">40°N</text>
<rect x="476" y="256.4" width="196" height="55.8" fill="#4f9e5e" rx="7"/>
<text x="490" y="282.8" font-size="13.5" fill="#ffffff" font-weight="600">Boreal forest</text>
<text x="490" y="300.8" font-size="12.5" fill="#ffffff">55°N</text>
<rect x="476" y="195.6" width="196" height="55.8" fill="#8aa86a" rx="7"/>
<text x="490" y="222.0" font-size="13.5" fill="#ffffff" font-weight="600">Tundra</text>
<text x="490" y="240.0" font-size="12.5" fill="#ffffff">70°N</text>
<rect x="476" y="134.8" width="196" height="55.8" fill="#c2b489" rx="7"/>
<text x="490" y="161.2" font-size="13.5" fill="#1d1d1f" font-weight="600">Polar desert</text>
<text x="490" y="179.2" font-size="12.5" fill="#6e6e73">78°N</text>
<rect x="476" y="74.0" width="196" height="55.8" fill="#e4ecf2" rx="7"/>
<text x="490" y="100.4" font-size="13.5" fill="#1d1d1f" font-weight="600">Ice</text>
<text x="490" y="118.4" font-size="12.5" fill="#6e6e73">85°N</text>
<text x="574.0" y="402" font-size="14" fill="#1d1d1f" font-weight="600" text-anchor="middle">Going north at sea level</text>
<text x="574.0" y="421" font-size="13" fill="#6e6e73" text-anchor="middle">0 to 5,000 km from home</text>
<line x1="430" y1="150" x2="461.0" y2="150.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<path d="M 468.0 150.0 L 458.4 154.3 L 458.4 145.7 Z" fill="#2a78d6"/>
<text x="430" y="136" font-size="13" fill="#2a78d6" font-weight="600" text-anchor="middle">same zones</text>
<text x="22" y="448" font-size="14.5" fill="#1d1d1f">Air cools about 6.5°C for every 1,000 m climbed. One mountain can hold rainforest at its foot and ice at its top —</text>
<text x="22" y="467" font-size="14.5" fill="#1d1d1f">and a species pushed uphill by a warming climate eventually runs out of mountain.</text>
</svg>
