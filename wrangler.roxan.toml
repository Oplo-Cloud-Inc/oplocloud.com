# ===========================================================================
# Roxan — Oplo's AI, on its own hostname.
#
# `roxan.oplocloud.com` serves `roxan/` and nothing else: the Roxan site at
# the root and the Ministry of Finance cockpit at /mof/. Cloudflare serves the
# directory as static assets; worker/roxan.js only sees requests no file
# answered, and redirects the old oplocloud.com/roxan/ address here.
#
# This file sits at the repository root, beside wrangler.dev.toml, for the
# same reason: the assets directory is published verbatim, so a wrangler.toml
# inside `roxan/` would be served at roxan.oplocloud.com/wrangler.toml.
#
#     npx wrangler deploy -c wrangler.roxan.toml                  → workers.dev
#     npx wrangler deploy -c wrangler.roxan.toml --env production → roxan.oplocloud.com
#
# The bar and footer of every page are written by tools/roxan_chrome.py, with
# every link absolute. Run `python3 tools/roxan_chrome.py` before deploying, or
# the chrome here is whatever it was the last time somebody did.
#
# Each person's Roxan lives in a Durable Object (worker/agent/, class Agent) with
# its own SQLite database. The object keeps their data, runs their work while
# the browser is closed, and wakes itself with an alarm for routines. The first
# deploy creates the class: the [[migrations]] block below must stay as it is,
# and a later change to the class's storage needs a new tag, never an edit.
# It calls the model service over plain HTTP (chat completions, worker/agent/model.js), so
# nothing needs installing, and it needs two secrets, which never go in this file:
#
#     npx wrangler secret put ROXAN_INVITE    -c wrangler.roxan.toml --env production   (invite codes, comma-separated; one code is one person's account)
#     npx wrangler secret put ROXAN_MODEL_KEY -c wrangler.roxan.toml --env production   (the model service's API key)
#
# One more secret is optional. With it Roxan can use a cloud computer (worker/agent/box.js: a
# throwaway Linux machine with internet access, rented from a code-sandbox service, one per task,
# killed when the task ends). Without it the tool is simply not offered, and Access hides its row:
#
#     npx wrangler secret put E2B_API_KEY     -c wrangler.roxan.toml --env production   (the sandbox service's API key)
#
# Until both are set /api/health says "closed" and /chat says so. Locally, put
# them in .dev.vars beside this file (git-ignored); worker/test/fake-provider.js
# stands in for the model service so nothing is spent. It also stands in for the sandbox
# service when E2B_URL points at it; nothing is ever run.
# ===========================================================================
name = "oplo-roxan"
main = "worker/roxan.js"
compatibility_date = "2026-05-01"
workers_dev = true

[assets]
directory = "./roxan"
binding = "ASSETS"
# roxan/404.html answers any path that is not a file, with a real 404 status.
not_found_handling = "404-page"

# Not secret: which model answers. Change it here and redeploy.
[vars]
ROXAN_MODEL = "mercury-3"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "Agent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Agent"]

# --------------------------------------------------------------- Production
[env.production]
name = "oplo-roxan"
main = "worker/roxan.js"

[env.production.assets]
directory = "./roxan"
binding = "ASSETS"
not_found_handling = "404-page"

[env.production.vars]
ROXAN_MODEL = "mercury-3"

[[env.production.durable_objects.bindings]]
name = "AGENT"
class_name = "Agent"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["Agent"]

[[env.production.routes]]
pattern = "roxan.oplocloud.com"
custom_domain = true

# The old address on the apex, which GitHub Pages would otherwise keep serving
# as a second, stale copy. Two patterns rather than `/roxan*`, which would
# also catch any future page whose name merely starts with "roxan".
[[env.production.routes]]
pattern = "oplocloud.com/roxan"
zone_name = "oplocloud.com"

[[env.production.routes]]
pattern = "oplocloud.com/roxan/*"
zone_name = "oplocloud.com"
