<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A graph after Masahiro Mori. Across: how human something looks. Up: how comfortable people feel about it. The line rises from an industrial robot, through a toy robot, to a cartoon hero, then drops sharply into a shaded valley where an almost-real digital human sits, before climbing steeply to a real person at the far right.</title>
<rect width="700" height="420" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">The uncanny valley</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">The more human a face looks, the more we like it — until it is almost, but not quite, real.</text><rect x="528.8" y="74" width="98" height="300" fill="#fdecee"/><text x="577.8" y="368" font-size="15" font-weight="700" fill="#d70015" text-anchor="middle">the valley</text><line x1="92" y1="74" x2="92" y2="374" stroke="#6e6e73" stroke-width="1.5"/><line x1="92" y1="230" x2="668" y2="230" stroke="#6e6e73" stroke-width="1.5"/><text x="84" y="104" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="end">+</text><text x="84" y="362" font-size="22" font-weight="400" fill="#6e6e73" text-anchor="end">−</text><g transform="translate(40 226) rotate(-90)"><text x="0" y="0" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="middle">How people feel about it</text></g><text x="90" y="72" font-size="1" fill="#6e6e73"></text><text x="668" y="398" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">How human it looks →</text><text x="96" y="398" font-size="14" fill="#6e6e73" text-anchor="start">not at all</text><path d="M92 227.4 C110.7 224.7 166.7 217.7 204 211.5 C241.3 205.4 280.5 198.8 316 190.4 C351.5 182 390.7 168 416.8 161.4 C442.9 154.8 456 146.8 472.8 150.8 C489.6 154.8 503.6 162.7 517.6 185.1 C531.6 207.6 545.6 261.7 556.8 285.4 C568 309.2 575.5 325.9 584.8 327.7 C594.1 329.4 604.4 318.9 612.8 296 C621.2 273.1 628.7 223.4 635.2 190.4 C641.7 157.4 649.2 113.4 652 98" fill="none" stroke="#2a78d6" stroke-width="3.5"/><circle cx="103.2" cy="225.8" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="113.2" y="251.8" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="start">industrial robot</text><circle cx="316" cy="190.4" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="306" y="176.4" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">toy robot</text><circle cx="461.6" cy="152.9" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="453.6" y="136.9" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">cartoon hero</text><circle cx="584.8" cy="327.7" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="570.8" y="349.7" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">almost-real digital human</text><circle cx="652" cy="98" r="6.5" fill="#ffffff" stroke="#2a78d6" stroke-width="3"/><text x="640" y="102" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">a real person</text>
</svg>
