<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four steps drawn as a staircase rising to the right. 1, Describe: what do I see and hear? Start with I notice. 2, Analyze: how is it put together? The artist uses this to do that. 3, Interpret: what does it mean? I think it is about this, because. 4, Judge: does it work, and why? It works because, or it would be stronger if. An arrow underneath runs from facts first to opinion last.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86868b"/></marker></defs>
<rect width="700" height="460" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Four steps to a fair critique</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Go in order. Save your opinion for the last step.</text><rect x="24" y="262" width="158" height="138" rx="10" fill="#eaf2fc"/><circle cx="44" cy="186" r="13" fill="#2a78d6"/><text x="44" y="191" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="64" y="192" font-size="18" font-weight="700" fill="#1d1d1f">Describe</text><text x="28" y="218" font-size="15" font-weight="600" fill="#2a78d6">What do I see and</text><text x="28" y="237.5" font-size="15" font-weight="600" fill="#2a78d6">hear?</text><text x="38" y="290" font-size="15" font-style="italic" fill="#1d1d1f">“I notice …”</text><rect x="190" y="218" width="158" height="182" rx="10" fill="#d6e6f9"/><circle cx="210" cy="142" r="13" fill="#2a78d6"/><text x="210" y="147" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="230" y="148" font-size="18" font-weight="700" fill="#1d1d1f">Analyze</text><text x="194" y="174" font-size="15" font-weight="600" fill="#2a78d6">How is it put</text><text x="194" y="193.5" font-size="15" font-weight="600" fill="#2a78d6">together?</text><text x="204" y="246" font-size="15" font-style="italic" fill="#1d1d1f">“The artist uses …</text><text x="204" y="265.5" font-size="15" font-style="italic" fill="#1d1d1f">to …”</text><rect x="356" y="174" width="158" height="226" rx="10" fill="#bcd5f4"/><circle cx="376" cy="98" r="13" fill="#2a78d6"/><text x="376" y="103" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="396" y="104" font-size="18" font-weight="700" fill="#1d1d1f">Interpret</text><text x="360" y="130" font-size="15" font-weight="600" fill="#2a78d6">What does it mean?</text><text x="370" y="202" font-size="15" font-style="italic" fill="#1d1d1f">“I think it is</text><text x="370" y="221.5" font-size="15" font-style="italic" fill="#1d1d1f">about … because …”</text><rect x="522" y="130" width="158" height="270" rx="10" fill="#9cc0ea"/><circle cx="542" cy="54" r="13" fill="#2a78d6"/><text x="542" y="59" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="562" y="60" font-size="18" font-weight="700" fill="#1d1d1f">Judge</text><text x="526" y="86" font-size="15" font-weight="600" fill="#2a78d6">Does it work? Why?</text><text x="536" y="158" font-size="15" font-style="italic" fill="#1d1d1f">“It works because</text><text x="536" y="177.5" font-size="15" font-style="italic" fill="#1d1d1f">…” or “It would be</text><text x="536" y="197" font-size="15" font-style="italic" fill="#1d1d1f">stronger if …”</text><path d="M40 422 L650 422" fill="none" stroke="#86868b" stroke-width="1.5" marker-end="url(#a)"/><text x="40" y="444" font-size="14.5" font-weight="600" fill="#6e6e73">facts first</text><text x="650" y="444" font-size="14.5" font-weight="600" fill="#6e6e73" text-anchor="end">opinion last</text>
</svg>
