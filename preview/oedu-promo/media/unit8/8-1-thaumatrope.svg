<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 368" width="700" height="368" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A thaumatrope. The front of a round card shows a bird. The back shows a birdcage drawn upside down. Strings are tied to both sides. Twirled quickly, the card flips over and over, and the two pictures blend: the bird appears to sit inside the cage.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>
<rect width="700" height="368" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">A thaumatrope: two pictures, one image</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">A card with strings at both sides. Twirl the strings and the card flips over and over.</text><line x1="28" y1="170" x2="36" y2="170" stroke="#86868b" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="200" y1="170" x2="208" y2="170" stroke="#86868b" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="118" cy="170" r="80" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><g transform="translate(118 176)"><path d="M24 4 L42 -4 L40 12 Z" fill="#d99a00" stroke="#1d1d1f" stroke-width="1.5"/><ellipse cx="4" cy="6" rx="23" ry="15" fill="#f5b300" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="-16" cy="-10" r="11" fill="#f5b300" stroke="#1d1d1f" stroke-width="1.5"/><path d="M-26 -12 L-37 -8 L-26 -5 Z" fill="#eb6834" stroke="#1d1d1f" stroke-width="1.2"/><circle cx="-18" cy="-12" r="2" fill="#1d1d1f"/><path d="M-4 2 Q10 -8 22 3 Q10 12 -4 2 Z" fill="#d99a00" stroke="#1d1d1f" stroke-width="1.2"/><line x1="-2" y1="20" x2="-2" y2="30" stroke="#1d1d1f" stroke-width="2"/><line x1="8" y1="20" x2="8" y2="30" stroke="#1d1d1f" stroke-width="2"/></g><line x1="258" y1="170" x2="266" y2="170" stroke="#86868b" stroke-width="1.6" stroke-dasharray="3 3"/><line x1="430" y1="170" x2="438" y2="170" stroke="#86868b" stroke-width="1.6" stroke-dasharray="3 3"/><circle cx="348" cy="170" r="80" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><g transform="translate(348 176) scale(1 -1)"><path d="M-40 38 L-40 -18 Q-40 -54 0 -54 Q40 -54 40 -18 L40 38" fill="none" stroke="#6e6e73" stroke-width="2.6"/><line x1="-24" y1="-37.2" x2="-24" y2="38" stroke="#6e6e73" stroke-width="2.2"/><line x1="-8" y1="-46.8" x2="-8" y2="38" stroke="#6e6e73" stroke-width="2.2"/><line x1="8" y1="-46.8" x2="8" y2="38" stroke="#6e6e73" stroke-width="2.2"/><line x1="24" y1="-37.2" x2="24" y2="38" stroke="#6e6e73" stroke-width="2.2"/><line x1="-40" y1="30" x2=