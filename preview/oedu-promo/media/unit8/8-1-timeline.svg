<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 580" width="700" height="580" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A timeline of moving pictures in two columns. Before film: a painted goblet from Iran about 5,000 years old with five pictures of a leaping goat; the magic lantern, 1659; the thaumatrope, 1825; the phenakistiscope, 1833; the zoetrope, 1834, sold as a toy from 1866; the flip book, 1868; the praxinoscope, 1877. On film and computers: Humorous Phases of Funny Faces, 1906; Fantasmagorie, 1908; Gertie the Dinosaur, 1914; Steamboat Willie, 1928; Snow White, 1937, the first American animated feature; Neighbours, 1952, made by pixilation; Toy Story, 1995, the first feature made entirely by computer.</title>
<rect width="700" height="580" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Pictures that move, before film and after</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Every one of these shows still pictures quickly, one after another.</text><text x="24" y="98" font-size="13.5" font-weight="700" fill="#2a78d6" letter-spacing="0.6">BEFORE FILM: TOYS AND PROJECTORS</text><line x1="30" y1="124" x2="30" y2="520" stroke="#2a78d6" stroke-width="2" stroke-opacity="0.35"/><circle cx="30" cy="123" r="6" fill="#2a78d6"/><text x="46" y="128" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">~5,000 years ago</tspan><tspan dx="7" font-weight="600">Painted goblet</tspan></text><text x="46" y="148" font-size="14.5" fill="#6e6e73">Five pictures of a leaping goat,</text><text x="46" y="166.9" font-size="14.5" fill="#6e6e73">painted round a cup found in Iran.</text><circle cx="30" cy="187" r="6" fill="#2a78d6"/><text x="46" y="192" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1659</tspan><tspan dx="7" font-weight="600">Magic lantern</tspan></text><text x="46" y="212" font-size="14.5" fill="#6e6e73">Throws pictures painted on glass onto</text><text x="46" y="230.9" font-size="14.5" fill="#6e6e73">a wall, using a lamp and a lens.</text><circle cx="30" cy="251" r="6" fill="#2a78d6"/><text x="46" y="256" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1825</tspan><tspan dx="7" font-weight="600">Thaumatrope</tspan></text><text x="46" y="276" font-size="14.5" fill="#6e6e73">Two pictures on a spinning card blend</text><text x="46" y="294.9" font-size="14.5" fill="#6e6e73">into one.</text><circle cx="30" cy="315" r="6" fill="#2a78d6"/><text x="46" y="320" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1833</tspan><tspan dx="7" font-weight="600">Phenakistiscope</tspan></text><text x="46" y="340" font-size="14.5" fill="#6e6e73">A spinning disc of drawings, watched</text><text x="46" y="358.9" font-size="14.5" fill="#6e6e73">through its slots in a mirror.</text><circle cx="30" cy="379" r="6" fill="#2a78d6"/><text x="46" y="384" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1834</tspan><tspan dx="7" font-weight="600">Zoetrope</tspan></text><text x="46" y="404" font-size="14.5" fill="#6e6e73">A spinning drum with a strip of</text><text x="46" y="422.9" font-size="14.5" fill="#6e6e73">drawings. A toy from 1866.</text><circle cx="30" cy="443" r="6" fill="#2a78d6"/><text x="46" y="448" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1868</tspan><tspan dx="7" font-weight="600">Flip book</tspan></text><text x="46" y="468" font-size="14.5" fill="#6e6e73">Pages of drawings flicked past the</text><text x="46" y="486.9" font-size="14.5" fill="#6e6e73">thumb.</text><circle cx="30" cy="507" r="6" fill="#2a78d6"/><text x="46" y="512" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#2a78d6">1877</tspan><tspan dx="7" font-weight="600">Praxinoscope</tspan></text><text x="46" y="532" font-size="14.5" fill="#6e6e73">Mirrors in the middle instead of</text><text x="46" y="550.9" font-size="14.5" fill="#6e6e73">slots: a brighter, steadier picture.</text><text x="362" y="98" font-size="13.5" font-weight="700" fill="#eb6834" letter-spacing="0.6">ON FILM, THEN ON COMPUTERS</text><line x1="368" y1="124" x2="368" y2="520" stroke="#eb6834" stroke-width="2" stroke-opacity="0.35"/><circle cx="368" cy="123" r="6" fill="#eb6834"/><text x="384" y="128" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1906</tspan><tspan dx="7" font-weight="600">Humorous Phases of Funny Faces</tspan></text><text x="384" y="148" font-size="14.5" fill="#6e6e73">Chalk drawings that move, on film.</text><circle cx="368" cy="187" r="6" fill="#eb6834"/><text x="384" y="192" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1908</tspan><tspan dx="7" font-weight="600">Fantasmagorie</tspan></text><text x="384" y="212" font-size="14.5" fill="#6e6e73">Émile Cohl's film, made entirely of</text><text x="384" y="230.9" font-size="14.5" fill="#6e6e73">drawings.</text><circle cx="368" cy="251" r="6" fill="#eb6834"/><text x="384" y="256" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1914</tspan><tspan dx="7" font-weight="600">Gertie the Dinosaur</tspan></text><text x="384" y="276" font-size="14.5" fill="#6e6e73">Thousands of drawings give a dinosaur</text><text x="384" y="294.9" font-size="14.5" fill="#6e6e73">a personality.</text><circle cx="368" cy="315" r="6" fill="#eb6834"/><text x="384" y="320" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1928</tspan><tspan dx="7" font-weight="600">Steamboat Willie</tspan></text><text x="384" y="340" font-size="14.5" fill="#6e6e73">A Mickey Mouse hit with sound timed to</text><text x="384" y="358.9" font-size="14.5" fill="#6e6e73">the action.</text><circle cx="368" cy="379" r="6" fill="#eb6834"/><text x="384" y="384" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1937</tspan><tspan dx="7" font-weight="600">Snow White</tspan></text><text x="384" y="404" font-size="14.5" fill="#6e6e73">The first feature-length animated film</text><text x="384" y="422.9" font-size="14.5" fill="#6e6e73">made in America.</text><circle cx="368" cy="443" r="6" fill="#eb6834"/><text x="384" y="448" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1952</tspan><tspan dx="7" font-weight="600">Neighbours</tspan></text><text x="384" y="468" font-size="14.5" fill="#6e6e73">Real actors posed frame by frame:</text><text x="384" y="486.9" font-size="14.5" fill="#6e6e73">pixilation.</text><circle cx="368" cy="507" r="6" fill="#eb6834"/><text x="384" y="512" font-size="16" fill="#1d1d1f"><tspan font-weight="700" fill="#eb6834">1995</tspan><tspan dx="7" font-weight="600">Toy Story</tspan></text><text x="384" y="532" font-size="14.5" fill="#6e6e73">The first feature film made entirely</text><text x="384" y="550.9" font-size="14.5" fill="#6e6e73">by computer.</text>
</svg>
