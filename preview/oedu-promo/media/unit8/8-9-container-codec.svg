<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A video file drawn as a box labelled clip.mp4, the container. Inside are three tracks: video, squeezed with the H.264 codec; audio, squeezed with the AAC codec; and extras such as the title, date and captions. Beside it, common containers: .mp4, .mov, .avi, .wmv, .webm and .mkv. Common video codecs: H.264, H.265, AV1 and ProRes. Two .mp4 files can hold video squeezed in different ways, and a player that refuses a file is often refusing the codec inside.</title>
<rect width="700" height="470" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">A video file is a box with things packed inside</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">The box is the container. How the video inside was squeezed is the codec.</text><rect x="24" y="88" width="410" height="300" rx="14" fill="#fbf6ee" stroke="#b98b4f" stroke-width="2.5"/><rect x="24" y="88" width="170" height="36" rx="14" fill="#b98b4f"/><rect x="24" y="106" width="170" height="18" fill="#b98b4f"/><text x="40" y="112" font-size="17" font-weight="700" fill="#ffffff">clip.mp4</text><text x="420" y="114" font-size="15" font-weight="700" fill="#8a6333" text-anchor="end">the container</text><rect x="44" y="144" width="370" height="60" rx="10" fill="#ffffff" stroke="#2a78d6" stroke-width="1.8"/><text x="60" y="169" font-size="16" font-weight="700" fill="#2a78d6">Video</text><text x="60" y="190" font-size="14.5" font-weight="600" fill="#6e6e73">codec: H.264</text><rect x="214" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="227" cy="178" r="5" fill="#eb6834"/><rect x="246" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="259" cy="175.5" r="5" fill="#eb6834"/><rect x="278" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="291" cy="173" r="5" fill="#eb6834"/><rect x="310" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="323" cy="170.5" r="5" fill="#eb6834"/><rect x="342" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="355" cy="168" r="5" fill="#eb6834"/><rect x="374" y="156" width="26" height="36" rx="2" fill="#cfe3f7" stroke="#2a78d6" stroke-width="1"/><circle cx="387" cy="165.5" r="5" fill="#eb6834"/><rect x="44" y="222" width="370" height="60" rx="10" fill="#ffffff" stroke="#12915a" stroke-width="1.8"/><text x="60" y="247" font-size="16" font-weight="700" fill="#12915a">Audio</text><text x="60" y="268" font-size="14.5" font-weight="600" fill="#6e6e73">codec: AAC</text><path d="M214 252 L214 246 L216 258 L218 238 L220 266 L222 232 L224 272 L226 242 L228 262 L230 248 L232 256 L234 236 L236 268 L238 230 L240 274 L242 244 L244 260 L246 240 L248 264 L250 249 L252 255 L254 246 L256 258 L258 238 L260 266 L262 232 L264 272 L266 242 L268 262 L270 248 L272 256 L274 236 L276 268 L278 230 L280 274 L282 244 L284 260 L286 240 L288 264 L290 249 L292 255 L294 246 L296 258 L298 238 L300 266 L302 232 L304 272 L306 242 L308 262 L310 248 L312 256 L314 236 L316 268 L318 230 L320 274 L322 244 L324 260 L326 240 L328 264 L330 249 L332 255 L334 246 L336 258 L338 238 L340 266 L342 232 L344 272 L346 242 L348 262 L350 248 L352 256 L354 236 L356 268 L358 230 L360 274 L362 244 L364 260 L366 240 L368 264 L370 249 L372 255 L374 246 L376 258 L378 238 L380 266 L382 232 L384 272 L386 242 L388 262 L390 248 L392 256 L394 236 L396 268" fill="none" stroke="#12915a" stroke-width="1.4"/><rect x="44" y="300" width="370" height="60" rx="10" fill="#ffffff" stroke="#8f5cff" stroke-width="1.8"/><text x="60" y="325" font-size="16" font-weight="700" fill="#8f5cff">Extras</text><text x="60" y="346" font-size="14.5" font-weight="600" fill="#6e6e73">title, date, captions</text><rect x="214" y="314" width="160" height="6" rx="3" fill="#d9cdf7"/><rect x="214" y="326" width="120" height="6" rx="3" fill="#d9cdf7"/><rect x="214" y="338" width="140" height="6" rx="3" fill="#d9cdf7"/><text x="464" y="108" font-size="17" font-weight="700" fill="#1d1d1f">Containers</text><text x="464" y="128" font-size="14.5" fill="#6e6e73" text-anchor="start">the box</text><rect x="464" y="146" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="495" y="166" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.mp4</text><rect x="536" y="146" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="567" y="166" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.mov</text><rect x="608" y="146" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="639" y="166" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.avi</text><rect x="464" y="186" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="495" y="206" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.wmv</text><rect x="536" y="186" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="567" y="206" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.webm</text><rect x="608" y="186" width="62" height="30" rx="8" fill="#fbf6ee" stroke="#b98b4f" stroke-width="1.5"/><text x="639" y="206" font-size="15" font-weight="700" fill="#8a6333" text-anchor="middle">.mkv</text><text x="464" y="262" font-size="17" font-weight="700" fill="#1d1d1f">Video codecs</text><text x="464" y="282" font-size="14.5" fill="#6e6e73">how the picture is squeezed</text><rect x="464" y="300" width="94" height="30" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="511" y="320" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">H.264</text><rect x="568" y="300" width="94" height="30" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="615" y="320" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">H.265</text><rect x="464" y="340" width="94" height="30" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="511" y="360" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">AV1</text><rect x="568" y="340" width="94" height="30" rx="8" fill="#eaf2fc" stroke="#2a78d6" stroke-width="1.5"/><text x="615" y="360" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">ProRes</text><text x="24" y="424" font-size="15" fill="#1d1d1f">Two .mp4 files can hold video squeezed in different ways. If a site or player refuses</text><text x="24" y="443.5" font-size="15" fill="#1d1d1f">a file, the codec inside is often the reason, not the name on the box.</text>
</svg>
