<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 530" width="700" height="530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Three families of animation. Drawn, or 2D: each frame is drawn — traditional animation draws every frame by hand, limited animation reuses drawings and redraws only what moves, and 2D digital animation is drawn straight into a computer. Stop motion: each frame is photographed — puppets and objects moved a little between photos, clay figures over a wire skeleton, or real people posed frame by frame, called pixilation. Computer, or 3D: each frame is rendered — the steps are model the shape, texture its surface, rig it with a skeleton, then animate and render.</title>
<rect width="700" height="530" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Three families of animation</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">All of them make frames. What changes is how each frame is made.</text><rect x="24" y="84" width="206" height="426" rx="16" fill="#eaf2fc"/><rect x="93" y="100" width="60" height="76" rx="4" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><circle cx="123" cy="130" r="14" fill="none" stroke="#2a78d6" stroke-width="2.2"/><circle cx="118" cy="127" r="1.8" fill="#2a78d6"/><circle cx="128" cy="127" r="1.8" fill="#2a78d6"/><path d="M118 135 q5 5 10 0" fill="none" stroke="#2a78d6" stroke-width="1.8"/><line x1="107" y1="156" x2="139" y2="156" stroke="#d2d2d7" stroke-width="2"/><line x1="107" y1="164" x2="131" y2="164" stroke="#d2d2d7" stroke-width="2"/><g transform="translate(157 136) rotate(35)"><rect x="-4" y="-30" width="8" height="44" fill="#f5b300" stroke="#1d1d1f" stroke-width="1.2"/><path d="M-4 14 L0 24 L4 14 Z" fill="#f1c7a5" stroke="#1d1d1f" stroke-width="1.2"/></g><text x="42" y="214" font-size="19" font-weight="700" fill="#1d1d1f">Drawn (2D)</text><text x="42" y="236" font-size="15" font-weight="600" fill="#2a78d6">Each frame is drawn</text><text x="42" y="272" font-size="15.5" font-weight="650" fill="#1d1d1f">Traditional</text><text x="42" y="292" font-size="14.5" fill="#6e6e73">Every frame drawn by</text><text x="42" y="310.9" font-size="14.5" fill="#6e6e73">hand</text><text x="42" y="344.9" font-size="15.5" font-weight="650" fill="#1d1d1f">Limited</text><text x="42" y="364.9" font-size="14.5" fill="#6e6e73">Reuses drawings;</text><text x="42" y="383.8" font-size="14.5" fill="#6e6e73">redraws only what moves</text><text x="42" y="417.8" font-size="15.5" font-weight="650" fill="#1d1d1f">2D digital</text><text x="42" y="437.8" font-size="14.5" fill="#6e6e73">Drawn straight into a</text><text x="42" y="456.7" font-size="14.5" fill="#6e6e73">computer</text><rect x="250" y="84" width="206" height="426" rx="16" fill="#fdeee7"/><line x1="313" y1="174" x2="323" y2="136" stroke="#6e6e73" stroke-width="2"/><line x1="333" y1="174" x2="323" y2="136" stroke="#6e6e73" stroke-width="2"/><rect x="307" y="118" width="30" height="20" rx="3" fill="#1d1d1f"/><path d="M337 125 l12 -6 v20 l-12 -6 z" fill="#1d1d1f"/><line x1="351" y1="174" x2="405" y2="174" stroke="#6e6e73" stroke-width="2"/><circle cx="381" cy="134" r="8" fill="#eb6834"/><line x1="381" y1="142" x2="381" y2="158" stroke="#eb6834" stroke-width="4"/><line x1="381" y1="148" x2="393" y2="140" stroke="#eb6834" stroke-width="3.5"/><line x1="381" y1="148" x2="370" y2="154" stroke="#eb6834" stroke-width="3.5"/><line x1="381" y1="158" x2="373" y2="173" stroke="#eb6834" stroke-width="3.5"/><line x1="381" y1="158" x2="389" y2="173" stroke="#eb6834" stroke-width="3.5"/><path d="M341 122 l10 -3 M341 128 l10 0 M341 134 l10 3" fill="none" stroke="#eb6834" stroke-width="1.2"/><text x="268" y="214" font-size="19" font-weight="700" fill="#1d1d1f">Stop motion</text><text x="268" y="236" font-size="15" font-weight="600" fill="#eb6834">Each frame is photographed</text><text x="268" y="272" font-size="15.5" font-weight="650" fill="#1d1d1f">Puppets and objects</text><text x="268" y="292" font-size="14.5" fill="#6e6e73">Moved a tiny bit</text><text x="268" y="310.9" font-size="14.5" fill="#6e6e73">between photos</text><text x="268" y="344.9" font-size="15.5" font-weight="650" fill="#1d1d1f">Clay</text><text x="268" y="364.9" font-size="14.5" fill="#6e6e73">Clay figures over a</text><text x="268" y="383.8" font-size="14.5" fill="#6e6e73">wire skeleton</text><text x="268" y="417.8" font-size="15.5" font-weight="650" fill="#1d1d1f">Pixilation</text><text x="268" y="437.8" font-size="14.5" fill="#6e6e73">Real people, posed</text><text x="268" y="456.7" font-size="14.5" fill="#6e6e73">frame by frame</text><rect x="476" y="84" width="206" height="426" rx="16" fill="#e7f5ee"/><path d="M579 104 L612.0 120 L579 136 L546.0 120 Z" fill="#e7f5ee" stroke="#12915a" stroke-width="2"/><path d="M546.0 120 L579 136 L579 174 L546.0 158 Z" fill="#cfeadc" stroke="#12915a" stroke-width="2"/><path d="M579 136 L612.0 120 L612.0 158 L579 174 Z" fill="#b5dfc9" stroke="#12915a" stroke-width="2"/><line x1="546" y1="120" x2="612" y2="120" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><line x1="579" y1="104" x2="579" y2="136" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><line x1="546" y1="139" x2="579" y2="155" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><line x1="579" y1="155" x2="612" y2="139" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><line x1="562.5" y1="128" x2="562.5" y2="166" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><line x1="595.5" y1="128" x2="595.5" y2="166" stroke="#12915a" stroke-width="1" stroke-opacity=".5"/><text x="494" y="214" font-size="19" font-weight="700" fill="#1d1d1f">Computer (3D)</text><text x="494" y="236" font-size="15" font-weight="600" fill="#12915a">Each frame is rendered</text><text x="494" y="272" font-size="15.5" font-weight="650" fill="#1d1d1f">Model</text><text x="494" y="292" font-size="14.5" fill="#6e6e73">Build the shape</text><text x="494" y="326" font-size="15.5" font-weight="650" fill="#1d1d1f">Texture</text><text x="494" y="346" font-size="14.5" fill="#6e6e73">Paint its surface</text><text x="494" y="380" font-size="15.5" font-weight="650" fill="#1d1d1f">Rig</text><text x="494" y="400" font-size="14.5" fill="#6e6e73">Give it a skeleton</text><text x="494" y="434" font-size="15.5" font-weight="650" fill="#1d1d1f">Animate and render</text><text x="494" y="454" font-size="14.5" fill="#6e6e73">Pose it, then let the</text><text x="494" y="472.9" font-size="14.5" fill="#6e6e73">computer draw each</text><text x="494" y="491.8" font-size="14.5" fill="#6e6e73">frame</text>
</svg>
