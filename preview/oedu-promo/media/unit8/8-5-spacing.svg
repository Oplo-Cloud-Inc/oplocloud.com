<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Two rows, each with nine drawings of a ball travelling the same distance. Even spacing: the balls are equally far apart, so the movement starts and stops at full speed and looks mechanical. Slow in and slow out: the balls are bunched close together at the start and the end and spread wide in the middle, so the movement speeds up and then slows down, which looks natural.</title>
<rect width="700" height="420" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Spacing: where the drawings fall</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Nine drawings, same start, same finish. Only the gaps between them change.</text><text x="24" y="112" font-size="18" font-weight="700" fill="#1d1d1f">Even spacing</text><text x="24" y="134" font-size="15" fill="#6e6e73">Starts and stops at full speed. Looks mechanical.</text><line x1="48" y1="182" x2="652" y2="182" stroke="#d2d2d7" stroke-width="2"/><circle cx="60" cy="182" r="12" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><text x="60" y="218" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">1</text><circle cx="132.5" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="132.5" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">2</text><circle cx="205" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="205" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">3</text><circle cx="277.5" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="277.5" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">4</text><circle cx="350" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="350" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">5</text><circle cx="422.5" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="422.5" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">6</text><circle cx="495" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="495" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">7</text><circle cx="567.5" cy="182" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="567.5" y="218" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">8</text><circle cx="640" cy="182" r="12" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><text x="640" y="218" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">9</text><text x="24" y="264" font-size="18" font-weight="700" fill="#2a78d6">Slow in and slow out</text><text x="24" y="286" font-size="15" fill="#6e6e73">Speeds up, then slows down. Looks natural.</text><line x1="48" y1="334" x2="652" y2="334" stroke="#d2d2d7" stroke-width="2"/><circle cx="60" cy="334" r="12" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><text x="60" y="370" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">1</text><circle cx="82.1" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="82.1" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">2</text><circle cx="144.9" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="144.9" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">3</text><circle cx="239" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="239" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">4</text><circle cx="350" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="350" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">5</text><circle cx="461" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="461" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">6</text><circle cx="555.1" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="555.1" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">7</text><circle cx="617.9" cy="334" r="9" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="617.9" y="370" font-size="14" font-weight="400" fill="#86868b" text-anchor="middle">8</text><circle cx="640" cy="334" r="12" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><text x="640" y="370" font-size="14" font-weight="700" fill="#1d1d1f" text-anchor="middle">9</text><text x="60" y="400" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">slow</text><text x="350" y="400" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">fast in the middle</text><text x="640" y="400" font-size="14.5" font-weight="600" fill="#2a78d6" text-anchor="middle">slow</text>
</svg>
