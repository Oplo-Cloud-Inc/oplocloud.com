<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 560" width="700" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Four slides. Wrong: a wall of text, a slide covered in lines of small writing. Right: one idea, one picture, a bouncing ball beside three large words, Timing sells the bounce. Wrong: low contrast, orange writing on a yellow background, a contrast ratio of 1.6 to 1. Right: strong contrast, near-black writing on white, a ratio of 16.8 to 1. Web guidelines ask for at least 4.5 to 1 for ordinary text and 3 to 1 for large text.</title>
<rect width="700" height="560" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Slides that help, and slides that get in the way</text><path d="M25 63 L37 75 M37 63 L25 75" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><text x="50" y="74" font-size="16" font-weight="700" fill="#d70015">A wall of text</text><rect x="24" y="88" width="300" height="169" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><rect x="42" y="104" width="150" height="12" rx="3" fill="#1d1d1f"/><rect x="42" y="128" width="250" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="140" width="240" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="152" width="262" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="164" width="230" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="176" width="256" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="188" width="120" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="200" width="248" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="212" width="236" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="224" width="260" height="5" rx="2" fill="#b8b8bd"/><rect x="42" y="236" width="170" height="5" rx="2" fill="#b8b8bd"/><path d="M377 69 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="402" y="74" font-size="16" font-weight="700" fill="#12915a">One idea, one picture</text><rect x="376" y="88" width="300" height="169" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><rect x="392" y="104" width="150" height="137" rx="4" fill="#eef5fc"/><line x1="402" y1="208" x2="532" y2="208" stroke="#86868b" stroke-width="1.5"/><ellipse cx="416" cy="138" rx="7" ry="11" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.2"/><ellipse cx="440" cy="182" rx="6" ry="13" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.2"/><ellipse cx="467" cy="202" rx="13" ry="5" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.2"/><ellipse cx="494" cy="182" rx="6" ry="13" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.2"/><ellipse cx="518" cy="144" rx="8" ry="8" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.2"/><text x="556" y="160" font-size="22" font-weight="700" fill="#1d1d1f">Timing</text><text x="556" y="186" font-size="22" font-weight="700" fill="#1d1d1f">sells the</text><text x="556" y="212" font-size="22" font-weight="700" fill="#2a78d6">bounce</text><path d="M25 305 L37 317 M37 305 L25 317" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><text x="50" y="316" font-size="16" font-weight="700" fill="#d70015">Low contrast</text><text x="324" y="316" font-size="14.5" font-weight="600" fill="#6e6e73" text-anchor="end">1.6 : 1</text><rect x="24" y="330" width="300" height="169" rx="6" fill="#ffe066"/><text x="48" y="400" font-size="30" font-weight="700" fill="#f59e2e">Our findings</text><text x="48" y="436" font-size="19" font-weight="600" fill="#f59e2e">The villain has the</text><text x="48" y="462" font-size="19" font-weight="600" fill="#f59e2e">most appeal.</text><path d="M377 311 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="402" y="316" font-size="16" font-weight="700" fill="#12915a">Strong contrast</text><text x="676" y="316" font-size="14.5" font-weight="600" fill="#6e6e73" text-anchor="end">16.8 : 1</text><rect x="376" y="330" width="300" height="169" rx="6" fill="#ffffff" stroke="#d2d2d7" stroke-width="1.5"/><rect x="376" y="330" width="8" height="169" rx="3" fill="#2a78d6"/><text x="400" y="400" font-size="30" font-weight="700" fill="#1d1d1f">Our findings</text><text x="400" y="436" font-size="19" font-weight="600" fill="#1d1d1f">The villain has the</text><text x="400" y="462" font-size="19" font-weight="600" fill="#2a78d6">most appeal.</text><text x="24" y="530" font-size="14.5" fill="#6e6e73">Contrast is measured as a ratio. Web guidelines ask for at least 4.5 : 1 for ordinary</text><text x="24" y="548.9" font-size="14.5" fill="#6e6e73">text, and 3 : 1 for large text.</text>
</svg>
