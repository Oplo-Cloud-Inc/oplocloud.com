<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" width="700" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Five steps in making a 3D character, each showing the same simple figure. 1, Model: its shape as a wire mesh. 2, Texture: a striped picture wrapped round its surface. 3, Rig: a skeleton of bones and joints inside it. 4, Animate: the skeleton posed with an arm raised and the head tilted, with key frames on a timeline. 5, Render: the finished figure with shading and a shadow.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#86868b"/></marker><pattern id="st" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><rect width="8" height="8" fill="#c7b3ff"/><rect width="4" height="8" fill="#8f5cff"/></pattern><radialGradient id="sh" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#bfe8d2"/><stop offset="1" stop-color="#0e6b43"/></radialGradient></defs>
<rect width="700" height="330" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Making a 3D character, step by step</text><rect x="24" y="56" width="116" height="150" rx="12" fill="#f5f5f7"/><ellipse cx="76" cy="148" rx="22" ry="32" fill="none" stroke="#2a78d6" stroke-width="1.6"/><g transform="translate(76 102) rotate(0)"><circle cx="0" cy="0" r="15" fill="none" stroke="#2a78d6" stroke-width="1.6"/></g><line x1="94" y1="134" x2="116" y2="134" stroke="#2a78d6" stroke-width="7" stroke-linecap="round"/><ellipse cx="76" cy="122" rx="12.8" ry="3.5" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="136" rx="20.4" ry="3.5" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="150" rx="22" ry="3.5" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="164" rx="19.1" ry="3.5" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="148" rx="9" ry="32" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="102" rx="15" ry="5" fill="none" stroke="#2a78d6" stroke-width="1"/><ellipse cx="76" cy="102" rx="6" ry="15" fill="none" stroke="#2a78d6" stroke-width="1"/><path d="M142 131 l10 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><text x="26" y="234" font-size="17" font-weight="700" fill="#2a78d6">1  Model</text><text x="26" y="256" font-size="14.5" fill="#6e6e73">Build the</text><text x="26" y="274.9" font-size="14.5" fill="#6e6e73">shape out of</text><text x="26" y="293.8" font-size="14.5" fill="#6e6e73">many flat</text><text x="26" y="312.7" font-size="14.5" fill="#6e6e73">faces</text><rect x="160" y="56" width="116" height="150" rx="12" fill="#f5f5f7"/><ellipse cx="212" cy="148" rx="22" ry="32" fill="url(#st)" stroke="#8f5cff" stroke-width="1.2"/><g transform="translate(212 102) rotate(0)"><circle cx="0" cy="0" r="15" fill="url(#st)" stroke="#8f5cff" stroke-width="1.2"/></g><line x1="230" y1="134" x2="252" y2="134" stroke="#8f5cff" stroke-width="7" stroke-linecap="round"/><circle cx="212" cy="102" r="15" fill="#f1c7a5" stroke="#8f5cff" stroke-width="1.2"/><circle cx="207" cy="100" r="1.8" fill="#1d1d1f"/><circle cx="217" cy="100" r="1.8" fill="#1d1d1f"/><path d="M278 131 l10 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><text x="162" y="234" font-size="17" font-weight="700" fill="#8f5cff">2  Texture</text><text x="162" y="256" font-size="14.5" fill="#6e6e73">Wrap a picture</text><text x="162" y="274.9" font-size="14.5" fill="#6e6e73">round its</text><text x="162" y="293.8" font-size="14.5" fill="#6e6e73">surface</text><rect x="296" y="56" width="116" height="150" rx="12" fill="#f5f5f7"/><ellipse cx="348" cy="148" rx="22" ry="32" fill="#e3e3e8"/><g transform="translate(348 102) rotate(0)"><circle cx="0" cy="0" r="15" fill="#e3e3e8"/></g><line x1="366" y1="134" x2="388" y2="134" stroke="#e3e3e8" stroke-width="7" stroke-linecap="round"/><line x1="348" y1="172" x2="348" y2="132" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="348" y1="132" x2="348" y2="116" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="348" y1="116" x2="348" y2="94" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="348" y1="130" x2="366" y2="134" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><line x1="366" y1="134" x2="388" y2="134" stroke="#eb6834" stroke-width="3" stroke-linecap="round"/><circle cx="348" cy="130" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="348" cy="94" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="348" cy="132" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="348" cy="116" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="388" cy="134" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="366" cy="134" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><circle cx="348" cy="172" r="3.6" fill="#ffffff" stroke="#eb6834" stroke-width="2"/><path d="M414 131 l10 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><text x="298" y="234" font-size="17" font-weight="700" fill="#eb6834">3  Rig</text><text x="298" y="256" font-size="14.5" fill="#6e6e73">Put a skeleton</text><text x="298" y="274.9" font-size="14.5" fill="#6e6e73">of joints</text><text x="298" y="293.8" font-size="14.5" fill="#6e6e73">inside</text><rect x="432" y="56" width="116" height="150" rx="12" fill="#f5f5f7"/><ellipse cx="484" cy="148" rx="22" ry="32" fill="#e3e3e8"/><g transform="translate(484 102) rotate(14)"><circle cx="0" cy="0" r="15" fill="#e3e3e8"/></g><line x1="502" y1="134" x2="515" y2="118.4" stroke="#e3e3e8" stroke-width="7" stroke-linecap="round"/><line x1="484" y1="172" x2="484" y2="132" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><line x1="484" y1="132" x2="484" y2="116" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><line x1="484" y1="116" x2="486.6" y2="94" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><line x1="484" y1="130" x2="502" y2="134" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><line x1="502" y1="134" x2="515" y2="118.4" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><circle cx="484" cy="130" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="515" cy="118.4" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="484" cy="116" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="486.6" cy="94" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="484" cy="132" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="502" cy="134" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><circle cx="484" cy="172" r="3.6" fill="#ffffff" stroke="#d70015" stroke-width="2"/><line x1="446" y1="196" x2="534" y2="196" stroke="#d2d2d7" stroke-width="2"/><path d="M452 190 l6 6 l-6 6 l-6 -6 z" fill="#d70015"/><path d="M490 190 l6 6 l-6 6 l-6 -6 z" fill="#d70015"/><path d="M528 190 l6 6 l-6 6 l-6 -6 z" fill="#d70015"/><path d="M550 131 l10 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#a)"/><text x="434" y="234" font-size="17" font-weight="700" fill="#d70015">4  Animate</text><text x="434" y="256" font-size="14.5" fill="#6e6e73">Pose the</text><text x="434" y="274.9" font-size="14.5" fill="#6e6e73">skeleton at</text><text x="434" y="293.8" font-size="14.5" fill="#6e6e73">key frames</text><rect x="568" y="56" width="116" height="150" rx="12" fill="#f5f5f7"/><ellipse cx="624" cy="182" rx="30" ry="6" fill="#000" fill-opacity=".14"/><ellipse cx="620" cy="148" rx="22" ry="32" fill="url(#sh)"/><g transform="translate(620 102) rotate(0)"><circle cx="0" cy="0" r="15" fill="url(#sh)"/></g><line x1="638" y1="134" x2="660" y2="134" stroke="url(#sh)" stroke-width="7" stroke-linecap="round"/><path d="M676 70 l-12 12 M664 64 l-4 16" fill="none" stroke="#f5b300" stroke-width="2.5" stroke-linecap="round"/><text x="570" y="234" font-size="17" font-weight="700" fill="#12915a">5  Render</text><text x="570" y="256" font-size="14.5" fill="#6e6e73">The computer</text><text x="570" y="274.9" font-size="14.5" fill="#6e6e73">works out</text><text x="570" y="293.8" font-size="14.5" fill="#6e6e73">light and</text><text x="570" y="312.7" font-size="14.5" fill="#6e6e73">shadow</text>
</svg>
