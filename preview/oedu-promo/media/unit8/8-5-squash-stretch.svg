<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Left: a ball bouncing along a dashed arc. It is round at the top, stretched along its path as it falls fast, flattened wide where it lands, and stretched again as it rises. Right, keep the volume: a round ball; a squashed ball that grows wider as it gets flatter, marked correct; and a ball that is only flattened, so it looks smaller, marked wrong.</title>
<rect width="700" height="440" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Squash and stretch</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">A bouncing ball flattens when it lands and stretches when it moves fast.</text><line x1="24" y1="300" x2="420" y2="300" stroke="#6e6e73" stroke-width="2"/><path d="M44 112 C54 118.7 84 133 104 152 C124 171 142 203.3 164 226 C186 248.7 212 288 236 288 C260 288 286 248.7 308 226 C330 203.3 350 168.3 368 152 C386 135.7 408 132 416 128" fill="none" stroke="#d2d2d7" stroke-width="1.5" stroke-dasharray="4 5"/><ellipse cx="44" cy="112" rx="20" ry="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.8"/><ellipse cx="104" cy="152" rx="16" ry="25" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.8" transform="rotate(-32 104 152)"/><ellipse cx="164" cy="226" rx="14" ry="29" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.8" transform="rotate(-24 164 226)"/><ellipse cx="236" cy="289" rx="30" ry="11" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.8"/><ellipse cx="308" cy="226" rx="14" ry="29" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.8" transform="rotate(24 308 226)"/><ellipse cx="368" cy="152" rx="16" ry="25" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.8" transform="rotate(32 368 152)"/><ellipse cx="416" cy="128" rx="20" ry="20" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.8"/><text x="236" y="328" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">squash on landing</text><text x="138" y="262" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="end">stretch</text><text x="138" y="280" font-size="15" fill="#6e6e73" text-anchor="end">falling fast</text><text x="334" y="262" font-size="15" font-weight="700" fill="#2a78d6">stretch</text><text x="334" y="280" font-size="15" fill="#6e6e73">rising fast</text><text x="72" y="116" font-size="15" fill="#6e6e73">round at the top</text><line x1="446" y1="84" x2="446" y2="420" stroke="#e6e6e8" stroke-width="1.5"/><text x="468" y="104" font-size="17" font-weight="700" fill="#1d1d1f">Keep the volume</text><ellipse cx="512" cy="146" rx="30" ry="30" fill="#2a78d6" stroke="#1d1d1f" stroke-width="2"/><text x="468" y="200" font-size="15" fill="#1d1d1f">Round</text><ellipse cx="512" cy="250" rx="42" ry="21.4" fill="#2a78d6" stroke="#1d1d1f" stroke-width="2"/><path d="M559 250 l5 5 l10 -11" fill="none" stroke="#12915a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="468" y="295.4" font-size="15" fill="#1d1d1f">Squashed: wider as it</text><text x="468" y="314.9" font-size="15" fill="#1d1d1f">gets flatter</text><ellipse cx="512" cy="362" rx="30" ry="15" fill="#ffffff" stroke="#d70015" stroke-width="2" stroke-dasharray="5 4"/><path d="M560 356 L572 368 M572 356 L560 368" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><text x="468" y="402" font-size="15" fill="#1d1d1f">Only flattened: it looks</text><text x="468" y="421.5" font-size="15" fill="#1d1d1f">smaller</text>
</svg>
