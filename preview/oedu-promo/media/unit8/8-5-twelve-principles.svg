<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 884" width="700" height="884" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>The twelve principles of animation from Frank Thomas and Ollie Johnston, 1981, in a grid. 1, squash and stretch: a bouncing ball flattens at the ground and stretches in the air, keeping its volume. 2, anticipation: a character crouches before it jumps. 3, staging: a character in a spotlight on a thirds line. 4, straight ahead and pose to pose: drawings made in order, or the keys first. 5, follow-through and overlapping action: an antenna keeps swinging after the body stops. 6, slow in and slow out: drawings bunched near the start and end. 7, arcs: a ball's curved path. 8, secondary action: a walker's swinging arms and whistled notes. 9, timing: fewer drawings for fast action, more for slow. 10, exaggeration: a surprised face pushed further. 11, solid drawing: a shaded cube and sphere. 12, appeal: a friendly character face.</title>
<defs><marker id="k" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6e6e73"/></marker><radialGradient id="sph" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#ffd9a8"/><stop offset="1" stop-color="#b85c1a"/></radialGradient></defs>
<rect width="700" height="884" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">The twelve principles of animation</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">From Disney animators Frank Thomas and Ollie Johnston, 1981.</text><rect x="18" y="80" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(18 84)"><line x1="20" y1="100" x2="192" y2="100" stroke="#86868b" stroke-width="1.5"/><path d="M34 18 Q70 20 106 90 Q142 20 178 18" fill="none" stroke="#d2d2d7" stroke-width="1.5" stroke-dasharray="3 4"/><ellipse cx="46" cy="30" rx="9" ry="13" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5" transform="rotate(-30 46 30)"/><ellipse cx="82" cy="64" rx="8" ry="16" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5" transform="rotate(-28 82 64)"/><ellipse cx="106" cy="93" rx="19" ry="7" fill="#2a78d6" stroke="#1d1d1f" stroke-width="1.5"/><ellipse cx="130" cy="64" rx="8" ry="16" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5" transform="rotate(28 130 64)"/><circle cx="170" cy="24" r="11" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/></g><circle cx="42" cy="214" r="11" fill="#1d1d1f"/><text x="42" y="218.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="219" font-size="15" font-weight="700" fill="#1d1d1f">Squash and stretch</text><text x="34" y="242" font-size="14" fill="#6e6e73">Bend the shape, keep the</text><text x="34" y="260.2" font-size="14" fill="#6e6e73">volume</text><rect x="244" y="80" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(244 84)"><line x1="20" y1="100" x2="192" y2="100" stroke="#86868b" stroke-width="1.5"/><rect x="44" y="64" width="40" height="36" rx="16.4" fill="#eb6834"/><circle cx="58.4" cy="75.5" r="2.6" fill="#1d1d1f"/><circle cx="70.4" cy="75.5" r="2.6" fill="#1d1d1f"/><rect x="123" y="6" width="26" height="52" rx="11.8" fill="#eb6834" fill-opacity=".35"/><path d="M88 80 Q104 40 118 36" fill="none" stroke="#6e6e73" stroke-width="2" marker-end="url(#k)"/><text x="64" y="58" font-size="14" font-weight="700" fill="#6e6e73" text-anchor="middle">1</text><text x="160" y="30" font-size="14" font-weight="700" fill="#6e6e73" text-anchor="middle">2</text></g><circle cx="268" cy="214" r="11" fill="#1d1d1f"/><text x="268" y="218.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="286" y="219" font-size="15" font-weight="700" fill="#1d1d1f">Anticipation</text><text x="260" y="242" font-size="14" fill="#6e6e73">A small move gets the</text><text x="260" y="260.2" font-size="14" fill="#6e6e73">audience ready</text><rect x="470" y="80" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(470 84)"><rect x="34" y="12" width="144" height="88" rx="3" fill="#ffffff" stroke="#6e6e73" stroke-width="1.5"/><line x1="82" y1="12" x2="82" y2="100" stroke="#d2d2d7" stroke-width="1"/><line x1="130" y1="12" x2="130" y2="100" stroke="#d2d2d7" stroke-width="1"/><line x1="34" y1="41" x2="178" y2="41" stroke="#d2d2d7" stroke-width="1"/><line x1="34" y1="71" x2="178" y2="71" stroke="#d2d2d7" stroke-width="1"/><path d="M130 12 L106 100 L154 100 Z" fill="#f5b300" fill-opacity=".28"/><rect x="119" y="54" width="22" height="40" rx="10" fill="#eb6834"/><circle cx="126.9" cy="66.8" r="2.6" fill="#1d1d1f"/><circle cx="133.5" cy="66.8" r="2.6" fill="#1d1d1f"/><circle cx="56" cy="90" r="5" fill="#d2d2d7"/><circle cx="66" cy="92" r="4" fill="#d2d2d7"/><circle cx="160" cy="92" r="4" fill="#d2d2d7"/></g><circle cx="494" cy="214" r="11" fill="#1d1d1f"/><text x="494" y="218.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="512" y="219" font-size="15" font-weight="700" fill="#1d1d1f">Staging</text><text x="486" y="242" font-size="14" fill="#6e6e73">Make the idea impossible</text><text x="486" y="260.2" font-size="14" fill="#6e6e73">to miss</text><rect x="18" y="280" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(18 284)"><circle cx="48" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="74" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="100" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="126" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="152" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="178" cy="34" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><path d="M44 52 L182 52" fill="none" stroke="#86868b" stroke-width="1.5" marker-end="url(#k)"/><circle cx="48" cy="80" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="74" cy="80" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><circle cx="100" cy="80" r="8" fill="#2a78d6" stroke="#2a78d6" stroke-width="1.5"/><circle cx="126" cy="80" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><circle cx="152" cy="80" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><circle cx="178" cy="80" r="8" fill="#1d1d1f" stroke="#1d1d1f" stroke-width="1.5"/><text x="24" y="39" font-size="14" font-weight="700" fill="#6e6e73">A</text><text x="24" y="85" font-size="14" font-weight="700" fill="#6e6e73">B</text></g><circle cx="42" cy="414" r="11" fill="#1d1d1f"/><text x="42" y="418.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="60" y="419" font-size="15" font-weight="700" fill="#1d1d1f">Straight ahead</text><text x="34" y="442" font-size="14" fill="#6e6e73">…and pose to pose: two</text><text x="34" y="460.2" font-size="14" fill="#6e6e73">ways to draw a scene</text><rect x="244" y="280" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(244 284)"><line x1="20" y1="100" x2="192" y2="100" stroke="#86868b" stroke-width="1.5"/><rect x="73" y="44" width="30" height="56" rx="13.6" fill="#eb6834"/><circle cx="83.8" cy="61.9" r="2.6" fill="#1d1d1f"/><circle cx="92.8" cy="61.9" r="2.6" fill="#1d1d1f"/><path d="M88 46 Q96 20 126.8 10.9" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round" stroke-opacity="0.25"/><circle cx="126.8" cy="10.9" r="5" fill="#d70015" fill-opacity="0.25"/><path d="M88 46 Q104 20 147.2 21.1" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round" stroke-opacity="0.45"/><circle cx="147.2" cy="21.1" r="5" fill="#d70015" fill-opacity="0.45"/><path d="M88 46 Q112 20 160.8 43.8" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round" stroke-opacity="1"/><circle cx="160.8" cy="43.8" r="5" fill="#d70015" fill-opacity="1"/><path d="M30 70 h22 M24 80 h26 M32 90 h18" fill="none" stroke="#86868b" stroke-width="2" stroke-linecap="round"/></g><circle cx="268" cy="414" r="11" fill="#1d1d1f"/><text x="268" y="418.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="286" y="419" font-size="15" font-weight="700" fill="#1d1d1f">Follow-through</text><text x="260" y="442" font-size="14" fill="#6e6e73">…and overlapping action:</text><text x="260" y="460.2" font-size="14" fill="#6e6e73">loose parts keep moving</text><rect x="470" y="280" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(470 284)"><line x1="24" y1="60" x2="188" y2="60" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="30" cy="60" r="8" fill="#1d1d1f"/><circle cx="35.8" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="52.3" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="76.9" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="106" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="135.1" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="159.7" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="176.2" cy="60" r="5" fill="#2a78d6" fill-opacity=".8"/><circle cx="182" cy="60" r="8" fill="#1d1d1f"/><text x="30" y="92" font-size="14" font-weight="600" fill="#6e6e73" text-anchor="middle">slow</text><text x="106" y="92" font-size="14" font-weight="600" fill="#6e6e73" text-anchor="middle">fast</text><text x="182" y="92" font-size="14" font-weight="600" fill="#6e6e73" text-anchor="middle">slow</text></g><circle cx="494" cy="414" r="11" fill="#1d1d1f"/><text x="494" y="418.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">6</text><text x="512" y="419" font-size="15" font-weight="700" fill="#1d1d1f">Slow in and slow out</text><text x="486" y="442" font-size="14" fill="#6e6e73">More drawings near each</text><text x="486" y="460.2" font-size="14" fill="#6e6e73">pose</text><rect x="18" y="480" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(18 484)"><line x1="20" y1="100" x2="192" y2="100" stroke="#86868b" stroke-width="1.5"/><path d="M30 98 Q106 -40 182 98" fill="none" stroke="#2a78d6" stroke-width="2" stroke-dasharray="5 5"/><circle cx="30" cy="98" r="5" fill="#2a78d6" fill-opacity=".45"/><circle cx="55.3" cy="59.7" r="5" fill="#2a78d6" fill-opacity=".45"/><circle cx="80.7" cy="36.7" r="5" fill="#2a78d6" fill-opacity=".45"/><circle cx="106" cy="29" r="8" fill="#2a78d6"/><circle cx="131.3" cy="36.7" r="5" fill="#2a78d6" fill-opacity=".45"/><circle cx="156.7" cy="59.7" r="5" fill="#2a78d6" fill-opacity=".45"/><circle cx="182" cy="98" r="5" fill="#2a78d6" fill-opacity=".45"/></g><circle cx="42" cy="614" r="11" fill="#1d1d1f"/><text x="42" y="618.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="60" y="619" font-size="15" font-weight="700" fill="#1d1d1f">Arcs</text><text x="34" y="642" font-size="14" fill="#6e6e73">Natural movement travels</text><text x="34" y="660.2" font-size="14" fill="#6e6e73">in curves</text><rect x="244" y="480" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(244 484)"><line x1="20" y1="100" x2="192" y2="100" stroke="#86868b" stroke-width="1.5"/><circle cx="96" cy="26" r="11" fill="#ffffff" stroke="#1d1d1f" stroke-width="2"/><line x1="96" y1="37" x2="96" y2="68" stroke="#1d1d1f" stroke-width="2.5"/><line x1="96" y1="68" x2="82" y2="98" stroke="#1d1d1f" stroke-width="2.5"/><line x1="96" y1="68" x2="112" y2="96" stroke="#1d1d1f" stroke-width="2.5"/><path d="M96 44 L80 62" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><path d="M96 44 L112 60" fill="none" stroke="#d70015" stroke-width="3" stroke-linecap="round"/><path d="M70 56 q10 16 26 18" fill="none" stroke="#d70015" stroke-width="1.5" stroke-dasharray="3 3"/><path d="M122 24 v-14 h8 M120 24 a3 2.4 0 1 0 2 0 M140 36 v-12 h7 M138 36 a3 2.4 0 1 0 2 0" fill="none" stroke="#8f5cff" stroke-width="2"/><circle cx="118.5" cy="24.5" r="3" fill="#8f5cff"/><circle cx="136.5" cy="36.5" r="3" fill="#8f5cff"/></g><circle cx="268" cy="614" r="11" fill="#1d1d1f"/><text x="268" y="618.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">8</text><text x="286" y="619" font-size="15" font-weight="700" fill="#1d1d1f">Secondary action</text><text x="260" y="642" font-size="14" fill="#6e6e73">A smaller move that</text><text x="260" y="660.2" font-size="14" fill="#6e6e73">supports the main one</text><rect x="470" y="480" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(470 484)"><text x="24" y="38" font-size="14" font-weight="600" fill="#6e6e73">fast</text><text x="24" y="84" font-size="14" font-weight="600" fill="#6e6e73">slow</text><circle cx="70" cy="33" r="6" fill="#2a78d6"/><circle cx="126" cy="33" r="6" fill="#2a78d6"/><circle cx="182" cy="33" r="6" fill="#2a78d6"/><circle cx="70" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="84" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="98" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="112" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="126" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="140" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="154" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="168" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><circle cx="182" cy="79" r="6" fill="#2a78d6" fill-opacity=".85"/><line x1="64" y1="52" x2="182" y2="52" stroke="#e6e6e8" stroke-width="1"/></g><circle cx="494" cy="614" r="11" fill="#1d1d1f"/><text x="494" y="618.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">9</text><text x="512" y="619" font-size="15" font-weight="700" fill="#1d1d1f">Timing</text><text x="486" y="642" font-size="14" fill="#6e6e73">Fewer drawings, faster</text><text x="486" y="660.2" font-size="14" fill="#6e6e73">action</text><rect x="18" y="680" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(18 684)"><circle cx="66" cy="56" r="26" fill="#f1c7a5" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="57" cy="48" r="5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.2"/><circle cx="75" cy="48" r="5" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.2"/><circle cx="57" cy="48" r="2.2" fill="#1d1d1f"/><circle cx="75" cy="48" r="2.2" fill="#1d1d1f"/><ellipse cx="66" cy="68" rx="4" ry="5" fill="#8a1c1c"/><circle cx="150" cy="56" r="30" fill="#f1c7a5" stroke="#1d1d1f" stroke-width="1.5"/><circle cx="141" cy="48" r="11" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.2"/><circle cx="159" cy="48" r="11" fill="#ffffff" stroke="#1d1d1f" stroke-width="1.2"/><circle cx="141" cy="48" r="2.2" fill="#1d1d1f"/><circle cx="159" cy="48" r="2.2" fill="#1d1d1f"/><ellipse cx="150" cy="84" rx="9" ry="17" fill="#8a1c1c"/><path d="M140 18 l-5 -8 M150 16 l0 -9 M160 18 l5 -8" fill="none" stroke="#1d1d1f" stroke-width="1.6"/><path d="M100 56 l14 0" fill="none" stroke="#86868b" stroke-width="2" marker-end="url(#k)"/></g><circle cx="42" cy="814" r="11" fill="#1d1d1f"/><text x="42" y="818.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><text x="60" y="819" font-size="15" font-weight="700" fill="#1d1d1f">Exaggeration</text><text x="34" y="842" font-size="14" fill="#6e6e73">Push it further than real</text><text x="34" y="860.2" font-size="14" fill="#6e6e73">life</text><rect x="244" y="680" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(244 684)"><ellipse cx="150" cy="96" rx="30" ry="6" fill="#000" fill-opacity=".12"/><circle cx="150" cy="64" r="28" fill="url(#sph)"/><path d="M40 44 L72 30 L104 44 L72 58 Z" fill="#dfe9f7" stroke="#1d1d1f" stroke-width="1.2"/><path d="M40 44 L72 58 L72 96 L40 82 Z" fill="#b7cbe6" stroke="#1d1d1f" stroke-width="1.2"/><path d="M72 58 L104 44 L104 82 L72 96 Z" fill="#8aa8d2" stroke="#1d1d1f" stroke-width="1.2"/></g><circle cx="268" cy="814" r="11" fill="#1d1d1f"/><text x="268" y="818.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">11</text><text x="286" y="819" font-size="15" font-weight="700" fill="#1d1d1f">Solid drawing</text><text x="260" y="842" font-size="14" fill="#6e6e73">Shapes with weight and</text><text x="260" y="860.2" font-size="14" fill="#6e6e73">depth</text><rect x="470" y="680" width="212" height="186" rx="14" fill="#f5f5f7"/><g transform="translate(470 684)"><circle cx="106" cy="58" r="36" fill="#ffd8a8" stroke="#1d1d1f" stroke-width="1.5"/><path d="M76 42 q30 -40 60 0 q-12 -14 -30 -14 q-18 0 -30 14 z" fill="#3b2a20"/><ellipse cx="94" cy="58" rx="6" ry="8" fill="#1d1d1f"/><ellipse cx="118" cy="58" rx="6" ry="8" fill="#1d1d1f"/><circle cx="96" cy="55" r="2" fill="#ffffff"/><circle cx="120" cy="55" r="2" fill="#ffffff"/><circle cx="86" cy="72" r="5" fill="#ff9e9e" fill-opacity=".7"/><circle cx="126" cy="72" r="5" fill="#ff9e9e" fill-opacity=".7"/><path d="M100 76 q6 6 12 0" fill="none" stroke="#1d1d1f" stroke-width="2" stroke-linecap="round"/></g><circle cx="494" cy="814" r="11" fill="#1d1d1f"/><text x="494" y="818.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">12</text><text x="512" y="819" font-size="15" font-weight="700" fill="#1d1d1f">Appeal</text><text x="486" y="842" font-size="14" fill="#6e6e73">A character people want</text><text x="486" y="860.2" font-size="14" fill="#6e6e73">to watch</text>
</svg>
