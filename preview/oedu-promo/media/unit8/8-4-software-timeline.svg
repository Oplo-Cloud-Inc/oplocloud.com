="310" x2="480" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="500" y1="310" x2="500" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="520" y1="310" x2="520" y2="414" stroke="#e6e6e8" stroke-width="1"/><text x="550" y="302" font-size="13.5" font-weight="600" fill="#6e6e73" text-anchor="middle">20</text><line x1="540" y1="310" x2="540" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="560" y1="310" x2="560" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="580" y1="310" x2="580" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="600" y1="310" x2="600" y2="414" stroke="#e6e6e8" stroke-width="1"/><text x="630" y="302" font-size="13.5" font-weight="600" fill="#6e6e73" text-anchor="middle">24</text><line x1="620" y1="310" x2="620" y2="414" stroke="#e6e6e8" stroke-width="1"/><line x1="44" y1="310" x2="656" y2="310" stroke="#d2d2d7" stroke-width="1"/><text x="56" y="347" font-size="15" font-weight="600" fill="#1d1d1f">Ball</text><line x1="44" y1="365" x2="656" y2="365" stroke="#e6e6e8" stroke-width="1"/><text x="56" y="393" font-size="15" font-weight="600" fill="#1d1d1f">Background</text><line x1="44" y1="411" x2="656" y2="411" stroke="#e6e6e8" stroke-width="1"/><rect x="170" y="331" width="220" height="22" fill="#eaf2fc"/><path d="M180 342 L378 342" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/><rect x="390" y="331" width="240" height="22" fill="#eaf2fc"/><path d="M400 342 L618 342" fill="none" stroke="#2a78d6" stroke-width="1.6" marker-end="url(#a)"/><circle cx="170" cy="342" r="6" fill="#1d1d1f"/><circle cx="390" cy="342" r="6" fill="#1d1d1f"/><circle cx="630" cy="342" r="6" fill="#1d1d1f"/><rect x="170" y="377" width="460" height="22" fill="#ececee"/><circle cx="170" cy="388" r="6" fill="#1d1d1f"/><rect x="626" y="380" width="8" height="16" fill="none" stroke="#6e6e73" stroke-width="1.5"/><line x1="270" y1="290" x2="270" y2="420" stroke="#d70015" stroke-width="2"/><path d="M270 284 l7 0 l0 8 l-7 7 l-7 -7 l0 -8 z" fill="#d70015"/><circle cx="170" cy="320" r="10" fill="#eb6834"/><text x="170" y="324.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><circle cx="280" cy="364" r="10" fill="#eb6834"/><text x="280" y="368.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><circle cx="286" cy="284" r="10" fill="#eb6834"/><text x="286" y="288.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><circle cx="144.6" cy="174.1" r="10" fill="#eb6834"/><text x="144.6" y="178.6" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><circle cx="34" cy="461" r="10" fill="#eb6834"/><text x="34" y="465.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="54" y="466" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Keyframe</tspan> — a pose you set yourself (the black dots)</text><circle cx="34" cy="489" r="10" fill="#eb6834"/><text x="34" y="493.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="54" y="494" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Tween</tspan> — frames the software fills in between two keyframes</text><circle cx="34" cy="517" r="10" fill="#eb6834"/><text x="34" y="521.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="54" y="522" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Playhead</tspan> — the frame showing on the stage — here, frame 6</text><circle cx="34" cy="545" r="10" fill="#eb6834"/><text x="34" y="549.5" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="54" y="550" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Onion skin</tspan> — faded copies of nearby frames, to compare against</text>
</svg>
