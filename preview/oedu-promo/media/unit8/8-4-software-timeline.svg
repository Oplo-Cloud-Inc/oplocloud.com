<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 570" width="700" height="570" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A sketch of animation software. On top, the stage shows a ball on a curved path, with two faded copies of earlier frames behind it — the onion skin. Underneath, a timeline numbered 1 to 24 has two layers. The Ball layer has keyframes, shown as black dots, at frames 1, 12 and 24, with shaded tweens between them that the software fills in. The Background layer has one keyframe at frame 1, held to frame 24. A red playhead stands at frame 6, the frame showing on the stage.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2a78d6"/></marker></defs>
<rect width="700" height="570" fill="#ffffff"/>
<text x="24" y="36" font-size="20" font-weight="700" fill="#1d1d1f">Inside animation software</text><text x="24" y="60" font-size="15.5" fill="#6e6e73">Most programs look like this: the stage on top, the timeline underneath.</text><rect x="24" y="78" width="652" height="356" rx="12" fill="#f5f5f7" stroke="#d2d2d7" stroke-width="1.5"/><circle cx="44" cy="94" r="5" fill="#ff5f57"/><circle cx="60" cy="94" r="5" fill="#febc2e"/><circle cx="76" cy="94" r="5" fill="#28c840"/><rect x="44" y="110" width="612" height="160" fill="#eef5fc" stroke="#d2d2d7" stroke-width="1"/><path d="M44 250 Q160 196 300 236 T560 222 L656 236 L656 270 L44 270 Z" fill="#d7ecdf"/><circle cx="600" cy="146" r="16" fill="#ffe28a"/><line x1="44" y1="250" x2="656" y2="250" stroke="#9bc9ad" stroke-width="1.5"/><path d="M80 236 C84 234 96.1 227.8 104.2 223.7 C112.3 219.7 120.3 215.7 128.4 211.7 C136.5 207.8 144.5 203.9 152.6 200.1 C160.7 196.4 168.7 192.7 176.8 189.2 C184.9 185.7 192.9 182.4 201 179.2 C209.1 176 217.1 173 225.2 170.2 C233.3 167.4 241.3 164.8 249.4 162.5 C257.5 160.1 265.5 158 273.6 156.1 C281.7 154.2 289.7 152.6 297.8 151.2 C305.9 149.8 313.9 148.7 322 147.9 C330.1 147.1 338.1 146.5 346.2 146.2 C354.3 145.9 362.3 145.9 370.4 146.2 C378.5 146.5 386.5 147.1 394.6 147.9 C402.7 148.7 410.7 149.8 418.8 151.2 C426.9 152.6 434.9 154.2 443 156.1 C451.1 158 459.1 160.1 467.2 162.5 C475.3 164.8 483.3 167.4 491.4 170.2 C499.5 173 507.5 176 515.6 179.2 C523.7 182.4 531.7 185.7 539.8 189.2 C547.9 192.7 555.9 196.4 564 200.1 C572.1 203.9 580.1 207.8 588.2 211.7 C596.3 215.7 604.3 219.7 612.4 223.7 C620.5 227.8 632.6 234 636.6 236" fill="none" stroke="#86868b" stroke-width="1.2" stroke-dasharray="3 5"/><circle cx="80" cy="236" r="14" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="346.2" cy="146.2" r="14" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="636.6" cy="236" r="14" fill="none" stroke="#1d1d1f" stroke-width="1.5" stroke-d