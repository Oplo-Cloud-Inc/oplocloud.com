e="#86868b" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="640" cy="216" r="16" fill="#2a78d6" stroke="#1d1d1f" stroke-width="2"/><text x="60" y="200" font-size="1" fill="#6e6e73"></text><text x="350" y="86" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Key 2</text><text x="50" y="190" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Key 1</text><text x="646" y="190" font-size="16" font-weight="700" fill="#2a78d6" text-anchor="middle">Key 3</text><text x="175" y="126" font-size="15" font-weight="600" fill="#1d1d1f" text-anchor="end">Breakdown</text><text x="525" y="126" font-size="15" font-weight="600" fill="#1d1d1f">Breakdown</text><text x="130.3" y="220.2" font-size="15" font-weight="600" fill="#6e6e73">In-between</text><line x1="128.3" y1="206.2" x2="118.3" y2="198.2" stroke="#6e6e73" stroke-width="1.2"/><text x="24" y="252" font-size="1" fill="#6e6e73"></text><rect x="38" y="258" width="44" height="40" rx="6" fill="#2a78d6"/><text x="60" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60" y="318" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">K</text><rect x="86.3" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="108.3" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">2</text><text x="108.3" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="134.7" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="156.7" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">3</text><text x="156.7" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="183" y="258" width="44" height="40" rx="6" fill="#9cc0ea"/><text x="205" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">4</text><text x="205" y="318" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">B</text><rect x="231.3" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="253.3" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">5</text><text x="253.3" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="279.6" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="301.6" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">6</text><text x="301.6" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="328" y="258" width="44" height="40" rx="6" fill="#2a78d6"/><text x="350" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">7</text><text x="350" y="318" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">K</text><rect x="376.3" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="398.3" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">8</text><text x="398.3" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="424.6" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="446.6" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">9</text><text x="446.6" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="473" y="258" width="44" height="40" rx="6" fill="#9cc0ea"/><text x="495" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">10</text><text x="495" y="318" font-size="15" font-weight="700" fill="#1d1d1f" text-anchor="middle">B</text><rect x="521.3" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="543.3" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">11</text><text x="543.3" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="569.6" y="258" width="44" height="40" rx="6" fill="#f5f5f7"/><text x="591.6" y="284" font-size="16" font-weight="700" fill="#1d1d1f" text-anchor="middle">12</text><text x="591.6" y="318" font-size="15" font-weight="700" fill="#86868b" text-anchor="middle">i</text><rect x="618" y="258" width="44" height="40" rx="6" fill="#2a78d6"/><text x="640" y="284" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">13</text><text x="640" y="318" font-size="15" font-weight="700" fill="#2a78d6" text-anchor="middle">K</text><circle cx="34" cy="357" r="8" fill="#2a78d6"/><text x="52" y="362" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Key</tspan> — a main pose, drawn first — where a move starts, ends or changes direction</text><circle cx="34" cy="387" r="8" fill="#9cc0ea" stroke="#2a78d6" stroke-width="1.5"/><text x="52" y="392" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">Breakdown</tspan> — the drawing that decides how the move gets from one key to the next</text><circle cx="34" cy="417" r="8" fill="#ffffff" stroke="#86868b" stroke-width="1.5"/><text x="52" y="422" font-size="15" fill="#6e6e73"><tspan font-weight="700" fill="#1d1d1f">In-between</tspan> — every other frame, filling the gaps smoothly</text>
</svg>
