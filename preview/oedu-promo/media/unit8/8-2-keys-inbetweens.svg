<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A ball hops across thirteen frames along an arc. Frames 1, 7 and 13 are keys: the take-off, the top of the hop and the landing. Frames 4 and 10 are breakdowns, which decide how the ball travels between keys. The rest are in-betweens. A row of numbered frames below marks each one K, B or i. A key is a main pose drawn first, wherever a move starts, ends or changes direction — not just the first frame.</title>
<rect width="700" height="440" fill="#ffffff"/>
